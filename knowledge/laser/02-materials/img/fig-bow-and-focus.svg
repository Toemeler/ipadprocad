<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="How a bowed sheet moves in and out of focus">
  <rect x="0" y="0" width="480" height="230" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">A 3 mm bow is enough to leave parts attached</text>

    <line x1="30" y1="150" x2="450" y2="150" stroke="#9a9a9a" stroke-width="3"/>
    <path d="M40 150 q200 -56 400 0" fill="none" stroke="#1a1a1a" stroke-width="7"/>
    <path d="M40 150 q200 -56 400 0" fill="none" stroke="#d9c9ac" stroke-width="4"/>

    <g stroke="#0b6bcb" stroke-width="1.2" stroke-dasharray="4 3">
      <line x1="30" y1="112" x2="450" y2="112"/>
      <line x1="30" y1="128" x2="450" y2="128"/>
    </g>
    <text x="458" y="118" text-anchor="end" fill="#0b6bcb" font-size="10">focal depth</text>

    <g stroke="#2e7d32" stroke-width="2" fill="#2e7d32">
      <line x1="240" y1="70" x2="240" y2="112"/><polygon points="235,112 240,122 245,112"/>
    </g>
    <text x="240" y="64" text-anchor="middle" fill="#2e7d32" font-weight="600">in focus — cuts through</text>

    <g stroke="#c62828" stroke-width="2" fill="#c62828">
      <line x1="70" y1="70" x2="70" y2="138"/><polygon points="65,138 70,148 75,138"/>
      <line x1="418" y1="70" x2="418" y2="138"/><polygon points="413,138 418,148 423,138"/>
    </g>
    <text x="70" y="64" text-anchor="middle" fill="#c62828" font-weight="600">out of focus</text>
    <text x="418" y="64" text-anchor="middle" fill="#c62828" font-weight="600">out of focus</text>

    <text x="20" y="184" font-size="12" font-weight="600">Inconsistent ACROSS the bed = flatness. Uniformly weak = power, lens or focus.</text>
    <text x="20" y="206" font-size="11" fill="#5a5a5a">Magnets on a steel honeycomb pull a slight bow flat. A properly warped sheet needs misting, weighting</text>
    <text x="20" y="222" font-size="11" fill="#5a5a5a">overnight and full drying — damp plywood is a genuine fire and fume risk.</text>
  </g>
</svg>
