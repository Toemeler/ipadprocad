<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="Section through a plywood cut edge showing glue lines and char">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">3-ply birch, section through the cut</text>

    <!-- plies -->
    <rect x="40" y="60" width="180" height="26" fill="#e0cba8" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="40" y="86" width="180" height="34" fill="#d6bd95" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="40" y="120" width="180" height="26" fill="#e0cba8" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="266" y="60" width="180" height="26" fill="#e0cba8" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="266" y="86" width="180" height="34" fill="#d6bd95" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="266" y="120" width="180" height="26" fill="#e0cba8" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- glue lines -->
    <g stroke="#4a3418" stroke-width="3">
      <line x1="40" y1="86" x2="220" y2="86"/><line x1="40" y1="120" x2="220" y2="120"/>
      <line x1="266" y1="86" x2="446" y2="86"/><line x1="266" y1="120" x2="446" y2="120"/>
    </g>

    <!-- charred kerf walls, wavy -->
    <path d="M220 60 C 228 78, 214 100, 224 120 L 226 146 L 220 146 Z" fill="#3a2a16"/>
    <path d="M266 60 C 258 80, 272 102, 262 120 L 260 146 L 266 146 Z" fill="#3a2a16"/>

    <text x="243" y="52" text-anchor="middle" font-size="11" fill="#0b6bcb">kerf ≈ 0.28 mm</text>
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="221" y1="56" x2="265" y2="56"/>
      <line x1="221" y1="50" x2="221" y2="62"/><line x1="265" y1="50" x2="265" y2="62"/>
    </g>

    <text x="66" y="172" font-size="11" fill="#4a3418">← glue lines burn differently from the wood</text>
    <text x="20" y="200" font-size="12" fill="#5a5a5a">The kerf wall is charred and not perfectly straight through the thickness.</text>
    <text x="20" y="214" font-size="12" font-weight="600">This is why plywood joints need measured slots, not nominal ones.</text>
  </g>
</svg>
