<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 220" width="490" height="220" role="img" aria-label="Raw MDF cut edge next to a sealed and painted one">
  <rect x="0" y="0" width="490" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">MDF edge, raw and finished</text>

    <rect x="30" y="48" width="180" height="76" fill="#a8896a" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="30" y="48" width="180" height="76" fill="#1e1710" opacity="0.6"/>
    <g stroke="#e8e0d5" stroke-width="1" opacity="0.5">
      <line x1="34" y1="50" x2="38" y2="44"/><line x1="60" y1="50" x2="64" y2="43"/>
      <line x1="96" y1="50" x2="92" y2="43"/><line x1="140" y1="50" x2="145" y2="44"/>
      <line x1="184" y1="50" x2="180" y2="43"/>
    </g>
    <text x="120" y="146" text-anchor="middle" font-weight="600">raw</text>
    <text x="120" y="164" text-anchor="middle" font-size="11" fill="#5a5a5a">near black, slightly furry</text>

    <rect x="270" y="48" width="180" height="76" fill="#cfd6d9" stroke="#1a1a1a" stroke-width="2"/>
    <text x="360" y="146" text-anchor="middle" font-weight="600">sealed + 2 coats</text>
    <text x="360" y="164" text-anchor="middle" font-size="11" fill="#5a5a5a">why the material is still worth using</text>

    <text x="20" y="190" font-size="11" fill="#5a5a5a">The raw edge is what the laser always gives you. Plan on painting, or</text><text x="20" y="204" font-size="11" fill="#5a5a5a">choose another material.</text>
  </g>
</svg>
