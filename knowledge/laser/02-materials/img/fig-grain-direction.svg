<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="The same slot cut across and along the grain">
  <rect x="0" y="0" width="480" height="230" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">The same slot, two grain directions</text>

    <!-- across grain: good -->
    <rect x="28" y="48" width="184" height="110" fill="#e0cba8" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#b79a6d" stroke-width="2">
      <line x1="28" y1="64" x2="212" y2="64"/><line x1="28" y1="82" x2="212" y2="82"/>
      <line x1="28" y1="100" x2="212" y2="100"/><line x1="28" y1="118" x2="212" y2="118"/>
      <line x1="28" y1="136" x2="212" y2="136"/>
    </g>
    <rect x="104" y="66" width="16" height="74" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#2e7d32" stroke-width="2.5" fill="none"><path d="M176 132 l7 8 l15 -18"/></g>
    <text x="120" y="180" text-anchor="middle" font-weight="600">slot across the grain</text>
    <text x="120" y="196" text-anchor="middle" font-size="11" fill="#5a5a5a">fibres run past the slot — it holds</text>

    <!-- along grain: bad -->
    <rect x="268" y="48" width="184" height="110" fill="#e0cba8" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#b79a6d" stroke-width="2">
      <line x1="290" y1="48" x2="290" y2="158"/><line x1="312" y1="48" x2="312" y2="158"/>
      <line x1="334" y1="48" x2="334" y2="158"/><line x1="378" y1="48" x2="378" y2="158"/>
      <line x1="404" y1="48" x2="404" y2="158"/><line x1="430" y1="48" x2="430" y2="158"/>
    </g>
    <rect x="352" y="66" width="16" height="74" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M352 66 L346 48 M368 140 L374 158" stroke="#c62828" stroke-width="3" fill="none"/>
    <text x="360" y="180" text-anchor="middle" font-weight="600">slot along the grain</text>
    <text x="360" y="196" text-anchor="middle" font-size="11" fill="#c62828">short fibres split out under hand pressure</text>

    <text x="20" y="222" font-size="11" fill="#5a5a5a">Solid wood only. Plywood's cross-plies make this much less severe.</text>
  </g>
</svg>
