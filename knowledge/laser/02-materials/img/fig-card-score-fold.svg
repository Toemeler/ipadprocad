<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="A scored card blank and the same blank folded">
  <rect x="0" y="0" width="480" height="230" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Score on the inside, then fold</text>

    <!-- flat blank -->
    <polygon points="30,70 190,70 190,150 30,150" fill="#cfcabb" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="30,46 190,46 190,70 30,70" fill="#dcd8cc" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="30,150 190,150 190,174 30,174" fill="#dcd8cc" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#0b6bcb" stroke-width="1.6" stroke-dasharray="7 4">
      <line x1="30" y1="70" x2="190" y2="70"/><line x1="30" y1="150" x2="190" y2="150"/>
    </g>
    <text x="110" y="198" text-anchor="middle" font-weight="600">flat blank</text>
    <text x="110" y="214" text-anchor="middle" font-size="11" fill="#0b6bcb">blue = score, ~60 % of thickness</text>

    <!-- folded -->
    <polygon points="290,150 410,150 410,80 290,80" fill="#cfcabb" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="290,80 410,80 436,58 316,58" fill="#dcd8cc" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="410,150 436,128 436,58 410,80" fill="#c2bdae" stroke="#1a1a1a" stroke-width="2"/>
    <text x="360" y="198" text-anchor="middle" font-weight="600">folded by hand</text>
    <text x="360" y="214" text-anchor="middle" font-size="11" fill="#5a5a5a">same file, no extra parts</text>
  </g>
</svg>
