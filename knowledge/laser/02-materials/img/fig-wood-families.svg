<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 265" width="520" height="265" role="img" aria-label="The four wood families and their cut edges">
  <rect x="0" y="0" width="520" height="265" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">The four wood families, at the cut edge</text>

    <g>
      <rect x="24" y="46" width="96" height="66" fill="#d9c9ac" stroke="#1a1a1a" stroke-width="2"/>
      <g stroke="#6b5636" stroke-width="3"><line x1="24" y1="68" x2="120" y2="68"/><line x1="24" y1="90" x2="120" y2="90"/></g>
      <rect x="24" y="46" width="96" height="66" fill="#6b4a25" opacity="0.22"/>
      <text x="72" y="132" text-anchor="middle" font-weight="600">birch plywood</text>
      <text x="72" y="150" text-anchor="middle" fill="#2e7d32">structure · press fits · screws</text>
      <text x="72" y="166" text-anchor="middle" fill="#5a5a5a">glue lines show</text>
      <text x="72" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#2e7d32">the default</text>
    </g>

    <g>
      <rect x="138" y="46" width="96" height="66" fill="#e3cfa8" stroke="#1a1a1a" stroke-width="2"/>
      <g stroke="#c4a877" stroke-width="2">
        <line x1="138" y1="58" x2="234" y2="58"/><line x1="138" y1="76" x2="234" y2="76"/><line x1="138" y1="98" x2="234" y2="98"/>
      </g>
      <text x="186" y="132" text-anchor="middle" font-weight="600">solid hardwood</text>
      <text x="186" y="150" text-anchor="middle" fill="#5a5a5a">visible pieces · engraving</text>
      <text x="186" y="166" text-anchor="middle" fill="#c62828">will not repeat</text>
    </g>

    <g>
      <rect x="252" y="46" width="96" height="66" fill="#8a7053" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="252" y="46" width="96" height="66" fill="#2a2119" opacity="0.55"/>
      <text x="300" y="132" text-anchor="middle" font-weight="600">MDF</text>
      <text x="300" y="150" text-anchor="middle" fill="#5a5a5a">jigs · painted parts</text>
      <text x="300" y="166" text-anchor="middle" fill="#c62828">edge is black · needs extraction</text>
    </g>

    <g>
      <rect x="366" y="46" width="96" height="66" fill="#e6d7b4" stroke="#1a1a1a" stroke-width="2"/>
      <g stroke="#cbb88c" stroke-width="2">
        <line x1="386" y1="46" x2="386" y2="112"/><line x1="406" y1="46" x2="406" y2="112"/><line x1="426" y1="46" x2="426" y2="112"/><line x1="446" y1="46" x2="446" y2="112"/>
      </g>
      <text x="414" y="132" text-anchor="middle" font-weight="600">laminated bamboo</text>
      <text x="414" y="150" text-anchor="middle" fill="#2e7d32">repeatable · best engraving</text>
      <text x="414" y="166" text-anchor="middle" fill="#5a5a5a">splits along laminations</text>
    </g>

    <text x="20" y="220" font-size="11" fill="#5a5a5a">Wood takes a press fit and takes a screw. That is why this folder defaults</text><text x="20" y="234" font-size="11" fill="#5a5a5a">to it.</text>
    <text x="20" y="234" font-size="11" fill="#5a5a5a">The cut edge is what the process gives you for free, and the hardest thing</text><text x="20" y="248" font-size="11" fill="#5a5a5a">to change afterwards.</text>
  </g>
</svg>
