<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-label="The spread of actual thicknesses in nominal 3 mm plywood">
  <rect x="0" y="0" width="480" height="240" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">"3 mm" plywood, as EN 315 allows it</text>

    <line x1="40" y1="140" x2="446" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
    <g stroke="#1a1a1a" stroke-width="1.2">
      <line x1="60" y1="140" x2="60" y2="148"/><line x1="156" y1="140" x2="156" y2="148"/>
      <line x1="252" y1="140" x2="252" y2="148"/><line x1="348" y1="140" x2="348" y2="148"/>
      <line x1="444" y1="140" x2="444" y2="148"/>
    </g>
    <g text-anchor="middle" fill="#5a5a5a">
      <text x="60" y="164">2.6</text><text x="156" y="164">2.8</text><text x="252" y="164">3.0</text>
      <text x="348" y="164">3.2</text><text x="444" y="164">3.4 mm</text>
    </g>

    <rect x="60" y="94" width="336" height="40" fill="#c62828" opacity="0.14"/>
    <text x="228" y="88" text-anchor="middle" fill="#c62828" font-weight="600">in specification: 2.6 – 3.3 mm</text>

    <rect x="228" y="104" width="48" height="20" fill="#2e7d32" opacity="0.28"/>
    <text x="252" y="118" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="600">premium ±0.1</text>

    <line x1="252" y1="60" x2="252" y2="140" stroke="#0b6bcb" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="252" y="54" text-anchor="middle" fill="#0b6bcb">what the label says</text>

    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="180" y1="188" x2="324" y2="188"/>
      <line x1="180" y1="182" x2="180" y2="194"/><line x1="324" y1="182" x2="324" y2="194"/>
    </g>
    <text x="252" y="208" text-anchor="middle" fill="#0b6bcb">0.2–0.3 mm variation inside ONE bundle is also in spec</text>

    <text x="20" y="232" font-size="11" fill="#c62828">That swing is more than twice the kerf. Measure the sheet; the label is not a dimension.</text>
  </g>
</svg>
