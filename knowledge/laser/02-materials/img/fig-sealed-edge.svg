<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="A sealed laser-cut fabric edge next to a frayed scissor-cut edge">
  <rect x="0" y="0" width="480" height="230" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Why the heat is a feature</text>

    <rect x="34" y="50" width="170" height="86" fill="#c9d4c4" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="204" y1="50" x2="204" y2="136" stroke="#5a6b53" stroke-width="5"/>
    <g stroke="#2e7d32" stroke-width="2.5" fill="none"><path d="M158 112 l7 8 l15 -18"/></g>
    <text x="119" y="160" text-anchor="middle" font-weight="600">laser cut</text>
    <text x="119" y="176" text-anchor="middle" font-size="11" fill="#5a5a5a">edge sealed, will not shed</text>

    <rect x="276" y="50" width="170" height="86" fill="#c9d4c4" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#8a9a83" stroke-width="1.6">
      <line x1="446" y1="56" x2="462" y2="52"/><line x1="446" y1="68" x2="464" y2="70"/>
      <line x1="446" y1="80" x2="460" y2="76"/><line x1="446" y1="92" x2="466" y2="95"/>
      <line x1="446" y1="104" x2="459" y2="100"/><line x1="446" y1="120" x2="463" y2="124"/>
    </g>
    <circle cx="452" cy="88" r="18" fill="none" stroke="#c62828" stroke-width="2"/>
    <text x="361" y="160" text-anchor="middle" font-weight="600">scissor cut</text>
    <text x="361" y="176" text-anchor="middle" font-size="11" fill="#c62828">frays immediately</text>

    <text x="20" y="200" font-size="11" fill="#5a5a5a">Wool felt, cotton and most synthetics behave this way. Chrome-tanned</text><text x="20" y="214" font-size="11" fill="#5a5a5a">leather is unsafe — see never-cut-these.</text>
  </g>
</svg>
