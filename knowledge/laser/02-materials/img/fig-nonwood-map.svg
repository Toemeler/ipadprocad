<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="Where each non wood material earns its place">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Four things wood cannot do</text>

    <g stroke="#1a1a1a" stroke-width="1.6">
      <rect x="24" y="44" width="140" height="48" rx="4" fill="#e8eef2"/>
      <rect x="24" y="100" width="140" height="48" rx="4" fill="#efeadd"/>
      <rect x="248" y="44" width="140" height="48" rx="4" fill="#dfe6d9"/>
      <rect x="248" y="100" width="140" height="48" rx="4" fill="#eaeaea"/>
    </g>
    <text x="94" y="66" text-anchor="middle" font-weight="600">cast acrylic</text>
    <text x="94" y="84" text-anchor="middle" font-size="11" fill="#5a5a5a">transparent · perfect edge</text>
    <text x="94" y="122" text-anchor="middle" font-weight="600">greyboard</text>
    <text x="94" y="140" text-anchor="middle" font-size="11" fill="#5a5a5a">costs nothing · mock-ups</text>
    <text x="318" y="66" text-anchor="middle" font-weight="600">leather / felt</text>
    <text x="318" y="84" text-anchor="middle" font-size="11" fill="#5a5a5a">soft · drapes · seals itself</text>
    <text x="318" y="122" text-anchor="middle" font-weight="600">POM (Delrin)</text>
    <text x="318" y="140" text-anchor="middle" font-size="11" fill="#5a5a5a">low friction · gears</text>

    <text x="20" y="180" font-size="12" font-weight="600">Anything else is a dimension problem wearing a material disguise.</text>
    <text x="20" y="202" font-size="11" fill="#c62828">None of them survives outdoors either. Wood wicks and delaminates; acrylic crazes in UV.</text>
  </g>
</svg>
