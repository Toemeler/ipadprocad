<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-label="The same engraving in cast and extruded acrylic">
  <rect x="0" y="0" width="480" height="250" rx="10" fill="#ffffff"/>
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Same file, same settings, different sheet</text>

    <rect x="30" y="46" width="190" height="110" fill="#e8eef2" stroke="#1a1a1a" stroke-width="2"/>
    <text x="125" y="112" text-anchor="middle" font-size="38" font-weight="700" fill="#ffffff" stroke="#b9c6cf" stroke-width="1">ABC</text>
    <text x="125" y="176" text-anchor="middle" font-weight="600" fill="#2e7d32">cast (GS)</text>
    <text x="125" y="194" text-anchor="middle" font-size="11" fill="#5a5a5a">frosted white, sharp edges</text>

    <rect x="260" y="46" width="190" height="110" fill="#e8eef2" stroke="#1a1a1a" stroke-width="2"/>
    <text x="355" y="112" text-anchor="middle" font-size="38" font-weight="700" fill="#9aa4ab" filter="url(#blur)">ABC</text>
    <text x="355" y="176" text-anchor="middle" font-weight="600" fill="#c62828">extruded (XT)</text>
    <text x="355" y="194" text-anchor="middle" font-size="11" fill="#5a5a5a">grey and blurred</text>

    <text x="240" y="220" text-anchor="middle" font-size="12" font-weight="600">If the part is engraved, it must be cast. Nothing in the file can</text><text x="240" y="236" text-anchor="middle" font-size="12" font-weight="600">fix this.</text>
  </g>
</svg>
