<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 245" width="550" height="245" role="img" aria-label="An inlay and its pocket cut from the same file">
  <rect x="0" y="0" width="550" height="245" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Inlay: one outline, two parts</text>

    <rect x="30" y="46" width="150" height="100" fill="#d9c9ac" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="105" cy="96" r="38" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="105" y="170" text-anchor="middle" font-weight="600">pocket in the substrate</text>
    <text x="105" y="186" text-anchor="middle" fill="#5a5a5a">cut path centred → comes out ½ kerf larger</text>

    <circle cx="300" cy="96" r="34" fill="#e6d7b4" stroke="#1a1a1a" stroke-width="2"/>
    <text x="300" y="170" text-anchor="middle" font-weight="600">inlay</text>
    <text x="300" y="186" text-anchor="middle" fill="#5a5a5a">same outline → comes out ½ kerf smaller</text>

    <g stroke="#2e7d32" stroke-width="2" fill="#2e7d32">
      <line x1="356" y1="96" x2="380" y2="96"/><polygon points="380,91 392,96 380,101"/>
    </g>
    <circle cx="432" cy="96" r="34" fill="#d9c9ac" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="432" cy="96" r="30" fill="#e6d7b4" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="432" y="170" text-anchor="middle" font-weight="600" fill="#2e7d32">fits, one kerf loose</text>
    <text x="432" y="186" text-anchor="middle" fill="#2e7d32">which is the right gap for glue</text>

    <text x="20" y="216" font-size="11" fill="#5a5a5a">For a press-fit inlay, offset the pocket inward by half a kerf. Hold</text><text x="20" y="230" font-size="11" fill="#5a5a5a">veneer flat — it lifts into the beam.</text>
  </g>
</svg>
