<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 245" width="510" height="245" role="img" aria-label="Captive nut, cross dowel and nut trapped in a stack">
  <rect x="0" y="0" width="510" height="245" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Three ways to get a metal thread into thin sheet</text>

    <g>
      <rect x="26" y="52" width="126" height="80" fill="#d9c9ac" stroke="#1a1a1a" stroke-width="2"/>
      <polygon points="68,76 90,76 101,92 90,108 68,108 57,92" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="1.5"/>
      <rect x="26" y="88" width="34" height="8" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="1.2"/>
      <text x="89" y="156" text-anchor="middle" font-weight="600">captive hex nut</text>
      <text x="89" y="172" text-anchor="middle" fill="#5a5a5a">nut lies in the sheet plane</text>
      <text x="89" y="188" text-anchor="middle" fill="#5a5a5a">needs sheet ≥ nut thickness</text>
    </g>

    <g>
      <rect x="180" y="52" width="126" height="80" fill="#d9c9ac" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="222" y="66" width="18" height="52" rx="9" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="1.5"/>
      <rect x="180" y="88" width="42" height="8" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="1.2"/>
      <text x="243" y="156" text-anchor="middle" font-weight="600">cross dowel</text>
      <text x="243" y="172" text-anchor="middle" fill="#2e7d32">strongest of the three</text>
      <text x="243" y="188" text-anchor="middle" fill="#5a5a5a">standard flat-pack hardware</text>
    </g>

    <g>
      <g fill="#d9c9ac" stroke="#1a1a1a" stroke-width="1.5">
        <rect x="334" y="52" width="126" height="20"/><rect x="334" y="72" width="126" height="26"/><rect x="334" y="98" width="126" height="20"/>
      </g>
      <polygon points="378,76 396,76 405,85 396,94 378,94 369,85" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="1.2"/>
      <text x="397" y="156" text-anchor="middle" font-weight="600">nut trapped in a stack</text>
      <text x="397" y="172" text-anchor="middle" fill="#2e7d32">invisible from outside</text>
      <text x="397" y="188" text-anchor="middle" fill="#5a5a5a">a hex hole in exactly one layer</text>
    </g>

    <text x="20" y="216" font-size="11" fill="#5a5a5a">All three beat a screw into the edge, and all three survive being opened</text><text x="20" y="230" font-size="11" fill="#5a5a5a">repeatedly.</text>
    <text x="20" y="224" font-size="1" fill="#ffffff">.</text>
  </g>
</svg>
