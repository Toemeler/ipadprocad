<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-label="The same tab shown in four slots: press, slip, clearance and running fit">
  <rect x="0" y="0" width="480" height="250" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">One 3 mm tab, four slots</text>

    <!-- press -->
    <g>
      <rect x="30" y="60" width="38" height="90" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="82" y="60" width="38" height="90" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="66" y="46" width="18" height="118" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <text x="75" y="186" text-anchor="middle" font-weight="600">press</text>
      <text x="75" y="202" text-anchor="middle" fill="#5a5a5a">−0.08 mm</text>
      <text x="75" y="218" text-anchor="middle" fill="#5a5a5a">mallet</text>
    </g>

    <!-- slip -->
    <g>
      <rect x="145" y="60" width="36" height="90" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="199" y="60" width="36" height="90" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="182" y="46" width="18" height="118" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <text x="190" y="186" text-anchor="middle" font-weight="600">slip</text>
      <text x="190" y="202" text-anchor="middle" fill="#5a5a5a">+0.05 mm</text>
      <text x="190" y="218" text-anchor="middle" fill="#5a5a5a">thumb</text>
    </g>

    <!-- clearance -->
    <g>
      <rect x="258" y="60" width="34" height="90" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="314" y="60" width="34" height="90" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="296" y="46" width="18" height="118" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <text x="303" y="186" text-anchor="middle" font-weight="600">clearance</text>
      <text x="303" y="202" text-anchor="middle" fill="#5a5a5a">+0.30 mm</text>
      <text x="303" y="218" text-anchor="middle" fill="#5a5a5a">drops in</text>
    </g>

    <!-- running -->
    <g>
      <rect x="372" y="60" width="32" height="90" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="430" y="60" width="32" height="90" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="412" y="46" width="18" height="118" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <text x="417" y="186" text-anchor="middle" font-weight="600">running</text>
      <text x="417" y="202" text-anchor="middle" fill="#5a5a5a">+0.45 mm</text>
      <text x="417" y="218" text-anchor="middle" fill="#5a5a5a">turns</text>
    </g>

    <text x="20" y="242" font-size="11" fill="#5a5a5a">Only the slot changes. Steps of roughly a tenth of a millimetre decide how the assembly behaves.</text>
  </g>
</svg>
