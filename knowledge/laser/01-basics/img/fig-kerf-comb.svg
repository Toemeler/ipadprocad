<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-label="A 100 mm rectangle cut into ten strips, reassembled to measure nine kerfs">
  <rect x="0" y="0" width="480" height="250" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Nine cuts, ten strips</text>

    <text x="20" y="54" fill="#5a5a5a">1 — as drawn</text>
    <rect x="20" y="62" width="400" height="44" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#1a1a1a" stroke-width="2">
      <line x1="60" y1="62" x2="60" y2="106"/><line x1="100" y1="62" x2="100" y2="106"/>
      <line x1="140" y1="62" x2="140" y2="106"/><line x1="180" y1="62" x2="180" y2="106"/>
      <line x1="220" y1="62" x2="220" y2="106"/><line x1="260" y1="62" x2="260" y2="106"/>
      <line x1="300" y1="62" x2="300" y2="106"/><line x1="340" y1="62" x2="340" y2="106"/>
      <line x1="380" y1="62" x2="380" y2="106"/>
    </g>
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="20" y1="120" x2="420" y2="120"/>
      <line x1="20" y1="114" x2="20" y2="126"/><line x1="420" y1="114" x2="420" y2="126"/>
    </g>
    <text x="220" y="138" text-anchor="middle" fill="#0b6bcb">100.00 mm</text>

    <text x="20" y="168" fill="#5a5a5a">2 — cut, then squeezed back together</text>
    <rect x="20" y="176" width="364" height="44" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#1a1a1a" stroke-width="1">
      <line x1="56" y1="176" x2="56" y2="220"/><line x1="92" y1="176" x2="92" y2="220"/>
      <line x1="128" y1="176" x2="128" y2="220"/><line x1="164" y1="176" x2="164" y2="220"/>
      <line x1="200" y1="176" x2="200" y2="220"/><line x1="236" y1="176" x2="236" y2="220"/>
      <line x1="272" y1="176" x2="272" y2="220"/><line x1="308" y1="176" x2="308" y2="220"/>
      <line x1="344" y1="176" x2="344" y2="220"/>
    </g>
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="384" y1="198" x2="420" y2="198"/>
      <line x1="384" y1="192" x2="384" y2="204"/><line x1="420" y1="192" x2="420" y2="204"/>
    </g>
    <text x="402" y="238" text-anchor="middle" fill="#0b6bcb">9 × kerf</text>
    <text x="20" y="242" font-size="12" font-weight="600" fill="#2e7d32">kerf = (100.00 − measured length) ÷ 9</text>
  </g>
</svg>
