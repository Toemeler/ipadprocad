<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="A fit coupon with five labelled slots 0.05 mm apart and one test tab">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Fit coupon — five slots, 0.05 mm apart</text>

    <rect x="20" y="46" width="330" height="110" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="2">
      <rect x="42" y="66" width="14" height="60"/>
      <rect x="106" y="66" width="15" height="60"/>
      <rect x="170" y="66" width="16" height="60"/>
      <rect x="234" y="66" width="17" height="60"/>
      <rect x="298" y="66" width="18" height="60"/>
    </g>
    <g font-size="11" text-anchor="middle" fill="#1a1a1a">
      <text x="49" y="146">2.47</text>
      <text x="113" y="146">2.52</text>
      <text x="178" y="146">2.57</text>
      <text x="242" y="146">2.62</text>
      <text x="307" y="146">2.67</text>
    </g>
    <text x="185" y="176" text-anchor="middle" font-size="11" fill="#5a5a5a">engrave the number next to every slot, or the coupon is useless</text>

    <rect x="392" y="46" width="22" height="110" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <text x="403" y="176" text-anchor="middle" font-size="11">test tab</text>

    <text x="20" y="206" font-size="12" fill="#2e7d32">Needs a tap → press fit. Needs thumb pressure → slip fit. Write both down.</text>
  </g>
</svg>
