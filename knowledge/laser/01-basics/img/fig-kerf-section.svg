<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-label="Cross section through a laser cut showing the kerf and its slight taper">
  <rect x="0" y="0" width="480" height="260" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Section through the sheet, looking along the cut</text>

    <!-- beam -->
    <g stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
      <line x1="230" y1="44" x2="230" y2="100"/>
      <path d="M225 94 l5 8 l5 -8" fill="#8a8a8a" stroke="none"/>
    </g>
    <text x="242" y="56" fill="#5a5a5a">beam</text>

    <!-- material, tapered gap -->
    <polygon points="40,110 214,110 221,200 40,200" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="246,110 440,110 440,200 239,200" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <text x="110" y="160">material</text>
    <text x="330" y="160">material</text>

    <!-- kerf dimension, top -->
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="214" y1="96" x2="246" y2="96"/>
      <line x1="214" y1="90" x2="214" y2="110"/>
      <line x1="246" y1="90" x2="246" y2="110"/>
    </g>
    <text x="230" y="82" text-anchor="middle" fill="#0b6bcb">kerf ≈ 0.20 mm</text>

    <!-- bottom dimension -->
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="221" y1="214" x2="239" y2="214"/>
      <line x1="221" y1="200" x2="221" y2="220"/>
      <line x1="239" y1="200" x2="239" y2="220"/>
    </g>
    <text x="230" y="238" text-anchor="middle" fill="#0b6bcb">narrower at the bottom face</text>

    <text x="20" y="258" font-size="12" fill="#5a5a5a">The beam is a cone, so the cut is slightly V-shaped. Kerf is quoted at the top face.</text>
  </g>
</svg>
