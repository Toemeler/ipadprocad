<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210" role="img" aria-label="A curve as arcs versus as short polyline segments">
  <rect x="0" y="0" width="480" height="210" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">How the curve reaches the machine</text>

    <path d="M40 140 C 70 60, 160 60, 190 140" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="115" y="170" text-anchor="middle" font-weight="600" fill="#2e7d32">arcs</text>
    <text x="115" y="188" text-anchor="middle" font-size="11" fill="#2e7d32">the head moves continuously</text>

    <polyline points="290,140 296,122 304,106 314,92 326,82 340,76 356,74 372,76 386,82 398,92 408,106 416,122 422,140"
              fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
    <g fill="#c62828">
      <circle cx="296" cy="122" r="2.6"/><circle cx="304" cy="106" r="2.6"/><circle cx="314" cy="92" r="2.6"/>
      <circle cx="326" cy="82" r="2.6"/><circle cx="340" cy="76" r="2.6"/><circle cx="356" cy="74" r="2.6"/>
      <circle cx="372" cy="76" r="2.6"/><circle cx="386" cy="82" r="2.6"/><circle cx="398" cy="92" r="2.6"/>
      <circle cx="408" cy="106" r="2.6"/><circle cx="416" cy="122" r="2.6"/>
    </g>
    <text x="356" y="170" text-anchor="middle" font-weight="600" fill="#c62828">0.5 mm segments</text>
    <text x="356" y="188" text-anchor="middle" font-size="11" fill="#c62828">decelerates at every vertex — faceted, scorched</text>

    <text x="20" y="206" font-size="11" fill="#5a5a5a">Convert splines to arcs or polylines at 0.05 mm chord tolerance. Keep true circles as circles.</text>
  </g>
</svg>
