<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-label="Cut order: engrave, score, internal cuts, outline last">
  <rect x="0" y="0" width="480" height="240" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Cut order</text>

    <g>
      <rect x="24" y="46" width="98" height="78" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="48" y="66" width="50" height="22" fill="#1a1a1a"/>
      <text x="73" y="146" text-anchor="middle" font-weight="600">1 · Engrave</text>
      <text x="73" y="162" text-anchor="middle" fill="#5a5a5a">sheet still whole</text>
    </g>
    <g>
      <rect x="138" y="46" width="98" height="78" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="162" y="66" width="50" height="22" fill="#1a1a1a"/>
      <line x1="148" y1="104" x2="226" y2="104" stroke="#0000ff" stroke-width="1.5"/>
      <text x="187" y="146" text-anchor="middle" font-weight="600">2 · Score</text>
    </g>
    <g>
      <rect x="252" y="46" width="98" height="78" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="276" y="66" width="50" height="22" fill="#1a1a1a"/>
      <line x1="262" y1="104" x2="340" y2="104" stroke="#0000ff" stroke-width="1.5"/>
      <circle cx="276" cy="58" r="5" fill="#ffffff" stroke="#ff0000" stroke-width="1.5"/>
      <circle cx="326" cy="58" r="5" fill="#ffffff" stroke="#ff0000" stroke-width="1.5"/>
      <text x="301" y="146" text-anchor="middle" font-weight="600">3 · Inside cuts</text>
      <text x="301" y="162" text-anchor="middle" fill="#5a5a5a">still held by the sheet</text>
    </g>
    <g>
      <rect x="366" y="46" width="98" height="78" fill="#d9d9d9" stroke="#ff0000" stroke-width="2.5"/>
      <rect x="390" y="66" width="50" height="22" fill="#1a1a1a"/>
      <line x1="376" y1="104" x2="454" y2="104" stroke="#0000ff" stroke-width="1.5"/>
      <circle cx="390" cy="58" r="5" fill="#ffffff" stroke="#ff0000" stroke-width="1.5"/>
      <circle cx="440" cy="58" r="5" fill="#ffffff" stroke="#ff0000" stroke-width="1.5"/>
      <text x="415" y="146" text-anchor="middle" font-weight="600">4 · Outline</text>
      <text x="415" y="162" text-anchor="middle" fill="#2e7d32">last</text>
    </g>

    <text x="20" y="200" font-size="12" font-weight="600">A part must keep its detail cut while the surrounding sheet still holds it.</text>
    <text x="20" y="222" font-size="11" fill="#5a5a5a">Once the outline is cut the part is loose: it can lift into the beam, drop through the honeycomb, or simply shift.</text>
  </g>
</svg>
