<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" width="480" height="290" role="img" aria-label="Five stacked layers where a hole in the middle three becomes a sealed cavity">
  <rect x="0" y="0" width="480" height="290" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">A hole in the middle layers is a cavity</text>

    <!-- exploded -->
    <g stroke="#1a1a1a" stroke-width="2" fill="#d9d9d9">
      <rect x="40" y="56" width="180" height="20"/>
      <g>
        <rect x="40" y="90" width="66" height="20"/><rect x="154" y="90" width="66" height="20"/>
      </g>
      <g>
        <rect x="40" y="124" width="66" height="20"/><rect x="154" y="124" width="66" height="20"/>
      </g>
      <g>
        <rect x="40" y="158" width="66" height="20"/><rect x="154" y="158" width="66" height="20"/>
      </g>
      <rect x="40" y="192" width="180" height="20"/>
    </g>
    <g font-size="11" fill="#5a5a5a" text-anchor="end">
      <text x="34" y="70">L1</text><text x="34" y="104">L2</text><text x="34" y="138">L3</text>
      <text x="34" y="172">L4</text><text x="34" y="206">L5</text>
    </g>
    <text x="130" y="236" text-anchor="middle" font-size="11">five parts off the machine</text>

    <!-- arrow -->
    <g stroke="#1a1a1a" stroke-width="2" fill="#1a1a1a">
      <line x1="248" y1="132" x2="280" y2="132"/>
      <polygon points="280,126 292,132 280,138"/>
    </g>

    <!-- assembled -->
    <rect x="310" y="56" width="140" height="156" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3">
      <line x1="310" y1="90" x2="450" y2="90"/><line x1="310" y1="124" x2="450" y2="124"/>
      <line x1="310" y1="158" x2="450" y2="158"/><line x1="310" y1="192" x2="450" y2="192"/>
    </g>
    <rect x="356" y="90" width="48" height="102" fill="#ffffff" stroke="#0b6bcb" stroke-width="2"/>
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="420" y1="90" x2="420" y2="192"/>
      <line x1="414" y1="90" x2="426" y2="90"/><line x1="414" y1="192" x2="426" y2="192"/>
    </g>
    <text x="380" y="236" text-anchor="middle" font-size="11" fill="#0b6bcb">depth = 3 × sheet thickness</text>

    <text x="20" y="266" font-size="12" font-weight="600">Pocket depth is always a whole number of sheet thicknesses.</text>
    <text x="20" y="282" font-size="11" fill="#5a5a5a">A 4 mm pocket in 3 mm sheet is either 3 mm or 6 mm — round the component to the layer grid, or add a shim layer.</text>
  </g>
</svg>
