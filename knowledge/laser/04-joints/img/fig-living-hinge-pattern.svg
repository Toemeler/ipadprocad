<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-label="Lattice hinge brick pattern with spacing, link and slit length labelled">
  <rect x="0" y="0" width="480" height="250" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Lattice hinge — brick pattern</text>

    <rect x="30" y="46" width="420" height="130" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round">
      <line x1="60" y1="58" x2="60" y2="118"/><line x1="60" y1="134" x2="60" y2="166"/>
      <line x1="84" y1="58" x2="84" y2="88"/><line x1="84" y1="104" x2="84" y2="166"/>
      <line x1="108" y1="58" x2="108" y2="118"/><line x1="108" y1="134" x2="108" y2="166"/>
      <line x1="132" y1="58" x2="132" y2="88"/><line x1="132" y1="104" x2="132" y2="166"/>
      <line x1="156" y1="58" x2="156" y2="118"/><line x1="156" y1="134" x2="156" y2="166"/>
      <line x1="180" y1="58" x2="180" y2="88"/><line x1="180" y1="104" x2="180" y2="166"/>
      <line x1="204" y1="58" x2="204" y2="118"/><line x1="204" y1="134" x2="204" y2="166"/>
      <line x1="228" y1="58" x2="228" y2="88"/><line x1="228" y1="104" x2="228" y2="166"/>
      <line x1="252" y1="58" x2="252" y2="118"/><line x1="252" y1="134" x2="252" y2="166"/>
      <line x1="276" y1="58" x2="276" y2="88"/><line x1="276" y1="104" x2="276" y2="166"/>
      <line x1="300" y1="58" x2="300" y2="118"/><line x1="300" y1="134" x2="300" y2="166"/>
      <line x1="324" y1="58" x2="324" y2="88"/><line x1="324" y1="104" x2="324" y2="166"/>
    </g>

    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="300" y1="196" x2="324" y2="196"/>
      <line x1="300" y1="190" x2="300" y2="202"/><line x1="324" y1="190" x2="324" y2="202"/>
      <line x1="360" y1="88" x2="360" y2="104"/>
      <line x1="354" y1="88" x2="366" y2="88"/><line x1="354" y1="104" x2="366" y2="104"/>
    </g>
    <text x="312" y="216" text-anchor="middle" fill="#0b6bcb">spacing 1.0 mm</text>
    <text x="374" y="100" fill="#0b6bcb">link 3 mm</text>
    <text x="374" y="150" fill="#0b6bcb">slit 20–40 mm</text>

    <text x="20" y="240" font-size="11" fill="#5a5a5a">Slits run parallel to the bend axis. Spacing sets the radius, link length sets the fatigue life.</text>
  </g>
</svg>
