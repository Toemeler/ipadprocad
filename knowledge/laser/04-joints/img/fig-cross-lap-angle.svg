<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="Slot width for a non-perpendicular cross lap">
  <rect x="0" y="0" width="480" height="230" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Crossing at an angle</text>

    <!-- 90 deg -->
    <rect x="34" y="58" width="170" height="90" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="110" y="58" width="18" height="50" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="119" y="172" text-anchor="middle" font-weight="600">90°</text>
    <text x="119" y="190" text-anchor="middle" font-size="11" fill="#0b6bcb">slot = 3.00 mm</text>

    <!-- 60 deg -->
    <rect x="272" y="58" width="170" height="90" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="344,58 365,58 336,108 315,108" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M344 58 L344 90" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="M344 84 A 26 26 0 0 0 330 92" fill="none" stroke="#0b6bcb" stroke-width="1.2"/>
    <text x="356" y="96" font-size="11" fill="#0b6bcb">60°</text>
    <text x="357" y="172" text-anchor="middle" font-weight="600">60°</text>
    <text x="357" y="190" text-anchor="middle" font-size="11" fill="#0b6bcb">slot = 3.00 / sin 60° = 3.46 mm</text>

    <text x="20" y="216" font-size="11" fill="#c62828">Drawing an angled slot at nominal thickness is why angled grids simply will not assemble.</text>
  </g>
</svg>
