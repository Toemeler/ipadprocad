<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="A test swatch bent around a former of the target radius">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Cut the swatch before you commit</text>

    <rect x="34" y="52" width="130" height="110" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round">
      <line x1="52" y1="62" x2="52" y2="106"/><line x1="52" y1="120" x2="52" y2="152"/>
      <line x1="70" y1="62" x2="70" y2="86"/><line x1="70" y1="100" x2="70" y2="152"/>
      <line x1="88" y1="62" x2="88" y2="106"/><line x1="88" y1="120" x2="88" y2="152"/>
      <line x1="106" y1="62" x2="106" y2="86"/><line x1="106" y1="100" x2="106" y2="152"/>
      <line x1="124" y1="62" x2="124" y2="106"/><line x1="124" y1="120" x2="124" y2="152"/>
      <line x1="142" y1="62" x2="142" y2="86"/><line x1="142" y1="100" x2="142" y2="152"/>
    </g>
    <text x="99" y="186" text-anchor="middle" font-size="11">60 × 60 mm, same sheet, same settings</text>

    <!-- bent around former -->
    <circle cx="330" cy="110" r="38" fill="#eef1f3" stroke="#9a9a9a" stroke-width="2"/>
    <path d="M292 110 A 38 38 0 0 1 330 72 L 330 60 A 50 50 0 0 0 280 110 Z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M330 72 A 38 38 0 0 1 368 110 L 380 110 A 50 50 0 0 0 330 60 Z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="330" y1="110" x2="368" y2="110"/>
    </g>
    <text x="348" y="128" font-size="11" fill="#0b6bcb">target radius</text>
    <text x="330" y="186" text-anchor="middle" font-size="11">bend it round the real radius</text>

    <text x="20" y="210" font-size="11" fill="#c62828">Not optional: plywood batches vary enough to change the outcome. Try both grain orientations.</text>
  </g>
</svg>
