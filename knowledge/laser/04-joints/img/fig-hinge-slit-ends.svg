<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-label="Square slit ends crack, rounded ends survive">
  <rect x="0" y="0" width="480" height="240" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">The slit end decides how long the hinge lives</text>

    <!-- square, cracked -->
    <rect x="34" y="50" width="180" height="100" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="118" y="62" width="4" height="52" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M120 114 l-10 16 l6 12" fill="none" stroke="#c62828" stroke-width="2.5"/>
    <circle cx="120" cy="114" r="16" fill="none" stroke="#c62828" stroke-width="2"/>
    <text x="124" y="176" text-anchor="middle" font-weight="600">square end</text>
    <text x="124" y="192" text-anchor="middle" font-size="11" fill="#c62828">stress concentration — the crack starts here</text>

    <!-- rounded, survives -->
    <rect x="266" y="50" width="180" height="100" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M354 64 v46 a4 4 0 0 0 8 0 v-46 a4 4 0 0 0 -8 0 z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
    <circle cx="358" cy="110" r="16" fill="none" stroke="#2e7d32" stroke-width="2"/>
    <text x="356" y="176" text-anchor="middle" font-weight="600">0.5 mm round end</text>
    <text x="356" y="192" text-anchor="middle" font-size="11" fill="#2e7d32">load spreads — no crack starter</text>

    <text x="20" y="212" font-size="11" fill="#5a5a5a">The single change that most improves survival. A teardrop end is better</text><text x="20" y="226" font-size="11" fill="#5a5a5a">still.</text>
  </g>
</svg>
