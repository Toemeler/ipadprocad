<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="One tab pivots, two tabs hold">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">One tab is a pivot</text>

    <rect x="34" y="60" width="180" height="100" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="114" y="98" width="20" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M124 110 m-40 0 a40 40 0 0 1 12 -28" fill="none" stroke="#c62828" stroke-width="2"/>
    <polygon points="94,80 100,86 92,90" fill="#c62828"/>
    <text x="124" y="184" text-anchor="middle" font-weight="600">1 tab</text>
    <text x="124" y="200" text-anchor="middle" font-size="11" fill="#c62828">rotates freely</text>

    <rect x="266" y="60" width="180" height="100" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="300" y="98" width="20" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="392" y="98" width="20" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="310" y1="140" x2="402" y2="140"/>
      <line x1="310" y1="134" x2="310" y2="146"/><line x1="402" y1="134" x2="402" y2="146"/>
    </g>
    <text x="356" y="160" text-anchor="middle" font-size="11" fill="#0b6bcb">as far apart as the panel allows</text>
    <text x="356" y="184" text-anchor="middle" font-weight="600">2 tabs</text>
    <text x="356" y="200" text-anchor="middle" font-size="11" fill="#2e7d32">resists twisting</text>
  </g>
</svg>
