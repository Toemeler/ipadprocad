<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="A cantilever clip with and without a root fillet">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">A clip always fails at its root</text>

    <path d="M34 60 h80 v22 h-30 v46 h30 v22 h-80 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M114 82 h60 v46 h-60 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="114" cy="82" r="13" fill="none" stroke="#c62828" stroke-width="2"/>
    <path d="M114 82 l-8 -12" stroke="#c62828" stroke-width="2.5"/>
    <text x="104" y="176" text-anchor="middle" font-weight="600">square root</text>
    <text x="104" y="192" text-anchor="middle" font-size="11" fill="#c62828">cracks on the first assembly</text>

    <path d="M274 60 h80 v22 q-30 0 -30 12 v22 q0 12 30 12 v22 h-80 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M354 94 h60 v32 h-60 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#2e7d32" stroke-width="2.5" fill="none"><path d="M418 150 l7 8 l15 -18"/></g>
    <text x="344" y="176" text-anchor="middle" font-weight="600">1 mm root fillet</text>
    <text x="344" y="192" text-anchor="middle" font-size="11" fill="#2e7d32">the load path, not a detail</text>

    <text x="20" y="212" font-size="11" fill="#5a5a5a">Clip length 8 × thickness, width 4 × thickness, tip deflection 0.5 mm.</text>
  </g>
</svg>
