<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-label="A curved form built from terraced stacked contours">
  <rect x="0" y="0" width="480" height="260" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Contour stacking — the sheet is the resolution</text>

    <!-- terraced stack -->
    <g fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2">
      <rect x="40" y="170" width="200" height="22"/>
      <rect x="52" y="148" width="176" height="22"/>
      <rect x="68" y="126" width="144" height="22"/>
      <rect x="88" y="104" width="104" height="22"/>
      <rect x="112" y="82" width="56" height="22"/>
    </g>
    <path d="M40 170 C 60 168, 70 140, 100 110 C 120 90, 130 84, 140 82 C 150 84, 160 90, 180 110 C 210 140, 220 168, 240 170"
          fill="none" stroke="#0b6bcb" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="140" y="212" text-anchor="middle" font-size="11" fill="#0b6bcb">dashed = the intended surface</text>
    <text x="140" y="228" text-anchor="middle" font-size="11" fill="#5a5a5a">step height = sheet thickness</text>

    <!-- finer sheet -->
    <g fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5">
      <rect x="290" y="178" width="160" height="12"/><rect x="296" y="166" width="148" height="12"/>
      <rect x="304" y="154" width="132" height="12"/><rect x="314" y="142" width="112" height="12"/>
      <rect x="326" y="130" width="88" height="12"/><rect x="338" y="118" width="64" height="12"/>
      <rect x="350" y="106" width="40" height="12"/><rect x="358" y="94" width="24" height="12"/>
    </g>
    <text x="370" y="212" text-anchor="middle" font-size="11" fill="#2e7d32">half the sheet thickness</text>
    <text x="370" y="228" text-anchor="middle" font-size="11" fill="#5a5a5a">twice the layers, twice the cut time</text>

    <text x="20" y="252" font-size="11" fill="#5a5a5a">If the form will be sanded smooth, draw every contour 0.5 mm oversize — and keep all layers the same way up.</text>
  </g>
</svg>
