<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-label="Hex pocket dimensions for an M3 captive nut">
  <rect x="0" y="0" width="480" height="240" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">M3 nut pocket, drawn dimensions</text>

    <rect x="40" y="56" width="400" height="130" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="40" y="112" width="150" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="190,96 214,82 238,96 238,146 214,160 190,146" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="238" y="112" width="34" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="40" y1="100" x2="190" y2="100"/>
      <line x1="40" y1="94" x2="40" y2="106"/><line x1="190" y1="94" x2="190" y2="106"/>
      <line x1="256" y1="72" x2="256" y2="112"/>
      <line x1="238" y1="112" x2="272" y2="112"/>
      <line x1="272" y1="104" x2="272" y2="138"/>
    </g>
    <text x="115" y="92" text-anchor="middle" fill="#0b6bcb">nut centre 10 mm from the edge</text>
    <text x="300" y="120" fill="#0b6bcb">slot +2 mm past the nut</text>
    <text x="214" y="182" text-anchor="middle" fill="#0b6bcb">across flats 5.7 mm (nut 5.5 + 0.2)</text>
    <text x="115" y="146" text-anchor="middle" font-size="11">shank slot 3.4 mm</text>

    <text x="20" y="212" font-size="11" fill="#5a5a5a">Kerf compensation matters most here: an uncompensated pocket is one kerf oversize and the nut spins.</text>
    <text x="20" y="230" font-size="11" fill="#5a5a5a">Nut centre distance = screw length − mating panel thickness − 3 mm.</text>
  </g>
</svg>
