<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-label="Finger joint geometry with finger width and depth labelled">
  <rect x="0" y="0" width="480" height="250" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Finger joint — the three numbers</text>

    <!-- panel A with fingers pointing right -->
    <path d="M40 60 H150 V84 H190 V116 H150 V140 H190 V172 H150 V196 H40 Z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <!-- panel B complementary -->
    <path d="M236 60 H346 V196 H236 V172 H196 V140 H236 V116 H196 V84 H236 Z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>

    <!-- finger width dimension -->
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="206" y1="84" x2="206" y2="116"/>
      <line x1="200" y1="84" x2="212" y2="84"/><line x1="200" y1="116" x2="212" y2="116"/>
    </g>
    <text x="222" y="104" fill="#0b6bcb">w = 3 × t</text>

    <!-- finger depth dimension -->
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="150" y1="210" x2="190" y2="210"/>
      <line x1="150" y1="204" x2="150" y2="216"/><line x1="190" y1="204" x2="190" y2="216"/>
    </g>
    <text x="170" y="230" text-anchor="middle" fill="#0b6bcb">d = mating sheet thickness</text>

    <text x="366" y="100">n = odd</text>
    <text x="366" y="118" font-size="11" fill="#5a5a5a">n ≈ round(L / 3t),</text>
    <text x="366" y="134" font-size="11" fill="#5a5a5a">then make it odd</text>

    <text x="20" y="244" font-size="11" fill="#5a5a5a">Depth follows the OTHER panel's measured thickness — on plywood the two sheets differ.</text>
  </g>
</svg>
