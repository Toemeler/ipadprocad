<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="The same panel cut in cardboard as a proof before cutting acrylic">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Twenty minutes in greyboard first</text>

    <rect x="30" y="46" width="190" height="84" fill="#cfcabb" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="52" y="70" width="40" height="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="108" y="76" width="22" height="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="164" cy="82" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="125" y="152" text-anchor="middle" font-weight="600">1.5 mm greyboard</text>
    <text x="125" y="168" text-anchor="middle" fill="#5a5a5a">cheap, fast, disposable</text>

    <g stroke="#1a1a1a" stroke-width="2" fill="#1a1a1a">
      <line x1="240" y1="88" x2="268" y2="88"/><polygon points="268,82 280,88 268,94"/>
    </g>

    <rect x="296" y="46" width="160" height="84" fill="#e8eef2" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="316" y="70" width="34" height="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="364" y="76" width="20" height="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="416" cy="82" r="13" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="376" y="152" text-anchor="middle" font-weight="600">3 mm cast acrylic</text>
    <text x="376" y="168" text-anchor="middle" fill="#5a5a5a">cut once, correctly</text>

    <text x="20" y="200" font-size="11" fill="#2e7d32">The proof catches the connector that is 0.4 mm wider than its datasheet — before the expensive sheet is cut.</text>
  </g>
</svg>
