<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="Assembly order of a finger jointed box: base, long sides, short sides">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">One assembly order, and only one</text>

    <g>
      <polygon points="40,110 110,88 150,104 80,128" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.6"/>
      <text x="95" y="160" text-anchor="middle" font-weight="600">1 · base</text>
    </g>
    <g>
      <polygon points="180,110 250,88 290,104 220,128" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.6"/>
      <polygon points="180,110 180,72 250,50 250,88" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.6"/>
      <polygon points="220,128 220,90 290,66 290,104" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.6"/>
      <text x="235" y="160" text-anchor="middle" font-weight="600">2 · long sides</text>
    </g>
    <g>
      <polygon points="320,110 390,88 430,104 360,128" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.6"/>
      <polygon points="320,110 320,72 390,50 390,88" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.6"/>
      <polygon points="360,128 360,90 430,66 430,104" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.6"/>
      <polygon points="320,72 390,50 430,66 360,90" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="1.6"/>
      <text x="375" y="160" text-anchor="middle" font-weight="600">3 · short sides</text>
    </g>

    <text x="20" y="192" font-size="12" font-weight="600" fill="#2e7d32">Dry-fit the whole box before any glue.</text>
    <text x="20" y="212" font-size="11" fill="#5a5a5a">A finger-jointed box will not go together in any other order, and glue gives you about four minutes to find that out.</text>
  </g>
</svg>
