<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" role="img" aria-label="Fine grain against open grain at the same detail level">
  <rect x="0" y="0" width="500" height="240" rx="10" fill="#ffffff"/>
  <defs>
    <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2.4" fill="#6b5333"/></pattern>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">The grain competes with the image</text>

    <rect x="34" y="46" width="170" height="100" fill="#efe3c8" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="119" cy="96" r="34" fill="url(#dots)"/>
    <g stroke="#e2d4b6" stroke-width="1"><line x1="34" y1="70" x2="204" y2="70"/><line x1="34" y1="120" x2="204" y2="120"/></g>
    <text x="119" y="170" text-anchor="middle" font-weight="600" fill="#2e7d32">maple / basswood / bamboo</text>
    <text x="119" y="186" text-anchor="middle" fill="#2e7d32">fine even grain — the surface gets out of the way</text>

    <rect x="276" y="46" width="170" height="100" fill="#e0cba0" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="361" cy="96" r="34" fill="url(#dots)"/>
    <g stroke="#b99a63" stroke-width="4">
      <line x1="276" y1="58" x2="446" y2="58"/><line x1="276" y1="78" x2="446" y2="78"/>
      <line x1="276" y1="98" x2="446" y2="98"/><line x1="276" y1="118" x2="446" y2="118"/><line x1="276" y1="138" x2="446" y2="138"/>
    </g>
    <text x="361" y="170" text-anchor="middle" font-weight="600" fill="#c62828">oak / ash</text>
    <text x="361" y="186" text-anchor="middle" fill="#c62828">grain is the same scale as the detail</text>

    <text x="20" y="212" font-size="11" fill="#5a5a5a">Above about 400 DPI on wood the extra resolution is lost in the grain. 300</text><text x="20" y="226" font-size="11" fill="#5a5a5a">DPI is the practical default.</text>
  </g>
</svg>
