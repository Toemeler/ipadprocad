<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="Cut through letters lose their islands unless bridged">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Cut-through letters have loose middles</text>

    <rect x="34" y="46" width="180" height="100" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <text x="124" y="118" text-anchor="middle" font-size="56" font-weight="700" fill="#ffffff" stroke="#1a1a1a" stroke-width="2">AB</text>
    <circle cx="112" cy="104" r="7" fill="#c62828" opacity="0.5"/>
    <circle cx="150" cy="90" r="6" fill="#c62828" opacity="0.5"/>
    <circle cx="150" cy="116" r="6" fill="#c62828" opacity="0.5"/>
    <text x="124" y="172" text-anchor="middle" font-weight="600" fill="#c62828">three loose pieces</text>
    <text x="124" y="188" text-anchor="middle" font-size="11" fill="#c62828">they drop through the honeycomb</text>

    <rect x="266" y="46" width="180" height="100" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <text x="356" y="118" text-anchor="middle" font-size="56" font-weight="700" fill="#ffffff" stroke="#1a1a1a" stroke-width="2">AB</text>
    <g stroke="#2e7d32" stroke-width="3">
      <line x1="340" y1="104" x2="348" y2="104"/>
      <line x1="378" y1="90" x2="386" y2="90"/>
      <line x1="378" y1="116" x2="386" y2="116"/>
    </g>
    <text x="356" y="172" text-anchor="middle" font-weight="600" fill="#2e7d32">bridged</text>
    <text x="356" y="188" text-anchor="middle" font-size="11" fill="#2e7d32">or use a stencil typeface</text>

    <text x="20" y="212" font-size="11" fill="#5a5a5a">Letters with this problem: A B D O P Q R a b d e g o p q.</text>
  </g>
</svg>
