<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 240" width="490" height="240" role="img" aria-label="The same mark engraved at 200, 300 and 600 DPI">
  <rect x="0" y="0" width="490" height="240" rx="10" fill="#ffffff"/>
  <defs>
    <pattern id="c200" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="4" fill="#8a6a45"/></pattern>
    <pattern id="c300" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2.6" fill="#8a6a45"/></pattern>
    <pattern id="c600" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="2" height="1.4" fill="#8a6a45"/></pattern>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Same mark, three resolutions, on plywood</text>

    <rect x="30" y="46" width="120" height="90" fill="#e0cba8" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="90" cy="91" r="32" fill="url(#c200)"/>
    <text x="90" y="160" text-anchor="middle" font-weight="600">200 DPI</text>
    <text x="90" y="176" text-anchor="middle" font-size="11" fill="#5a5a5a">×1 time · visible banding</text>

    <rect x="180" y="46" width="120" height="90" fill="#e0cba8" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="240" cy="91" r="32" fill="url(#c300)"/>
    <text x="240" y="160" text-anchor="middle" font-weight="600" fill="#2e7d32">300 DPI</text>
    <text x="240" y="176" text-anchor="middle" font-size="11" fill="#2e7d32">×1.5 · the practical default</text>

    <rect x="330" y="46" width="120" height="90" fill="#e0cba8" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="390" cy="91" r="32" fill="url(#c600)"/>
    <text x="390" y="160" text-anchor="middle" font-weight="600">600 DPI</text>
    <text x="390" y="176" text-anchor="middle" font-size="11" fill="#5a5a5a">×3 · the grain hides the gain</text>

    <text x="20" y="208" font-size="11" fill="#5a5a5a">Above ~400 DPI on wood the extra detail is lost in the grain. On cast</text><text x="20" y="222" font-size="11" fill="#5a5a5a">acrylic and coated metal it shows.</text>
  </g>
</svg>
