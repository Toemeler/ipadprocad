<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-label="A lattice with webs above and below the minimum width">
  <rect x="0" y="0" width="480" height="240" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Lattice in 3 mm plywood</text>

    <!-- good -->
    <rect x="26" y="46" width="190" height="110" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5">
      <rect x="38" y="58" width="36" height="86"/><rect x="88" y="58" width="36" height="86"/>
      <rect x="138" y="58" width="36" height="86"/><rect x="188" y="58" width="16" height="86"/>
    </g>
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="74" y1="168" x2="88" y2="168"/>
      <line x1="74" y1="160" x2="74" y2="176"/><line x1="88" y1="160" x2="88" y2="176"/>
    </g>
    <text x="81" y="188" text-anchor="middle" fill="#0b6bcb">4.5 mm</text>
    <g stroke="#2e7d32" stroke-width="2.5" fill="none"><path d="M182 200 l7 8 l15 -18"/></g>
    <text x="121" y="212" text-anchor="middle" font-weight="600">web = 1.5 × thickness</text>
    <text x="121" y="228" text-anchor="middle" font-size="11" fill="#5a5a5a">survives</text>

    <!-- bad -->
    <rect x="264" y="46" width="190" height="110" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5">
      <rect x="274" y="58" width="40" height="86"/><rect x="316" y="58" width="40" height="86"/>
      <rect x="358" y="58" width="40" height="86"/><rect x="400" y="58" width="40" height="86"/>
    </g>
    <g fill="#c62828" opacity="0.5">
      <rect x="314" y="58" width="2" height="86"/><rect x="356" y="58" width="2" height="86"/>
      <rect x="398" y="58" width="2" height="86"/>
    </g>
    <text x="359" y="188" text-anchor="middle" fill="#c62828">1.4 mm</text>
    <circle cx="336" cy="200" r="11" fill="none" stroke="#c62828" stroke-width="2"/>
    <line x1="329" y1="193" x2="343" y2="207" stroke="#c62828" stroke-width="2"/>
    <text x="359" y="212" text-anchor="middle" font-weight="600">web below the limit</text>
    <text x="359" y="228" text-anchor="middle" font-size="11" fill="#c62828">heat from both cuts meets — chars through</text>
  </g>
</svg>
