<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 265" width="500" height="265" role="img" aria-label="Face grain direction in a plywood sheet and how parts sit on it">
  <rect x="0" y="0" width="500" height="265" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Face grain runs the long way on the sheet</text>

    <rect x="26" y="44" width="200" height="130" fill="#e3cfa8" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#c4a877" stroke-width="1.6">
      <line x1="26" y1="58" x2="226" y2="58"/><line x1="26" y1="74" x2="226" y2="74"/><line x1="26" y1="90" x2="226" y2="90"/>
      <line x1="26" y1="106" x2="226" y2="106"/><line x1="26" y1="122" x2="226" y2="122"/><line x1="26" y1="138" x2="226" y2="138"/>
      <line x1="26" y1="154" x2="226" y2="154"/><line x1="26" y1="170" x2="226" y2="170"/>
    </g>
    <g fill="#d9c9ac" stroke="#1a1a1a" stroke-width="1.5">
      <rect x="36" y="52" width="160" height="22"/>
      <rect x="36" y="82" width="160" height="22"/>
      <rect x="36" y="112" width="120" height="22"/>
    </g>
    <g stroke="#2e7d32" stroke-width="2.5" fill="none"><path d="M196 148 l7 8 l15 -18"/></g>
    <text x="126" y="196" text-anchor="middle" font-weight="600" fill="#2e7d32">long parts along the grain</text>
    <text x="126" y="212" text-anchor="middle" fill="#2e7d32">stiff, and they do not snap</text>

    <rect x="258" y="44" width="200" height="130" fill="#e3cfa8" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#c4a877" stroke-width="1.6">
      <line x1="258" y1="58" x2="458" y2="58"/><line x1="258" y1="74" x2="458" y2="74"/><line x1="258" y1="90" x2="458" y2="90"/>
      <line x1="258" y1="106" x2="458" y2="106"/><line x1="258" y1="122" x2="458" y2="122"/><line x1="258" y1="138" x2="458" y2="138"/>
      <line x1="258" y1="154" x2="458" y2="154"/><line x1="258" y1="170" x2="458" y2="170"/>
    </g>
    <g fill="#d9c9ac" stroke="#1a1a1a" stroke-width="1.5">
      <rect x="268" y="52" width="22" height="114"/>
      <rect x="300" y="52" width="22" height="114"/>
      <rect x="332" y="52" width="22" height="90"/>
      <rect x="366" y="52" width="160" height="0"/>
    </g>
    <path d="M279 100 l-10 0 M311 118 l-10 0" stroke="#c62828" stroke-width="3"/>
    <text x="358" y="196" text-anchor="middle" font-weight="600" fill="#c62828">nested for packing efficiency</text>
    <text x="358" y="212" text-anchor="middle" fill="#c62828">grain across the long axis — they break</text>

    <text x="20" y="234" font-size="11" fill="#5a5a5a">Keeping grain aligned costs 20–30 % of the sheet on a mixed nest. For</text><text x="20" y="248" font-size="11" fill="#5a5a5a">jigs, nest for efficiency and say so.</text>
  </g>
</svg>
