<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210" role="img" aria-label="Holes from 1 mm to 4 mm cut in 3 mm material">
  <rect x="0" y="0" width="480" height="210" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Holes in 3 mm plywood</text>
    <rect x="24" y="44" width="432" height="96" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>

    <!-- 1mm: closed -->
    <circle cx="80" cy="92" r="5" fill="#3a2a16" stroke="#c62828" stroke-width="2"/>
    <text x="80" y="160" text-anchor="middle">1 mm</text>
    <text x="80" y="176" text-anchor="middle" font-size="11" fill="#c62828">chars shut</text>

    <!-- 2mm: oval -->
    <ellipse cx="184" cy="92" rx="12" ry="9" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
    <text x="184" y="160" text-anchor="middle">2 mm</text>
    <text x="184" y="176" text-anchor="middle" font-size="11" fill="#c62828">oval, charred</text>

    <!-- 3mm: ok -->
    <circle cx="292" cy="92" r="18" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <text x="292" y="160" text-anchor="middle" font-weight="600">3 mm</text>
    <text x="292" y="176" text-anchor="middle" font-size="11" fill="#2e7d32">= thickness — the limit</text>

    <!-- 4mm: good -->
    <circle cx="400" cy="92" r="25" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="400" y="160" text-anchor="middle">4 mm</text>
    <text x="400" y="176" text-anchor="middle" font-size="11" fill="#5a5a5a">clean and round</text>

    <text x="20" y="200" font-size="11" fill="#5a5a5a">The pierce point is a fixed size. On a small hole it is most of the hole.</text>
  </g>
</svg>
