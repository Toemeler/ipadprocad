<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-label="Kerf taper compared at 3 mm and 10 mm thickness">
  <rect x="0" y="0" width="480" height="240" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Taper, exaggerated, at two thicknesses</text>

    <!-- 3mm -->
    <polygon points="34,70 130,70 132,110 34,110" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="152,70 248,70 248,110 150,110" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="130" y1="62" x2="152" y2="62"/><line x1="130" y1="56" x2="130" y2="68"/><line x1="152" y1="56" x2="152" y2="68"/>
      <line x1="132" y1="120" x2="150" y2="120"/><line x1="132" y1="114" x2="132" y2="126"/><line x1="150" y1="114" x2="150" y2="126"/>
    </g>
    <text x="141" y="48" text-anchor="middle" font-weight="600">3 mm</text>
    <text x="141" y="142" text-anchor="middle" font-size="11" fill="#2e7d32">difference ≈ 0.03 mm — noise</text>

    <!-- 10mm -->
    <polygon points="276,60 372,60 386,170 276,170" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="404,60 462,60 462,170 390,170" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="372" y1="52" x2="404" y2="52"/><line x1="372" y1="46" x2="372" y2="58"/><line x1="404" y1="46" x2="404" y2="58"/>
      <line x1="386" y1="180" x2="390" y2="180"/><line x1="386" y1="174" x2="386" y2="186"/><line x1="390" y1="174" x2="390" y2="186"/>
    </g>
    <text x="388" y="38" text-anchor="middle" font-weight="600">10 mm</text>
    <text x="380" y="202" text-anchor="middle" font-size="11" fill="#c62828">difference ≈ 0.3 mm — fits one face, jams on the other</text>

    <text x="20" y="228" font-size="11" fill="#5a5a5a">Size a slot on the NARROW face: the tab has to pass the tightest point.</text>
  </g>
</svg>
