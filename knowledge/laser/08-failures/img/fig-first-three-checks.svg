<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="The three cheap checks: lens, sheet flatness, material identity">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Check these three before redesigning anything</text>

    <g>
      <circle cx="90" cy="92" r="30" fill="#eef4f8" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="82" cy="86" r="4" fill="#8a7a5a"/><circle cx="98" cy="98" r="3" fill="#8a7a5a"/>
      <text x="90" y="150" text-anchor="middle" font-weight="600">1 · lens</text>
      <text x="90" y="168" text-anchor="middle" font-size="11" fill="#5a5a5a">wide kerf and weak cut</text>
      <text x="90" y="184" text-anchor="middle" font-size="11" fill="#5a5a5a">are the same symptom</text>
    </g>

    <g>
      <path d="M180 108 C 210 92, 250 118, 290 100" fill="none" stroke="#1a1a1a" stroke-width="3"/>
      <line x1="180" y1="120" x2="290" y2="120" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="235" y="150" text-anchor="middle" font-weight="600">2 · sheet flat?</text>
      <text x="235" y="168" text-anchor="middle" font-size="11" fill="#5a5a5a">cut through in patches</text>
      <text x="235" y="184" text-anchor="middle" font-size="11" fill="#5a5a5a">= focus varies across the sheet</text>
    </g>

    <g>
      <rect x="350" y="66" width="80" height="54" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <text x="390" y="98" text-anchor="middle" font-size="18" font-weight="700" fill="#5a5a5a">?</text>
      <text x="390" y="150" text-anchor="middle" font-weight="600">3 · material</text>
      <text x="390" y="168" text-anchor="middle" font-size="11" fill="#5a5a5a">is it actually what</text>
      <text x="390" y="184" text-anchor="middle" font-size="11" fill="#5a5a5a">you think it is?</text>
    </g>

    <text x="20" y="210" font-size="11" fill="#5a5a5a">Two symptoms at once are usually one cause. If it worked last week, nothing in the file changed.</text>
  </g>
</svg>
