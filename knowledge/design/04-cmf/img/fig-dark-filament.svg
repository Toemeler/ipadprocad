<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210" role="img" aria-label="Why dark glossy filament and layer lines fight">
  <rect x="0" y="0" width="480" height="210" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Dark and glossy traces every layer</text>

    <rect x="30" y="46" width="180" height="94" fill="#2a2d30" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#9fb0bd" stroke-width="1.6" opacity="0.85">
      <line x1="30" y1="56" x2="210" y2="56"/><line x1="30" y1="68" x2="210" y2="68"/><line x1="30" y1="80" x2="210" y2="80"/>
      <line x1="30" y1="92" x2="210" y2="92"/><line x1="30" y1="104" x2="210" y2="104"/><line x1="30" y1="116" x2="210" y2="116"/>
      <line x1="30" y1="128" x2="210" y2="128"/>
    </g>
    <text x="120" y="164" text-anchor="middle" font-weight="600" fill="#c62828">dark, glossy</text>
    <text x="120" y="180" text-anchor="middle" fill="#c62828">the highlight follows every line</text>

    <rect x="270" y="46" width="180" height="94" fill="#3a3e42" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#4a4e52" stroke-width="1.4">
      <line x1="270" y1="56" x2="450" y2="56"/><line x1="270" y1="68" x2="450" y2="68"/><line x1="270" y1="80" x2="450" y2="80"/>
      <line x1="270" y1="92" x2="450" y2="92"/><line x1="270" y1="104" x2="450" y2="104"/><line x1="270" y1="116" x2="450" y2="116"/>
      <line x1="270" y1="128" x2="450" y2="128"/>
    </g>
    <text x="360" y="164" text-anchor="middle" font-weight="600" fill="#2e7d32">dark, matte</text>
    <text x="360" y="180" text-anchor="middle" fill="#2e7d32">the surface scatters it</text>

    <text x="20" y="202" font-size="11" fill="#5a5a5a">If the part is dark and its surface will be seen, choose a matte filament or plan to finish the surface.</text>
  </g>
</svg>
