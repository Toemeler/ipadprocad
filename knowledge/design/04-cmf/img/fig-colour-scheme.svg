<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="A neutral body with one accent, and the same object over-coloured">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Two colours plus the material's own</text>

    <rect x="28" y="48" width="180" height="96" fill="#3f4448" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="44" y="64" width="80" height="20" fill="#e3cfa8"/>
    <circle cx="176" cy="120" r="11" fill="#d9541e"/>
    <g fill="#5a6065"><rect x="44" y="96" width="30" height="12"/><rect x="82" y="96" width="30" height="12"/><rect x="120" y="96" width="30" height="12"/></g>
    <text x="118" y="168" text-anchor="middle" font-weight="600" fill="#2e7d32">neutral + wood + one accent</text>
    <text x="118" y="184" text-anchor="middle" fill="#2e7d32">accent &lt; 10 % of the area, on the primary</text>

    <rect x="272" y="48" width="180" height="96" fill="#2f6fb3" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="288" y="64" width="80" height="20" fill="#d9541e"/>
    <circle cx="420" cy="120" r="11" fill="#3fa34d"/>
    <g fill="#e8b93a"><rect x="288" y="96" width="30" height="12"/><rect x="326" y="96" width="30" height="12"/><rect x="364" y="96" width="30" height="12"/></g>
    <text x="362" y="168" text-anchor="middle" font-weight="600" fill="#c62828">four colours</text>
    <text x="362" y="184" text-anchor="middle" fill="#c62828">colour ranks nothing because everything has some</text>

    <text x="20" y="210" font-size="11" fill="#5a5a5a">Colour is the strongest hierarchy lever, and the one most often spent on decoration instead.</text>
  </g>
</svg>
