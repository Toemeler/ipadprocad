<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 270" width="510" height="270" role="img" aria-label="The ten brief questions and what each one constrains">
  <rect x="0" y="0" width="510" height="270" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Every question has a geometric consequence</text>

    <g stroke="#9a9a9a" stroke-width="1"><line x1="24" y1="40" x2="456" y2="40"/></g>
    <g font-weight="600">
      <text x="24" y="60">1 what is it for</text>      <text x="256" y="60">→ whether it is one object or two</text>
      <text x="24" y="82">2 who uses it</text>         <text x="256" y="82">→ every ergonomic dimension</text>
      <text x="24" y="104">3 where does it live</text>  <text x="256" y="104">→ material, finish, stance</text>
      <text x="24" y="126">4 how many</text>            <text x="256" y="126">→ fitted by hand, or not</text>
      <text x="24" y="148">5 what does it hold</text>   <text x="256" y="148">→ measured, not nominal</text>
      <text x="24" y="170">6 how is it opened</text>    <text x="256" y="170">→ the joints</text>
      <text x="24" y="192">7 which process</text>       <text x="256" y="192">→ laser or FDM, and everything after</text>
      <text x="24" y="214">8 what must it survive</text><text x="256" y="214">→ material and section</text>
      <text x="24" y="236">9 what sits next to it</text><text x="256" y="236">→ colour and finish</text>
    </g>
    <text x="24" y="258" font-weight="600" fill="#2e7d32">10 what is out of scope</text>
    <text x="256" y="258" font-weight="600" fill="#2e7d32">→ prevents the most work of all</text>
  </g>
</svg>
