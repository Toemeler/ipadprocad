<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="The mock-up ladder from cardboard to real material">
  <rect x="0" y="0" width="480" height="230" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Each rung answers a different question</text>

    <g stroke="#1a1a1a" stroke-width="1.5">
      <rect x="24" y="126" width="80" height="34" rx="4" fill="#cfcabb"/>
      <rect x="116" y="110" width="80" height="50" rx="4" fill="#dcd8cc"/>
      <rect x="208" y="94" width="80" height="66" rx="4" fill="#d9d9d9"/>
      <rect x="300" y="78" width="80" height="82" rx="4" fill="#d3d3d3"/>
      <rect x="392" y="62" width="64" height="98" rx="4" fill="#cccccc"/>
    </g>
    <g text-anchor="middle" font-weight="600">
      <text x="64" y="148">card</text><text x="156" y="140">grip</text><text x="248" y="132">joint</text>
      <text x="340" y="124">front face</text><text x="424" y="116">full</text>
    </g>
    <g text-anchor="middle" fill="#5a5a5a">
      <text x="64" y="176">20 min</text><text x="156" y="176">30 min</text><text x="248" y="176">20 min</text>
      <text x="340" y="176">1 h</text><text x="424" y="176">hours</text>
      <text x="64" y="192">right size?</text><text x="156" y="192">feels right?</text><text x="248" y="192">tolerance?</text>
      <text x="340" y="192">proportion?</text><text x="424" y="192">everything</text>
    </g>

    <text x="20" y="218" font-size="11" fill="#5a5a5a">The slower the real process, the more the coupon is worth. Change one category per iteration, or the next</text>
    <text x="20" y="228" font-size="11" fill="#5a5a5a">version teaches nothing.</text>
  </g>
</svg>
