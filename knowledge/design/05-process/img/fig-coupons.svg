<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210" role="img" aria-label="Test the joint, not the object">
  <rect x="0" y="0" width="480" height="210" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Cut the coupon, not the object</text>

    <rect x="30" y="46" width="170" height="100" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M60 46 v100 M110 46 v100 M160 46 v100" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="115" y="170" text-anchor="middle" font-weight="600" fill="#c62828">the whole part</text>
    <text x="115" y="186" text-anchor="middle" fill="#c62828">five hours to learn one number</text>

    <rect x="300" y="76" width="56" height="44" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="356" y="86" width="20" height="24" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#2e7d32" stroke-width="2.5" fill="none"><path d="M398 110 l7 8 l15 -18"/></g>
    <text x="350" y="170" text-anchor="middle" font-weight="600" fill="#2e7d32">40 mm coupon</text>
    <text x="350" y="186" text-anchor="middle" fill="#2e7d32">twenty minutes, same answer</text>

    <text x="20" y="204" font-size="11" fill="#5a5a5a">And it answers it on this machine, this sheet, this filament — which the general tables cannot.</text>
  </g>
</svg>
