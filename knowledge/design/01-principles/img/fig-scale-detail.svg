<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="The same form at two sizes with unscaled detail">
  <rect x="0" y="0" width="480" height="230" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Scaling the form without scaling the detail</text>

    <path d="M30 150 h160 v-82 q0 -8 -8 -8 h-144 q-8 0 -8 8 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="46" y="80" width="128" height="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="46" y="92" width="128" height="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="110" y="178" text-anchor="middle" font-weight="600">200 mm</text>
    <text x="110" y="194" text-anchor="middle" fill="#2e7d32">crisp radii, legible detail</text>

    <path d="M300 150 h72 v-48 q0 -8 -8 -8 h-56 q-8 0 -8 8 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="312" y="108" width="48" height="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="312" y="118" width="48" height="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="336" cy="104" r="26" fill="none" stroke="#c62828" stroke-width="2"/>
    <text x="336" y="178" text-anchor="middle" font-weight="600">40 mm, same radii</text>
    <text x="336" y="194" text-anchor="middle" fill="#c62828">blobby corners, detail gone</text>

    <text x="20" y="220" font-size="11" fill="#5a5a5a">Proportions identical, object worse. Rescale the radius set and the detail size with the form.</text>
  </g>
</svg>
