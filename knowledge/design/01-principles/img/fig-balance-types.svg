<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-label="Symmetrical, near-symmetrical and asymmetrical balance">
  <rect x="0" y="0" width="480" height="260" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Three kinds of balance, one of which is a mistake</text>

    <rect x="26" y="46" width="130" height="100" fill="#e8eef2" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="91" cy="96" r="24" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="91" y1="46" x2="91" y2="146" stroke="#0b6bcb" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="91" y="170" text-anchor="middle" font-weight="600" fill="#2e7d32">symmetrical</text>
    <text x="91" y="186" text-anchor="middle" fill="#2e7d32">calm, formal</text>

    <rect x="176" y="46" width="130" height="100" fill="#e8eef2" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="234" cy="96" r="24" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="241" y1="46" x2="241" y2="146" stroke="#0b6bcb" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="237" cy="96" r="34" fill="none" stroke="#c62828" stroke-width="2"/>
    <text x="241" y="170" text-anchor="middle" font-weight="600" fill="#c62828">nearly symmetrical</text>
    <text x="241" y="186" text-anchor="middle" fill="#c62828">reads as broken</text>

    <rect x="326" y="46" width="130" height="100" fill="#e8eef2" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="368" cy="96" r="26" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5"/>
    <g fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.2">
      <rect x="418" y="72" width="12" height="12"/><rect x="418" y="90" width="12" height="12"/><rect x="418" y="108" width="12" height="12"/>
    </g>
    <text x="391" y="170" text-anchor="middle" font-weight="600" fill="#2e7d32">asymmetrical, balanced</text>
    <text x="391" y="186" text-anchor="middle" fill="#2e7d32">dynamic, on purpose</text>

    <text x="20" y="214" font-size="12" font-weight="600">Either align it, or break it clearly.</text>
    <text x="20" y="232" font-size="11" fill="#5a5a5a">3 mm off centre looks broken. 30 mm off looks intended. The middle is the</text><text x="20" y="246" font-size="11" fill="#5a5a5a">accidental ugliness.</text>
  </g>
</svg>
