<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="The same panel without and with hierarchy">
  <rect x="0" y="0" width="480" height="230" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Same controls, same panel</text>

    <rect x="26" y="44" width="200" height="106" fill="#e8eef2" stroke="#1a1a1a" stroke-width="2"/>
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5">
      <circle cx="60" cy="76" r="13"/><circle cx="110" cy="76" r="13"/><circle cx="160" cy="76" r="13"/><circle cx="200" cy="76" r="13"/>
      <circle cx="60" cy="120" r="13"/><circle cx="110" cy="120" r="13"/><circle cx="160" cy="120" r="13"/><circle cx="200" cy="120" r="13"/>
    </g>
    <text x="126" y="174" text-anchor="middle" font-weight="600" fill="#c62828">everything equal</text>
    <text x="126" y="190" text-anchor="middle" fill="#c62828">so nothing reads</text>

    <rect x="256" y="44" width="200" height="106" fill="#e8eef2" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="306" cy="92" r="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2">
      <circle cx="378" cy="72" r="9"/><circle cx="402" cy="72" r="9"/><circle cx="426" cy="72" r="9"/>
      <circle cx="378" cy="118" r="9"/><circle cx="402" cy="118" r="9"/><circle cx="426" cy="118" r="9"/>
    </g>
    <g stroke="#0b6bcb" stroke-width="1" stroke-dasharray="3 3"><line x1="348" y1="44" x2="348" y2="150"/></g>
    <text x="356" y="174" text-anchor="middle" font-weight="600" fill="#2e7d32">one primary, isolated</text>
    <text x="356" y="190" text-anchor="middle" fill="#2e7d32">the rest grouped and demoted</text>

    <text x="20" y="216" font-size="11" fill="#5a5a5a">Nothing was added. Isolation is free and often beats size — a control with 20 mm of nothing</text>
    <text x="20" y="226" font-size="11" fill="#5a5a5a">around it dominates one that is 30 % larger and crowded.</text>
  </g>
</svg>
