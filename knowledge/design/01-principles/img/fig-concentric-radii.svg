<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="Outer radius equals inner radius plus wall thickness">
  <rect x="0" y="0" width="480" height="230" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Outer radius = inner radius + wall thickness</text>

    <path d="M40 160 v-76 q0 -34 34 -34 h96 v26 h-96 q-8 0 -8 8 v76 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="40" y1="176" x2="66" y2="176"/><line x1="40" y1="170" x2="40" y2="182"/><line x1="66" y1="170" x2="66" y2="182"/>
      <line x1="186" y1="50" x2="186" y2="76"/><line x1="180" y1="50" x2="192" y2="50"/><line x1="180" y1="76" x2="192" y2="76"/>
    </g>
    <text x="53" y="196" text-anchor="middle" fill="#0b6bcb">t</text>
    <text x="206" y="68" fill="#0b6bcb">t</text>
    <g stroke="#2e7d32" stroke-width="2.5" fill="none"><path d="M120 136 l7 8 l15 -18"/></g>
    <text x="112" y="212" text-anchor="middle" font-weight="600" fill="#2e7d32">wall constant through the bend</text>

    <path d="M280 160 v-76 q0 -18 18 -18 h112 v26 h-112 q-18 0 -18 18 v50 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="302" cy="94" r="22" fill="none" stroke="#c62828" stroke-width="2"/>
    <text x="352" y="212" text-anchor="middle" font-weight="600" fill="#c62828">wall thickens at the corner</text>
    <text x="352" y="228" text-anchor="middle" font-size="10" fill="#c62828">a swelling outside, a problem inside</text>
  </g>
</svg>
