<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="Grouping by gap size">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Gaps do the grouping</text>

    <g fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5">
      <rect x="30" y="50" width="26" height="26"/><rect x="74" y="50" width="26" height="26"/><rect x="118" y="50" width="26" height="26"/>
      <rect x="162" y="50" width="26" height="26"/><rect x="206" y="50" width="26" height="26"/><rect x="250" y="50" width="26" height="26"/>
    </g>
    <text x="300" y="68" fill="#c62828">even spacing — no groups</text>

    <g fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5">
      <rect x="30" y="118" width="26" height="26"/><rect x="62" y="118" width="26" height="26"/><rect x="94" y="118" width="26" height="26"/>
      <rect x="164" y="118" width="26" height="26"/><rect x="196" y="118" width="26" height="26"/>
      <rect x="266" y="118" width="26" height="26"/>
    </g>
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="56" y1="158" x2="62" y2="158"/><line x1="56" y1="152" x2="56" y2="164"/><line x1="62" y1="152" x2="62" y2="164"/>
      <line x1="120" y1="158" x2="164" y2="158"/><line x1="120" y1="152" x2="120" y2="164"/><line x1="164" y1="152" x2="164" y2="164"/>
    </g>
    <text x="59" y="180" text-anchor="middle" fill="#0b6bcb">1×</text>
    <text x="142" y="180" text-anchor="middle" fill="#0b6bcb">≥ 2×</text>
    <text x="330" y="136" fill="#2e7d32">two gap sizes — three groups</text>

    <text x="20" y="208" font-size="11" fill="#5a5a5a">Inside a group, one spacing step. Between groups, at least two. An object whose gaps are all the</text>
    <text x="20" y="218" font-size="11" fill="#5a5a5a">same has no grouping, which leaves the viewer to do the sorting.</text>
  </g>
</svg>
