<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" role="img" aria-label="The same part drawn with eleven values and with three">
  <rect x="0" y="0" width="500" height="250" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Count the distinct values</text>

    <path d="M30 150 h170 v-20 q0 -9 -9 -9 h-40 q-3 0 -3 -3 v-58 q0 -6 -6 -6 h-98 q-14 0 -14 14 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2">
      <circle cx="52" cy="82" r="7"/><circle cx="86" cy="86" r="4"/><circle cx="126" cy="78" r="9"/><circle cx="60" cy="132" r="5"/><circle cx="170" cy="140" r="6"/>
    </g>
    <text x="115" y="178" text-anchor="middle" font-weight="600" fill="#c62828">11 distinct values</text>
    <text x="115" y="196" text-anchor="middle" fill="#c62828">radii 1, 3, 6, 9, 14 · gaps 4, 5, 7, 11 · holes 4, 5, 7, 9, 12</text>

    <path d="M280 150 h170 v-24 q0 -4 -4 -4 h-52 q-4 0 -4 -4 v-56 q0 -4 -4 -4 h-102 q-4 0 -4 4 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2">
      <circle cx="304" cy="82" r="6"/><circle cx="332" cy="82" r="6"/><circle cx="360" cy="82" r="6"/>
      <circle cx="304" cy="134" r="6"/><circle cx="420" cy="134" r="6"/>
    </g>
    <text x="365" y="178" text-anchor="middle" font-weight="600" fill="#2e7d32">3 distinct values</text>
    <text x="365" y="196" text-anchor="middle" fill="#2e7d32">radii 2, 4 · one gap · one hole size</text>

    <text x="20" y="222" font-size="11" fill="#5a5a5a">Same geometry, same function. When a new value is needed, ask first which</text><text x="20" y="236" font-size="11" fill="#5a5a5a">existing one can do the job.</text>
  </g>
</svg>
