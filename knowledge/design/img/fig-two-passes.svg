<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="Where the two design passes sit in a job">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Two short passes, not one long one</text>

    <line x1="30" y1="96" x2="450" y2="96" stroke="#9a9a9a" stroke-width="2"/>
    <g fill="#2e7d32">
      <rect x="30" y="76" width="76" height="40" rx="4"/>
      <rect x="374" y="76" width="76" height="40" rx="4"/>
    </g>
    <g fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.5">
      <rect x="122" y="80" width="70" height="32" rx="4"/>
      <rect x="206" y="80" width="70" height="32" rx="4"/>
      <rect x="290" y="80" width="68" height="32" rx="4"/>
    </g>
    <g text-anchor="middle">
      <text x="68" y="94" fill="#ffffff" font-weight="600">design</text>
      <text x="68" y="108" fill="#ffffff" font-size="10">choose systems</text>
      <text x="157" y="100">material</text>
      <text x="241" y="100">geometry</text>
      <text x="324" y="100">export</text>
      <text x="412" y="94" fill="#ffffff" font-weight="600">critique</text>
      <text x="412" y="108" fill="#ffffff" font-size="10">check them</text>
    </g>

    <text x="68" y="140" text-anchor="middle" font-size="11" fill="#2e7d32">5 min</text>
    <text x="412" y="140" text-anchor="middle" font-size="11" fill="#2e7d32">5 min</text>

    <text x="20" y="176" font-size="12" font-weight="600">The pass at the start is the one that pays.</text>
    <text x="20" y="196" font-size="11" fill="#5a5a5a">Systems chosen before the first dimension cost nothing. The same systems retrofitted to a finished</text>
    <text x="20" y="210" font-size="11" fill="#5a5a5a">model mean checking every value in it.</text>
  </g>
</svg>
