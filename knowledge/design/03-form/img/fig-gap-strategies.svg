<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" role="img" aria-label="Flush joint, deliberate gap and a lip">
  <rect x="0" y="0" width="520" height="250" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">A lid joint, three ways</text>

    <rect x="28" y="52" width="120" height="26" fill="#cccccc" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="28" y="80" width="120" height="52" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M28 79 h40 M76 78 h72" stroke="#c62828" stroke-width="2.5"/>
    <text x="88" y="160" text-anchor="middle" font-weight="600" fill="#c62828">flush</text>
    <text x="88" y="176" text-anchor="middle" fill="#c62828">sometimes proud, sometimes</text>
    <text x="88" y="192" text-anchor="middle" fill="#c62828">sunken — never achievable</text>

    <rect x="180" y="52" width="120" height="26" fill="#cccccc" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="180" y="84" width="120" height="48" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="310" y1="78" x2="310" y2="84"/><line x1="304" y1="78" x2="316" y2="78"/><line x1="304" y1="84" x2="316" y2="84"/>
    </g>
    <text x="240" y="160" text-anchor="middle" font-weight="600">deliberate gap</text>
    <text x="240" y="176" text-anchor="middle" fill="#2e7d32">consistent, 0.5–1.0 mm</text>

    <path d="M332 52 h120 v26 h-14 v8 h-92 v-8 h-14 z" fill="#cccccc" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M332 90 h120 v42 h-120 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#2e7d32" stroke-width="2.5" fill="none"><path d="M410 152 l7 8 l15 -18"/></g>
    <text x="392" y="176" text-anchor="middle" font-weight="600" fill="#2e7d32">overlap lip</text>
    <text x="392" y="192" text-anchor="middle" fill="#2e7d32">hides the joint and the tolerance</text>

    <text x="20" y="218" font-size="11" fill="#5a5a5a">Never design a flush zero-gap joint in a printed or laser-cut part. It</text><text x="20" y="232" font-size="11" fill="#5a5a5a">cannot be achieved, and the attempt</text>
    <text x="20" y="228" font-size="11" fill="#5a5a5a">looks worse than a deliberate gap.</text>
  </g>
</svg>
