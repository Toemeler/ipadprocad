<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 235" width="490" height="235" role="img" aria-label="Five surface moves on the same face">
  <rect x="0" y="0" width="490" height="235" rx="10" fill="#ffffff"/>
  <defs><pattern id="tex" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#9a9a9a"/></pattern></defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">One move per face — never two</text>

    <g>
      <path d="M24 50 h76 v10 l-8 8 h-60 l-8 -8 z" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.5"/>
      <rect x="24" y="68" width="76" height="54" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5"/>
      <text x="62" y="142" text-anchor="middle" font-weight="600">chamfered edge</text>
      <text x="62" y="156" text-anchor="middle" fill="#5a5a5a">free · a shadow line</text>
    </g>
    <g>
      <path d="M114 50 h76 v34 l-76 8 z" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.5"/>
      <path d="M114 92 l76 -8 v38 h-76 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5"/>
      <text x="152" y="142" text-anchor="middle" font-weight="600">plane change</text>
      <text x="152" y="156" text-anchor="middle" fill="#5a5a5a">2–5°</text>
    </g>
    <g>
      <rect x="204" y="50" width="76" height="72" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5"/>
      <rect x="218" y="64" width="48" height="44" fill="#c9c9c9" stroke="#1a1a1a" stroke-width="1.2"/>
      <text x="242" y="142" text-anchor="middle" font-weight="600">inset</text>
      <text x="242" y="156" text-anchor="middle" fill="#5a5a5a">1–2 mm deep</text>
    </g>
    <g>
      <rect x="294" y="50" width="76" height="72" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5"/>
      <rect x="308" y="64" width="48" height="44" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="1.2"/>
      <text x="332" y="142" text-anchor="middle" font-weight="600">proud element</text>
      <text x="332" y="156" text-anchor="middle" fill="#5a5a5a">1–2 mm</text>
    </g>
    <g>
      <rect x="384" y="50" width="76" height="72" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5"/>
      <rect x="398" y="64" width="48" height="44" fill="url(#tex)" stroke="#1a1a1a" stroke-width="1.2"/>
      <text x="422" y="142" text-anchor="middle" font-weight="600">texture change</text>
      <text x="422" y="156" text-anchor="middle" fill="#5a5a5a">free in FDM</text>
    </g>

    <text x="20" y="190" font-size="11" fill="#5a5a5a">Two moves on one face start to fight; three and the face is busy. Most of</text><text x="20" y="204" font-size="11" fill="#5a5a5a">these are invisible in silhouette,</text>
    <text x="20" y="204" font-size="11" fill="#5a5a5a">which is what makes them safe — a plane change and a taper are not, so</text><text x="20" y="218" font-size="11" fill="#5a5a5a">check those at eye level.</text>
  </g>
</svg>
