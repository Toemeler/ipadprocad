<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-label="The radius set and where each value goes">
  <rect x="0" y="0" width="480" height="250" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Three values, each about twice the last</text>

    <rect x="30" y="50" width="200" height="120" rx="16" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="52" y="72" width="76" height="52" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2">
      <rect x="148" y="72" width="60" height="16" rx="2"/><rect x="148" y="96" width="60" height="16" rx="2"/><rect x="148" y="120" width="60" height="16" rx="2"/>
    </g>
    <g stroke="#0b6bcb" stroke-width="1.4" fill="none">
      <path d="M30 66 a16 16 0 0 1 16 -16"/>
      <path d="M52 80 a8 8 0 0 1 8 -8"/>
      <path d="M148 74 a2 2 0 0 1 2 -2"/>
    </g>
    <text x="252" y="64" fill="#0b6bcb" font-weight="600">4 mm — silhouette</text>
    <text x="252" y="88" fill="#5a5a5a">the largest value, on the outline</text>
    <text x="252" y="118" fill="#0b6bcb" font-weight="600">2 mm — secondary edges</text>
    <text x="252" y="142" fill="#5a5a5a">insets, internal corners</text>
    <text x="252" y="172" fill="#0b6bcb" font-weight="600">1 mm — details</text>
    <text x="252" y="196" fill="#5a5a5a">lead-ins, break edges, small</text><text x="252" y="212" fill="#5a5a5a">features</text>

    <text x="20" y="222" font-size="11" fill="#5a5a5a">Nothing outside the set. A fourth value is allowed on a complex object; a</text><text x="20" y="236" font-size="11" fill="#5a5a5a">fifth means it stopped being a set.</text>
  </g>
</svg>
