<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" width="500" height="210" role="img" aria-label="Tangent versus curvature continuity on a matte surface">
  <rect x="0" y="0" width="500" height="210" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">How much continuity is worth paying for</text>

    <path d="M30 130 h60 a40 40 0 0 1 40 -40 h50" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="90" cy="130" r="5" fill="none" stroke="#0b6bcb" stroke-width="1.6"/>
    <circle cx="130" cy="90" r="5" fill="none" stroke="#0b6bcb" stroke-width="1.6"/>
    <text x="110" y="162" text-anchor="middle" font-weight="600" fill="#2e7d32">tangent</text>
    <text x="110" y="178" text-anchor="middle" fill="#2e7d32">smooth to the eye</text>
    <text x="110" y="194" text-anchor="middle" fill="#5a5a5a">all a matte layered surface can show</text>

    <path d="M270 130 h40 c 30 0 20 -40 50 -40 h50" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <text x="350" y="162" text-anchor="middle" font-weight="600">curvature</text>
    <text x="350" y="178" text-anchor="middle" fill="#5a5a5a">smooth to a reflection</text>
    <text x="350" y="194" text-anchor="middle" fill="#c62828">invisible unless glossy — costly modelling</text>
  </g>
</svg>
