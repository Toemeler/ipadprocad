<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 210" width="490" height="210" role="img" aria-label="Target size and gap minimums">
  <rect x="0" y="0" width="490" height="210" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Press targets: the floor and the goal</text>

    <rect x="40" y="56" width="34" height="34" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
    <text x="57" y="112" text-anchor="middle" font-weight="600">12 mm</text>
    <text x="57" y="128" text-anchor="middle" fill="#c62828">the floor</text>

    <rect x="150" y="46" width="54" height="54" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <text x="177" y="122" text-anchor="middle" font-weight="600">19 mm</text>
    <text x="177" y="138" text-anchor="middle" fill="#2e7d32">the goal</text>

    <ellipse cx="300" cy="73" rx="16" ry="20" fill="#c62828" opacity="0.25" stroke="#c62828" stroke-width="1.2"/>
    <text x="300" y="112" text-anchor="middle" font-weight="600">16–20 mm</text>
    <text x="300" y="128" text-anchor="middle" fill="#5a5a5a">the fingertip itself</text>

    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5">
      <rect x="378" y="56" width="30" height="30"/><rect x="418" y="56" width="30" height="30"/>
    </g>
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="408" y1="98" x2="418" y2="98"/><line x1="408" y1="92" x2="408" y2="104"/><line x1="418" y1="92" x2="418" y2="104"/>
    </g>
    <text x="413" y="122" text-anchor="middle" font-weight="600">≥ 6 mm gap</text>
    <text x="413" y="138" text-anchor="middle" fill="#2e7d32">does more than size</text>

    <text x="20" y="176" font-size="11" fill="#5a5a5a">Error rates for people with motor impairments rise by up to 75 % on small</text><text x="20" y="190" font-size="11" fill="#5a5a5a">targets — a large effect for a change</text>
    <text x="20" y="192" font-size="11" fill="#5a5a5a">that costs nothing. Actuation force ≤ 4 N, and ≤ 2 N is better.</text>
  </g>
</svg>
