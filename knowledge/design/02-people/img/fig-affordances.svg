<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="The form says what to do">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">If it needs a label, the form is wrong</text>

    <g>
      <rect x="28" y="52" width="86" height="72" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="44" y="68" width="54" height="40" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.2"/>
      <text x="71" y="150" text-anchor="middle" font-weight="600">flat plate</text>
      <text x="71" y="166" text-anchor="middle" fill="#2e7d32">affords pushing</text>
      <text x="71" y="182" text-anchor="middle" fill="#5a5a5a">nothing to grip</text>
    </g>
    <g>
      <rect x="140" y="52" width="86" height="72" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="160" y="74" width="46" height="10" rx="5" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="1.2"/>
      <rect x="160" y="92" width="46" height="10" rx="5" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="1.2"/>
      <text x="183" y="150" text-anchor="middle" font-weight="600">bar</text>
      <text x="183" y="166" text-anchor="middle" fill="#2e7d32">affords pulling</text>
      <text x="183" y="182" text-anchor="middle" fill="#5a5a5a">a finger gets behind it</text>
    </g>
    <g>
      <circle cx="295" cy="88" r="34" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <g stroke="#1a1a1a" stroke-width="1.6">
        <line x1="295" y1="54" x2="295" y2="62"/><line x1="319" y1="64" x2="313" y2="70"/><line x1="329" y1="88" x2="321" y2="88"/>
        <line x1="319" y1="112" x2="313" y2="106"/><line x1="295" y1="122" x2="295" y2="114"/><line x1="271" y1="112" x2="277" y2="106"/>
        <line x1="261" y1="88" x2="269" y2="88"/><line x1="271" y1="64" x2="277" y2="70"/>
      </g>
      <text x="295" y="150" text-anchor="middle" font-weight="600">knurled cylinder</text>
      <text x="295" y="166" text-anchor="middle" fill="#2e7d32">affords turning</text>
      <text x="295" y="182" text-anchor="middle" fill="#5a5a5a">a smooth one does not</text>
    </g>
    <g>
      <rect x="374" y="52" width="86" height="72" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <text x="417" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">PUSH</text>
      <text x="417" y="150" text-anchor="middle" font-weight="600" fill="#c62828">a label</text>
      <text x="417" y="166" text-anchor="middle" fill="#c62828">an admission the</text>
      <text x="417" y="182" text-anchor="middle" fill="#c62828">form did not explain itself</text>
    </g>
  </g>
</svg>
