<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="Four grip types and their governing dimensions">
  <rect x="0" y="0" width="480" height="230" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Four grips, four governing dimensions</text>

    <g>
      <circle cx="66" cy="92" r="30" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <path d="M30 92 a36 36 0 0 1 72 0" fill="none" stroke="#8a8a8a" stroke-width="7" stroke-linecap="round"/>
      <text x="66" y="150" text-anchor="middle" font-weight="600">power grip</text>
      <text x="66" y="166" text-anchor="middle" fill="#0b6bcb">⌀ 41 mm</text>
      <text x="66" y="182" text-anchor="middle" fill="#5a5a5a">31–51 mm</text>
    </g>
    <g>
      <rect x="152" y="66" width="18" height="52" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="204" y="66" width="18" height="52" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <g stroke="#0b6bcb" stroke-width="1.2">
        <line x1="170" y1="130" x2="204" y2="130"/><line x1="170" y1="124" x2="170" y2="136"/><line x1="204" y1="124" x2="204" y2="136"/>
      </g>
      <text x="187" y="150" text-anchor="middle" font-weight="600">two-finger</text>
      <text x="187" y="166" text-anchor="middle" fill="#0b6bcb">span 50–55 mm</text>
      <text x="187" y="182" text-anchor="middle" fill="#5a5a5a">45–65 mm</text>
    </g>
    <g>
      <rect x="292" y="60" width="12" height="64" rx="6" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <text x="298" y="150" text-anchor="middle" font-weight="600">precision</text>
      <text x="298" y="166" text-anchor="middle" fill="#0b6bcb">⌀ 8–12 mm</text>
      <text x="298" y="182" text-anchor="middle" fill="#5a5a5a">pen-like</text>
    </g>
    <g>
      <path d="M386 66 h56 v14 h-42 v44 h-14 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <text x="414" y="150" text-anchor="middle" font-weight="600">hook / carry</text>
      <text x="414" y="166" text-anchor="middle" fill="#0b6bcb">clearance 30–50 mm</text>
      <text x="414" y="182" text-anchor="middle" fill="#5a5a5a">knuckles need room</text>
    </g>

    <text x="20" y="212" font-size="11" fill="#5a5a5a">Handle length ≥ 100 mm, 115 mm better. Slightly elliptical at 1:1.25 — it resists rolling and tells the hand its orientation.</text>
  </g>
</svg>
