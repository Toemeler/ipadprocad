<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-label="Contrast ratios on wood and painted panels">
  <rect x="0" y="0" width="480" height="240" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">4.5 : 1 for fine detail, 3 : 1 for large marks</text>

    <rect x="26" y="46" width="130" height="80" fill="#efe3c8" stroke="#1a1a1a" stroke-width="2"/>
    <text x="91" y="94" text-anchor="middle" font-size="18" font-weight="700" fill="#4a3a22">M-01</text>
    <text x="91" y="150" text-anchor="middle" font-weight="600" fill="#2e7d32">engrave on birch</text>
    <text x="91" y="166" text-anchor="middle" fill="#2e7d32">passes comfortably</text>

    <rect x="176" y="46" width="130" height="80" fill="#5a4230" stroke="#1a1a1a" stroke-width="2"/>
    <text x="241" y="94" text-anchor="middle" font-size="18" font-weight="700" fill="#3d2c1e">M-01</text>
    <text x="241" y="150" text-anchor="middle" font-weight="600" fill="#c62828">engrave on walnut</text>
    <text x="241" y="166" text-anchor="middle" fill="#c62828">fails — a material decision,</text>
    <text x="241" y="182" text-anchor="middle" fill="#c62828">not a settings one</text>

    <rect x="326" y="46" width="130" height="80" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="2"/>
    <text x="391" y="94" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">M-01</text>
    <text x="391" y="150" text-anchor="middle" font-weight="600" fill="#2e7d32">white on dark grey</text>
    <text x="391" y="166" text-anchor="middle" fill="#2e7d32">passes at AAA</text>

    <text x="20" y="208" font-size="11" fill="#5a5a5a">Never rely on colour alone — add shape, position or text. An engrave that</text><text x="20" y="222" font-size="11" fill="#5a5a5a">reads by shadow needs 0.4 mm of depth.</text>
  </g>
</svg>
