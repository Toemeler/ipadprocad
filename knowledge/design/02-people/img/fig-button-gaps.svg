<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="Why the gap matters more than the button size">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">A fingertip is 16–20 mm wide</text>

    <rect x="26" y="46" width="190" height="90" fill="#e8eef2" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="96" cy="91" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="146" cy="91" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <ellipse cx="121" cy="91" rx="16" ry="20" fill="#c62828" opacity="0.25"/>
    <text x="121" y="158" text-anchor="middle" font-weight="600" fill="#c62828">large buttons, 3 mm apart</text>
    <text x="121" y="174" text-anchor="middle" fill="#c62828">the fingertip spans both</text>

    <rect x="266" y="46" width="190" height="90" fill="#e8eef2" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="318" cy="91" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="362" cy="91" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="406" cy="91" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="332" y1="122" x2="348" y2="122"/><line x1="332" y1="116" x2="332" y2="128"/><line x1="348" y1="116" x2="348" y2="128"/>
    </g>
    <text x="361" y="158" text-anchor="middle" font-weight="600" fill="#2e7d32">smaller buttons, 10 mm apart</text>
    <text x="361" y="174" text-anchor="middle" fill="#2e7d32">each one can be hit alone</text>

    <text x="20" y="204" font-size="11" fill="#5a5a5a">Mispresses come from gaps, not from sizes. Set the gaps first when space is tight.</text>
  </g>
</svg>
