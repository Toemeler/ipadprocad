<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="Holding the finger width constant instead of the count">
  <rect x="0" y="0" width="480" height="230" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">The single biggest tell</text>

    <text x="26" y="54" font-weight="600" fill="#c62828">constant COUNT — width varies</text>
    <path d="M26 64 h40 v-14 h40 v14 h40 v-14 h40 v14 h40 v-14 h40 v14 h40 v-14 h40 v14 h40" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M26 96 h28 v-14 h28 v14 h28 v-14 h28 v14 h28 v-14 h28 v14 h28 v-14 h28 v14 h28" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#c62828" stroke-width="1.2">
      <line x1="66" y1="40" x2="106" y2="40"/><line x1="54" y1="72" x2="82" y2="72"/>
    </g>
    <text x="330" y="44" font-size="10" fill="#c62828">40 mm</text>
    <text x="330" y="76" font-size="10" fill="#c62828">28 mm — same count, different edge</text>

    <text x="26" y="136" font-weight="600" fill="#2e7d32">constant WIDTH — count varies</text>
    <path d="M26 148 h30 v-14 h30 v14 h30 v-14 h30 v14 h30 v-14 h30 v14 h30 v-14 h30 v14 h30 v-14 h30 v14 h30" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M26 182 h30 v-14 h30 v14 h30 v-14 h30 v14 h30 v-14 h30 v14 h30 v-14 h30" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#2e7d32" stroke-width="1.2">
      <line x1="56" y1="124" x2="86" y2="124"/><line x1="56" y1="158" x2="86" y2="158"/>
    </g>
    <text x="330" y="128" font-size="10" fill="#2e7d32">30 mm</text>
    <text x="330" y="162" font-size="10" fill="#2e7d32">30 mm — every finger on the box matches</text>

    <text x="20" y="214" font-size="11" fill="#5a5a5a">A generator holds the count and lets the width vary. Hold the width, let the count vary, and the whole</text>
    <text x="20" y="226" font-size="11" fill="#5a5a5a">object shares one rhythm — which reads immediately, even though nobody measures.</text>
  </g>
</svg>
