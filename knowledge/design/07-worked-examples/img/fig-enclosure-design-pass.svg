<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="The printed enclosure before and after the design pass">
  <rect x="0" y="0" width="480" height="270" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Same function, same manufacturing numbers</text>

    <line x1="26" y1="152" x2="216" y2="152" stroke="#9a9a9a" stroke-width="3"/>
    <rect x="48" y="60" width="146" height="28" fill="#8e9398" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="48" y="88" width="146" height="64" fill="#a8adb2" stroke="#1a1a1a" stroke-width="2"/>
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1"><circle cx="70" cy="74" r="4"/><circle cx="86" cy="74" r="4"/></g>
    <g fill="#5a6065"><rect x="120" y="68" width="6" height="12"/><rect x="132" y="68" width="6" height="12"/><rect x="144" y="68" width="6" height="12"/><rect x="156" y="68" width="6" height="12"/></g>
    <circle cx="180" cy="74" r="4" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="1"/>
    <text x="121" y="176" text-anchor="middle" font-weight="600" fill="#c62828">manufacturing-correct only</text>
    <g fill="#c62828">
      <text x="26" y="196">· flush lid joint — will not hold</text>
      <text x="26" y="210">· LEDs crowded among the vents</text>
      <text x="26" y="224">· vents spread across the whole face</text>
      <text x="26" y="238">· glossy dark, textured face downward</text>
    </g>

    <line x1="266" y1="152" x2="456" y2="152" stroke="#9a9a9a" stroke-width="3"/>
    <path d="M288 60 h146 v22 h-10 v8 h-126 v-8 h-10 z" fill="#4a4f54" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M288 92 h146 v54 l-6 6 h-134 l-6 -6 z" fill="#5b6166" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="308" y="64" width="106" height="14" fill="#565c61" stroke="#1a1a1a" stroke-width="1"/>
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1"><circle cx="330" cy="71" r="4"/><circle cx="346" cy="71" r="4"/></g>
    <g fill="#8a8a8a" stroke="#1a1a1a" stroke-width="0.8"><rect x="300" y="146" width="10" height="6"/><rect x="412" y="146" width="10" height="6"/></g>
    <text x="361" y="176" text-anchor="middle" font-weight="600" fill="#2e7d32">after the design pass</text>
    <g fill="#2e7d32">
      <text x="266" y="196">· 2 mm overlap lip, 0.4 mm gap</text>
      <text x="266" y="210">· LEDs in an inset panel,</text><text x="266" y="226">isolated</text>
      <text x="266" y="224">· vents grouped, moved</text><text x="266" y="240">underneath</text>
      <text x="266" y="238">· matte, textured face turned</text><text x="266" y="254">upward</text>
    </g>
  </g>
</svg>
