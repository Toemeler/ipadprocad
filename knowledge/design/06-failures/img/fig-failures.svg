<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-label="Six common design failures and the corrected object">
  <rect x="0" y="0" width="480" height="260" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Six failures, all of them minutes to fix</text>

    <line x1="26" y1="150" x2="216" y2="150" stroke="#9a9a9a" stroke-width="3"/>
    <path d="M44 150 h150 v-24 q0 -10 -10 -10 h-46 q-2 0 -2 -2 v-56 q0 -4 -4 -4 h-84 q-4 0 -4 4 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2">
      <circle cx="66" cy="76" r="8"/><circle cx="92" cy="78" r="5"/><circle cx="122" cy="74" r="7"/>
    </g>
    <circle cx="176" cy="132" r="5" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="1"/>
    <g stroke="#c62828" stroke-width="1.2" fill="none">
      <circle cx="66" cy="76" r="14"/><circle cx="44" cy="150" r="10"/><circle cx="176" cy="132" r="11"/>
    </g>
    <text x="120" y="176" text-anchor="middle" font-weight="600" fill="#c62828">before</text>
    <g fill="#c62828" font-size="10">
      <text x="26" y="196">· 5 radii, 4 gap sizes</text>
      <text x="26" y="210">· three hole sizes, none aligned</text>
      <text x="26" y="224">· no hierarchy — all equal weight</text>
      <text x="26" y="238">· proud screw head</text>
      <text x="26" y="252">· sharp base, sits flat</text>
    </g>

    <line x1="266" y1="150" x2="456" y2="150" stroke="#9a9a9a" stroke-width="3"/>
    <path d="M284 144 h150 v-28 q0 -4 -4 -4 h-52 q-4 0 -4 -4 v-50 q0 -4 -4 -4 h-82 q-4 0 -4 4 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M284 144 l6 6 h138 l6 -6 z" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.5"/>
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2">
      <circle cx="306" cy="78" r="11"/><circle cx="344" cy="78" r="6"/><circle cx="370" cy="78" r="6"/>
    </g>
    <g stroke="#0b6bcb" stroke-width="0.8" stroke-dasharray="3 3"><line x1="292" y1="78" x2="424" y2="78"/></g>
    <text x="360" y="176" text-anchor="middle" font-weight="600" fill="#2e7d32">after</text>
    <g fill="#2e7d32" font-size="10">
      <text x="266" y="196">· 2 radii, 1 spacing scale</text>
      <text x="266" y="210">· one hole size, one baseline</text>
      <text x="266" y="224">· one primary, isolated</text>
      <text x="266" y="238">· screw recessed</text>
      <text x="266" y="252">· bottom chamfer, inset base</text>
    </g>
  </g>
</svg>
