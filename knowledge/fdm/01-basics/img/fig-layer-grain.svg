<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="Layer lines behaving like wood grain">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">An FDM part is grained</text>

    <rect x="34" y="48" width="180" height="100" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#9a9a9a" stroke-width="1">
      <line x1="34" y1="60" x2="214" y2="60"/><line x1="34" y1="72" x2="214" y2="72"/>
      <line x1="34" y1="84" x2="214" y2="84"/><line x1="34" y1="96" x2="214" y2="96"/>
      <line x1="34" y1="108" x2="214" y2="108"/><line x1="34" y1="120" x2="214" y2="120"/>
      <line x1="34" y1="132" x2="214" y2="132"/>
    </g>
    <g stroke="#2e7d32" stroke-width="2.5" fill="#2e7d32">
      <line x1="60" y1="98" x2="186" y2="98"/><polygon points="186,93 198,98 186,103"/>
      <polygon points="60,93 48,98 60,103"/>
    </g>
    <text x="124" y="176" text-anchor="middle" font-weight="600" fill="#2e7d32">along the threads</text>
    <text x="124" y="194" text-anchor="middle" font-size="11" fill="#2e7d32">70–90 % of moulded strength</text>

    <rect x="266" y="48" width="180" height="100" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#9a9a9a" stroke-width="1">
      <line x1="266" y1="60" x2="446" y2="60"/><line x1="266" y1="72" x2="446" y2="72"/>
      <line x1="266" y1="84" x2="446" y2="84"/><line x1="266" y1="96" x2="446" y2="96"/>
      <line x1="266" y1="108" x2="446" y2="108"/><line x1="266" y1="120" x2="446" y2="120"/>
      <line x1="266" y1="132" x2="446" y2="132"/>
    </g>
    <g stroke="#c62828" stroke-width="2.5" fill="#c62828">
      <line x1="356" y1="70" x2="356" y2="40"/><polygon points="351,40 356,28 361,40"/>
      <line x1="356" y1="126" x2="356" y2="156"/><polygon points="351,156 356,168 361,156"/>
    </g>
    <text x="356" y="176" text-anchor="middle" font-weight="600" fill="#c62828">across the welds</text>
    <text x="356" y="194" text-anchor="middle" font-size="11" fill="#c62828">40–75 %, and as low as 20 % on impact</text>

    <text x="20" y="214" font-size="11" fill="#5a5a5a">Think plywood, not moulded plastic.</text>
  </g>
</svg>
