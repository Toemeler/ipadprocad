<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="Horizontal features snap to layer boundaries">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Layer height is the vertical grid</text>

    <rect x="40" y="46" width="180" height="120" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#9a9a9a" stroke-width="0.8">
      <line x1="40" y1="58" x2="220" y2="58"/><line x1="40" y1="70" x2="220" y2="70"/><line x1="40" y1="82" x2="220" y2="82"/>
      <line x1="40" y1="94" x2="220" y2="94"/><line x1="40" y1="106" x2="220" y2="106"/><line x1="40" y1="118" x2="220" y2="118"/>
      <line x1="40" y1="130" x2="220" y2="130"/><line x1="40" y1="142" x2="220" y2="142"/><line x1="40" y1="154" x2="220" y2="154"/>
    </g>
    <rect x="86" y="46" width="70" height="48" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="86" y1="90" x2="156" y2="90" stroke="#0b6bcb" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="121" y="186" text-anchor="middle" font-size="11" fill="#0b6bcb">modelled 4.5 mm deep</text>
    <text x="121" y="202" text-anchor="middle" font-size="11">prints 4.4 or 4.6 mm</text>

    <text x="268" y="76" font-size="12" font-weight="600">Anything horizontal snaps:</text>
    <text x="268" y="100" font-size="11" fill="#5a5a5a">· the floor of a pocket</text>
    <text x="268" y="120" font-size="11" fill="#5a5a5a">· the top of a hole</text>
    <text x="268" y="140" font-size="11" fill="#5a5a5a">· the start of a chamfer</text>
    <text x="268" y="160" font-size="11" fill="#5a5a5a">· a print-in-place gap</text>
    <text x="268" y="186" font-size="11" fill="#2e7d32">Make depths that matter a</text>
    <text x="268" y="202" font-size="11" fill="#2e7d32">multiple of the layer height.</text>
  </g>
</svg>
