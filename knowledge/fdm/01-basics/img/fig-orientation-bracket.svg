<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-label="An L-bracket in three print orientations with its load path">
  <rect x="0" y="0" width="480" height="250" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Same bracket, three orientations</text>

    <!-- flat -->
    <g>
      <path d="M26 118 h100 v22 h-78 v44 h-22 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="0.8">
        <line x1="26" y1="126" x2="126" y2="126"/><line x1="26" y1="134" x2="126" y2="134"/>
        <line x1="26" y1="148" x2="48" y2="148"/><line x1="26" y1="160" x2="48" y2="160"/><line x1="26" y1="172" x2="48" y2="172"/>
      </g>
      <g stroke="#0b6bcb" stroke-width="2" fill="#0b6bcb">
        <line x1="120" y1="104" x2="120" y2="86"/><polygon points="115,104 120,114 125,104"/>
      </g>
      <text x="76" y="204" text-anchor="middle" font-weight="600" fill="#2e7d32">flat</text>
      <text x="76" y="220" text-anchor="middle" fill="#2e7d32">load runs along the threads</text>
      <text x="76" y="236" text-anchor="middle" fill="#2e7d32">strongest · no supports</text>
    </g>

    <!-- upright -->
    <g>
      <path d="M186 118 h100 v22 h-78 v44 h-22 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="0.8">
        <line x1="186" y1="126" x2="286" y2="126"/><line x1="186" y1="140" x2="286" y2="140"/>
        <line x1="186" y1="152" x2="208" y2="152"/><line x1="186" y1="164" x2="208" y2="164"/><line x1="186" y1="176" x2="208" y2="176"/>
      </g>
      <path d="M204 140 l-8 -6 M212 140 l8 -6" stroke="#c62828" stroke-width="2.5"/>
      <circle cx="208" cy="140" r="15" fill="none" stroke="#c62828" stroke-width="2"/>
      <text x="236" y="204" text-anchor="middle" font-weight="600" fill="#c62828">upright</text>
      <text x="236" y="220" text-anchor="middle" fill="#c62828">load peels the layers apart</text>
      <text x="236" y="236" text-anchor="middle" fill="#c62828">≈ 25 % of the strength</text>
    </g>

    <!-- 45 -->
    <g transform="rotate(-45 396 150)">
      <path d="M346 118 h100 v22 h-78 v44 h-22 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    </g>
    <text x="396" y="204" text-anchor="middle" font-weight="600">45°</text>
    <text x="396" y="220" text-anchor="middle" fill="#5a5a5a">good, all faces smooth</text>
    <text x="396" y="236" text-anchor="middle" fill="#5a5a5a">needs supports</text>
  </g>
</svg>
