<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-label="The tolerance test part with its features labelled">
  <rect x="0" y="0" width="480" height="250" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">One part, eight measurements</text>

    <rect x="26" y="44" width="428" height="120" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>

    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5">
      <circle cx="56" cy="76" r="9"/><circle cx="86" cy="76" r="9"/><circle cx="116" cy="76" r="9"/>
      <circle cx="146" cy="76" r="9"/><circle cx="176" cy="76" r="9"/>
    </g>
    <text x="116" y="100" text-anchor="middle" fill="#0b6bcb">pins 6.1 … 6.5</text>

    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5">
      <circle cx="226" cy="76" r="5"/><circle cx="250" cy="76" r="8"/><circle cx="280" cy="76" r="12"/>
    </g>
    <text x="252" y="100" text-anchor="middle" fill="#0b6bcb">⌀3 / 5 / 8</text>

    <rect x="318" y="60" width="32" height="32" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="334" y="104" text-anchor="middle" fill="#0b6bcb">20 mm cube</text>

    <polygon points="376,60 400,60 406,92 382,92" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="392" y="104" text-anchor="middle" fill="#0b6bcb">overhang fan</text>

    <g stroke="#1a1a1a" stroke-width="1.5" fill="#ffffff">
      <rect x="46" y="120" width="30" height="14"/><rect x="86" y="120" width="40" height="14"/>
      <rect x="136" y="120" width="50" height="14"/><rect x="196" y="120" width="60" height="14"/>
    </g>
    <text x="150" y="150" text-anchor="middle" fill="#0b6bcb">bridges 10 … 50 mm</text>

    <polygon points="300,120 312,113 324,120 324,134 312,141 300,134" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="312" y="154" text-anchor="middle" fill="#0b6bcb">nut trap</text>
    <circle cx="396" cy="127" r="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="396" y="154" text-anchor="middle" fill="#0b6bcb">insert boss</text>

    <text x="20" y="196" font-size="12" font-weight="600">Print it once per material, in the orientation and layer height you actually use.</text>
    <text x="20" y="216" font-size="11" fill="#5a5a5a">Measure the cube first: more than ±0.2 mm off and the machine needs calibrating before anything else means much.</text>
    <text x="20" y="236" font-size="11" fill="#2e7d32">Write every number into machine-assumptions.md. An unrecorded measurement gets taken again next month.</text>
  </g>
</svg>
