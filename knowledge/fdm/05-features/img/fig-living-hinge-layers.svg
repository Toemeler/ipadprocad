<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220" role="img" aria-label="A living hinge in and across the layer plane">
  <rect x="0" y="0" width="500" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">A living hinge must lie in the layer plane</text>

    <g>
      <rect x="30" y="80" width="80" height="30" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="110" y="92" width="20" height="6" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5"/>
      <rect x="130" y="80" width="80" height="30" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="0.8">
        <line x1="30" y1="88" x2="210" y2="88"/><line x1="30" y1="96" x2="210" y2="96"/><line x1="30" y1="104" x2="210" y2="104"/>
      </g>
      <g stroke="#2e7d32" stroke-width="2.5" fill="none"><path d="M172 136 l7 8 l15 -18"/></g>
      <text x="120" y="176" text-anchor="middle" font-weight="600" fill="#2e7d32">flat — layers run through the hinge</text>
      <text x="120" y="194" text-anchor="middle" font-size="11" fill="#2e7d32">it folds</text>
    </g>

    <g>
      <rect x="290" y="52" width="70" height="60" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="290" y="112" width="70" height="8" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5"/>
      <rect x="290" y="120" width="70" height="30" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="0.8">
        <line x1="290" y1="64" x2="360" y2="64"/><line x1="290" y1="76" x2="360" y2="76"/><line x1="290" y1="88" x2="360" y2="88"/>
        <line x1="290" y1="100" x2="360" y2="100"/><line x1="290" y1="132" x2="360" y2="132"/>
      </g>
      <path d="M368 112 l14 -4 M368 120 l14 4" stroke="#c62828" stroke-width="3"/>
      <text x="360" y="176" text-anchor="middle" font-weight="600" fill="#c62828">upright — the hinge IS a layer weld</text>
      <text x="360" y="194" text-anchor="middle" font-size="11" fill="#c62828">fails on the first fold, every material</text>
    </g>
  </g>
</svg>
