<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 255" width="480" height="255" role="img" aria-label="Cantilever snap fit dimensions">
  <rect x="0" y="0" width="480" height="255" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Cantilever snap fit</text>

    <rect x="30" y="60" width="44" height="110" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M74 96 q10 0 12 6 l0 0 L300 112 l0 14 L86 130 q-2 6 -12 6 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M300 112 l26 -6 l0 34 l-26 -14 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>

    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="86" y1="96" x2="86" y2="136"/><line x1="80" y1="96" x2="92" y2="96"/><line x1="80" y1="136" x2="92" y2="136"/>
      <line x1="86" y1="190" x2="326" y2="190"/><line x1="86" y1="184" x2="86" y2="196"/><line x1="326" y1="184" x2="326" y2="196"/>
      <line x1="300" y1="112" x2="300" y2="126"/>
    </g>
    <text x="60" y="116" text-anchor="end" fill="#0b6bcb">t = 0.5–0.6 × wall</text>
    <text x="206" y="208" text-anchor="middle" fill="#0b6bcb">L = 8 × t  (PLA)</text>
    <text x="344" y="100" fill="#0b6bcb">tip = 0.5 t</text>
    <text x="344" y="156" fill="#0b6bcb">ramp 30°</text>

    <path d="M74 96 q10 0 12 6" fill="none" stroke="#2e7d32" stroke-width="3"/>
    <text x="108" y="82" fill="#2e7d32" font-weight="600">root fillet ≥ 0.5 t — the load path</text>

    <text x="20" y="226" font-size="11" fill="#5a5a5a">PETG 6–8:1 · nylon 5:1 · CF-filled: derate by half. Width ≥ 5 mm. 3–4</text><text x="20" y="240" font-size="11" fill="#5a5a5a">walls or solid.</text>
  </g>
</svg>
