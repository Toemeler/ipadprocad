<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-label="Rib height versus panel thickness for the same stiffness">
  <rect x="0" y="0" width="480" height="250" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Stiffness goes with the cube of depth</text>

    <rect x="34" y="96" width="170" height="10" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M34 106 q85 26 170 0" fill="none" stroke="#c62828" stroke-width="2.5" stroke-dasharray="5 4"/>
    <text x="119" y="152" text-anchor="middle" font-weight="600">2 mm panel</text>
    <text x="119" y="170" text-anchor="middle" font-size="11" fill="#c62828">flexes</text>

    <rect x="266" y="96" width="170" height="10" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2">
      <rect x="292" y="106" width="8" height="26"/><rect x="346" y="106" width="8" height="26"/><rect x="400" y="106" width="8" height="26"/>
    </g>
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="424" y1="106" x2="424" y2="132"/><line x1="418" y1="106" x2="430" y2="106"/><line x1="418" y1="132" x2="430" y2="132"/>
    </g>
    <text x="351" y="152" text-anchor="middle" font-weight="600" fill="#2e7d32">2 mm panel + 6 mm ribs</text>
    <text x="351" y="170" text-anchor="middle" font-size="11" fill="#2e7d32">far stiffer, barely heavier</text>

    <text x="20" y="200" font-size="12" font-weight="600">In FDM a rib is the SAME thickness as its wall — there are no</text><text x="20" y="216" font-size="12" font-weight="600">sink marks to avoid.</text>
    <text x="20" y="220" font-size="11" fill="#5a5a5a">Rib height ≈ 3 × wall, spacing 5–10 × wall, and a fillet at every rib</text><text x="20" y="234" font-size="11" fill="#5a5a5a">root.</text>
  </g>
</svg>
