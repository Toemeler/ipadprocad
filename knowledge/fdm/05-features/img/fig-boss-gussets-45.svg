<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-label="Three gussets at 45 degrees supporting a boss">
  <rect x="0" y="0" width="480" height="240" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Gussets at 45° — self-supporting in any orientation</text>

    <rect x="40" y="140" width="190" height="18" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="118" y="66" width="34" height="74" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="135" cy="66" r="17" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="118,140 118,106 84,140" fill="#d9d9d9" stroke="#2e7d32" stroke-width="2"/>
    <polygon points="152,140 152,106 186,140" fill="#d9d9d9" stroke="#2e7d32" stroke-width="2"/>
    <path d="M118 106 l-6 -6 M152 106 l6 -6" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="135" y="184" text-anchor="middle" font-size="11">section</text>

    <circle cx="350" cy="106" r="46" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="4 3"/>
    <circle cx="350" cy="106" r="26" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="350" cy="106" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <g fill="#d9d9d9" stroke="#2e7d32" stroke-width="2">
      <polygon points="350,80 358,58 342,58"/>
      <polygon points="372,119 392,132 384,117"/>
      <polygon points="328,119 308,132 316,117"/>
    </g>
    <text x="350" y="184" text-anchor="middle" font-size="11">plan · three gussets</text>

    <text x="20" y="210" font-size="11" fill="#5a5a5a">Three is the usual answer for a free-standing boss. Merging it into a wall</text><text x="20" y="224" font-size="11" fill="#5a5a5a">is better still.</text>
  </g>
</svg>
