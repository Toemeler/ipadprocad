<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="Self tapping boss dimensions">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Self-tapping boss for a 3 mm screw</text>

    <rect x="60" y="150" width="200" height="20" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="128" y="56" width="64" height="94" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="148" y="56" width="24" height="70" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M128 150 q0 -8 8 -8 M192 150 q0 -8 -8 -8" fill="none" stroke="#2e7d32" stroke-width="2"/>

    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="148" y1="44" x2="172" y2="44"/><line x1="148" y1="38" x2="148" y2="50"/><line x1="172" y1="38" x2="172" y2="50"/>
      <line x1="128" y1="186" x2="192" y2="186"/><line x1="128" y1="180" x2="128" y2="192"/><line x1="192" y1="180" x2="192" y2="192"/>
      <line x1="210" y1="56" x2="210" y2="126"/><line x1="204" y1="56" x2="216" y2="56"/><line x1="204" y1="126" x2="216" y2="126"/>
    </g>
    <text x="160" y="34" text-anchor="middle" fill="#0b6bcb">pilot 2.4 mm  (0.8 × screw ⌀)</text>
    <text x="160" y="204" text-anchor="middle" fill="#0b6bcb">boss 7.5 mm  (2.5 × screw ⌀)</text>
    <text x="224" y="96" fill="#0b6bcb">engagement 6 mm  (2 × screw ⌀)</text>

    <text x="300" y="140" font-size="12" font-weight="600" fill="#c62828">3–5 cycles, then it strips.</text>
    <text x="300" y="160" font-size="11" fill="#5a5a5a">Coarse threads hold; machine-screw</text>
    <text x="300" y="176" font-size="11" fill="#5a5a5a">threads cut the plastic away.</text>
    <text x="300" y="196" font-size="11" fill="#5a5a5a">Drive the first turn by hand — a power</text>
    <text x="300" y="212" font-size="11" fill="#5a5a5a">driver melts the thread in one go.</text>
  </g>
</svg>
