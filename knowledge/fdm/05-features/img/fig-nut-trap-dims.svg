<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="Nut trap dimensions for M3">
  <rect x="0" y="0" width="480" height="230" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">M3 nut trap, drawn dimensions</text>

    <rect x="40" y="46" width="240" height="120" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="120,72 176,72 204,106 176,140 120,140 92,106" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="204" y="98" width="76" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="92" y1="60" x2="204" y2="60"/><line x1="92" y1="54" x2="92" y2="66"/><line x1="204" y1="54" x2="204" y2="66"/>
      <line x1="300" y1="98" x2="300" y2="114"/><line x1="294" y1="98" x2="306" y2="98"/><line x1="294" y1="114" x2="306" y2="114"/>
    </g>
    <text x="148" y="48" text-anchor="middle" fill="#0b6bcb">across flats 5.7 mm  (nut 5.5 + 0.2)</text>
    <text x="316" y="110" fill="#0b6bcb">screw hole 3.6 mm</text>
    <text x="148" y="160" text-anchor="middle" fill="#0b6bcb">pocket depth 2.7 mm  (nut 2.4 + 0.3)</text>

    <text x="316" y="150" font-size="12" font-weight="600" fill="#c62828">≥ 2 mm of material</text>
    <text x="316" y="168" font-size="12" font-weight="600" fill="#c62828">all round the pocket</text>
    <text x="20" y="200" font-size="11" fill="#5a5a5a">Thinner, and the pocket bursts when the screw is tightened. The depth</text><text x="20" y="214" font-size="11" fill="#5a5a5a">clearance is for the over-extruded floor.</text>
  </g>
</svg>
