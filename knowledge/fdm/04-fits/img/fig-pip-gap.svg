<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="Print in place gap too tight, right and too loose">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">The gap in a print-in-place joint</text>

    <g>
      <rect x="34" y="56" width="52" height="80" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="88" y="56" width="52" height="80" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="86" y="56" width="2" height="80" fill="#c62828"/>
      <text x="87" y="164" text-anchor="middle" font-weight="600" fill="#c62828">0.2 mm</text>
      <text x="87" y="182" text-anchor="middle" font-size="11" fill="#c62828">fuses solid</text>
    </g>
    <g>
      <rect x="194" y="56" width="52" height="80" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="252" y="56" width="52" height="80" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <text x="249" y="164" text-anchor="middle" font-weight="600" fill="#2e7d32">0.4 mm</text>
      <text x="249" y="182" text-anchor="middle" font-size="11" fill="#2e7d32">moves, after a break-in</text>
    </g>
    <g>
      <rect x="352" y="56" width="52" height="80" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="420" y="56" width="52" height="80" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <text x="412" y="164" text-anchor="middle" font-weight="600" fill="#c62828">0.8 mm</text>
      <text x="412" y="182" text-anchor="middle" font-size="11" fill="#c62828">rattles</text>
    </g>

    <text x="20" y="208" font-size="11" fill="#5a5a5a">A VERTICAL gap is quantised to the layer height — model it as a whole number of layers, and state that height with the part.</text>
  </g>
</svg>
