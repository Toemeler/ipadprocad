<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="Clearance is diametral, not per side">
  <rect x="0" y="0" width="480" height="230" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">0.3 mm clearance on a 6 mm shaft</text>

    <rect x="34" y="52" width="170" height="104" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="119" cy="104" r="42" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="119" cy="104" r="40" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.5"/>
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="77" y1="176" x2="161" y2="176"/>
      <line x1="77" y1="170" x2="77" y2="182"/><line x1="161" y1="170" x2="161" y2="182"/>
    </g>
    <text x="119" y="196" text-anchor="middle" font-weight="600" fill="#2e7d32">hole 6.3 mm</text>
    <text x="119" y="214" text-anchor="middle" font-size="11" fill="#2e7d32">correct — a sliding fit</text>

    <rect x="276" y="52" width="170" height="104" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="361" cy="104" r="46" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
    <circle cx="361" cy="104" r="40" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.5"/>
    <g stroke="#0b6bcb" stroke-width="1.2">
      <line x1="315" y1="176" x2="407" y2="176"/>
      <line x1="315" y1="170" x2="315" y2="182"/><line x1="407" y1="170" x2="407" y2="182"/>
    </g>
    <text x="361" y="196" text-anchor="middle" font-weight="600" fill="#c62828">hole 6.6 mm</text>
    <text x="361" y="214" text-anchor="middle" font-size="11" fill="#c62828">0.3 applied per side — a rattle</text>
  </g>
</svg>
