<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 235" width="480" height="235" role="img" aria-label="The same hole printed in PLA and PETG">
  <rect x="0" y="0" width="480" height="235" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Same model, ⌀6.0 mm hole</text>

    <rect x="46" y="50" width="150" height="100" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="121" cy="100" r="34" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="121" cy="100" r="36" fill="none" stroke="#0b6bcb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="121" y="172" text-anchor="middle" font-weight="600">PLA</text>
    <text x="121" y="190" text-anchor="middle" font-size="11" fill="#5a5a5a">prints ≈ 5.85 mm</text>

    <rect x="286" y="50" width="150" height="100" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="361" cy="100" r="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="361" cy="100" r="36" fill="none" stroke="#0b6bcb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="361" y="172" text-anchor="middle" font-weight="600">PETG</text>
    <text x="361" y="190" text-anchor="middle" font-size="11" fill="#c62828">prints ≈ 5.75 mm — tighter</text>

    <text x="20" y="206" font-size="11" fill="#2e7d32">Which is why every PETG fit gets 0.05–0.1 mm more than the PLA number.</text><text x="20" y="220" font-size="11" fill="#2e7d32">Dashed blue = nominal.</text>
  </g>
</svg>
