<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-label="PLA's two failure modes: heat and brittleness">
  <rect x="0" y="0" width="480" height="240" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">PLA's two limits, and both bite after delivery</text>

    <path d="M40 130 q50 -6 100 0 q50 6 100 0" fill="none" stroke="#c62828" stroke-width="3"/>
    <rect x="40" y="130" width="200" height="14" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="140" y="168" text-anchor="middle" font-weight="600" fill="#c62828">soft at 55 °C</text>
    <text x="140" y="186" text-anchor="middle" font-size="11" fill="#5a5a5a">a closed car reaches 70 °C</text>

    <g>
      <path d="M290 100 l50 30 l-6 12 l-46 -28 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5"/>
      <path d="M352 138 l54 32 l-6 12 l-50 -30 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1.5"/>
      <path d="M340 130 l14 8" stroke="#c62828" stroke-width="3"/>
    </g>
    <text x="356" y="168" text-anchor="middle" font-weight="600" fill="#c62828">brittle</text>
    <text x="356" y="186" text-anchor="middle" font-size="11" fill="#5a5a5a">snaps rather than bends</text>

    <text x="20" y="210" font-size="11" fill="#2e7d32">Design in PLA for accuracy, print in PETG for service — and add 0.05–0.1</text><text x="20" y="224" font-size="11" fill="#2e7d32">mm to every clearance.</text>
  </g>
</svg>
