<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Heat limit versus toughness for the common filaments">
  <rect x="0" y="0" width="480" height="270" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Heat limit against toughness</text>

    <g stroke="#9a9a9a" stroke-width="1.5">
      <line x1="60" y1="210" x2="440" y2="210"/>
      <line x1="60" y1="210" x2="60" y2="48"/>
    </g>
    <text x="250" y="232" text-anchor="middle" fill="#5a5a5a">toughness →</text>
    <text x="30" y="130" text-anchor="middle" fill="#5a5a5a" transform="rotate(-90 30 130)">heat limit →</text>

    <g>
      <circle cx="110" cy="190" r="8" fill="#2e7d32"/><text x="110" y="176" text-anchor="middle" font-weight="600">PLA</text>
      <circle cx="230" cy="150" r="8" fill="#2e7d32"/><text x="230" y="136" text-anchor="middle" font-weight="600">PETG</text>
      <circle cx="250" cy="110" r="8" fill="#8a8a8a"/><text x="250" y="96" text-anchor="middle">ABS</text>
      <circle cx="300" cy="106" r="8" fill="#8a8a8a"/><text x="308" y="96" text-anchor="middle">ASA</text>
      <circle cx="380" cy="120" r="8" fill="#8a8a8a"/><text x="380" y="106" text-anchor="middle">Nylon</text>
      <circle cx="360" cy="70" r="8" fill="#8a8a8a"/><text x="360" y="58" text-anchor="middle">PC</text>
      <circle cx="420" cy="176" r="8" fill="#8a8a8a"/><text x="420" y="162" text-anchor="middle">TPU</text>
    </g>

    <path d="M84 210 L84 130 L270 130 L270 210 Z" fill="#2e7d32" opacity="0.08"/>
    <text x="177" y="204" text-anchor="middle" font-size="11" fill="#2e7d32">no enclosure needed</text>

    <text x="20" y="254" font-size="11" fill="#5a5a5a">Everything to the right of the green box needs an enclosure, a dry box, or both.</text>
    <text x="20" y="268" font-size="11" fill="#5a5a5a">Positions are indicative — the ordering is what matters, not the coordinates.</text>
  </g>
</svg>
