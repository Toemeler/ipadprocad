<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="Reading a fracture surface">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">What the broken face tells you</text>

    <rect x="34" y="60" width="80" height="80" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="128" y="60" width="80" height="80" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#9a9a9a" stroke-width="0.8">
      <line x1="34" y1="76" x2="114" y2="76"/><line x1="34" y1="92" x2="114" y2="92"/><line x1="34" y1="108" x2="114" y2="108"/><line x1="34" y1="124" x2="114" y2="124"/>
      <line x1="128" y1="76" x2="208" y2="76"/><line x1="128" y1="92" x2="208" y2="92"/><line x1="128" y1="108" x2="208" y2="108"/><line x1="128" y1="124" x2="208" y2="124"/>
    </g>
    <line x1="121" y1="60" x2="121" y2="140" stroke="#c62828" stroke-width="3"/>
    <text x="121" y="166" text-anchor="middle" font-weight="600" fill="#c62828">clean, flat, along a layer</text>
    <text x="121" y="186" text-anchor="middle" font-size="11" fill="#c62828">orientation problem — reorient,</text>
    <text x="121" y="202" text-anchor="middle" font-size="11" fill="#c62828">fillet or gusset</text>

    <rect x="274" y="60" width="80" height="80" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="368" y="60" width="80" height="80" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M361 60 l-6 14 l8 12 l-8 16 l6 14 l-4 12 l4 12" fill="none" stroke="#c62828" stroke-width="3"/>
    <text x="361" y="166" text-anchor="middle" font-weight="600">ragged, through the material</text>
    <text x="361" y="186" text-anchor="middle" font-size="11" fill="#5a5a5a">section problem — the part was</text>
    <text x="361" y="202" text-anchor="middle" font-size="11" fill="#5a5a5a">simply too small there</text>
  </g>
</svg>
