<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" role="img" aria-label="The same cylinder at three tessellation tolerances">
  <rect x="0" y="0" width="500" height="240" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Chord height decides how round a cylinder is</text>

    <circle cx="90" cy="100" r="44" fill="none" stroke="#0b6bcb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <polygon points="90,56 128,78 128,122 90,144 52,122 52,78" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <text x="90" y="172" text-anchor="middle" font-weight="600" fill="#c62828">0.1 mm</text>
    <text x="90" y="190" text-anchor="middle" font-size="11" fill="#c62828">visible facets</text>

    <circle cx="240" cy="100" r="44" fill="none" stroke="#0b6bcb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <polygon points="240,56 271,68 284,100 271,132 240,144 209,132 196,100 209,68" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <text x="240" y="172" text-anchor="middle" font-weight="600">0.05 mm</text>
    <text x="240" y="190" text-anchor="middle" font-size="11" fill="#5a5a5a">borderline</text>

    <circle cx="390" cy="100" r="44" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <text x="390" y="172" text-anchor="middle" font-weight="600" fill="#2e7d32">0.01 mm</text>
    <text x="390" y="190" text-anchor="middle" font-size="11" fill="#2e7d32">below what the printer resolves</text>

    <text x="20" y="212" font-size="11" fill="#5a5a5a">Finer than 0.01 mm gains nothing and multiplies the file size. 3MF or STEP</text><text x="20" y="226" font-size="11" fill="#5a5a5a">avoids the question entirely.</text>
  </g>
</svg>
