<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="A flat cavity ceiling replaced by a printed arch">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">The printed arch</text>

    <rect x="34" y="52" width="170" height="104" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="66" y="80" width="106" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M70 84 q50 20 98 0" fill="none" stroke="#c62828" stroke-width="3"/>
    <text x="119" y="180" text-anchor="middle" font-weight="600" fill="#c62828">flat ceiling</text>
    <text x="119" y="198" text-anchor="middle" font-size="11" fill="#c62828">sags, or needs support inside a cavity</text>

    <rect x="276" y="52" width="170" height="104" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M308 140 h106 l-53 -54 z" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#2e7d32" stroke-width="2.5" fill="none"><path d="M414 120 l7 8 l15 -18"/></g>
    <text x="361" y="180" text-anchor="middle" font-weight="600" fill="#2e7d32">two 45° faces meeting at a ridge</text>
    <text x="361" y="198" text-anchor="middle" font-size="11" fill="#2e7d32">no support, invisible from outside</text>

    <text x="20" y="216" font-size="11" fill="#5a5a5a">The most useful single trick for internal cavities, cable channels and pockets.</text>
  </g>
</svg>
