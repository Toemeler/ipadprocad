<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" role="img" aria-label="Five ways to remove an overhang, in order">
  <rect x="0" y="0" width="500" height="240" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Five moves, in the order worth trying them</text>

    <g>
      <rect x="26" y="52" width="76" height="56" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <path d="M60 60 l16 16 l-16 16 l-16 -16 z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
      <text x="64" y="128" text-anchor="middle" font-weight="600">1 · reorient</text>
      <text x="64" y="144" text-anchor="middle" fill="#5a5a5a">check the load</text>
      <text x="64" y="158" text-anchor="middle" fill="#5a5a5a">path first</text>
    </g>
    <g>
      <path d="M118 108 h76 v-34 l-20 -22 h-56 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <text x="156" y="128" text-anchor="middle" font-weight="600">2 · chamfer</text>
      <text x="156" y="144" text-anchor="middle" fill="#5a5a5a">to 45°</text>
    </g>
    <g>
      <rect x="210" y="52" width="76" height="56" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <path d="M248 58 L266 84 A 18 18 0 1 1 230 84 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
      <text x="248" y="128" text-anchor="middle" font-weight="600">3 · teardrop</text>
      <text x="248" y="144" text-anchor="middle" fill="#5a5a5a">horizontal holes</text>
    </g>
    <g>
      <rect x="302" y="52" width="76" height="56" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="320" y="70" width="40" height="32" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
      <rect x="320" y="70" width="40" height="5" fill="#2e7d32"/>
      <text x="340" y="128" text-anchor="middle" font-weight="600">4 · sacrificial</text>
      <text x="340" y="144" text-anchor="middle" fill="#5a5a5a">bridge layer</text>
    </g>
    <g>
      <rect x="394" y="52" width="34" height="56" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="434" y="52" width="34" height="56" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <text x="431" y="128" text-anchor="middle" font-weight="600">5 · split</text>
      <text x="431" y="144" text-anchor="middle" fill="#5a5a5a">a joint to glue</text>
    </g>

    <text x="20" y="190" font-size="12" font-weight="600">Rotate the part, then look at it from directly below. Everything</text><text x="20" y="206" font-size="12" font-weight="600">you can see is an overhang.</text>
    <text x="20" y="212" font-size="11" fill="#5a5a5a">Stop at the first move that fits. Where support is genuinely unavoidable,</text><text x="20" y="226" font-size="11" fill="#5a5a5a">make it easy: accessible, and on a face nobody measures.</text>
  </g>
</svg>
