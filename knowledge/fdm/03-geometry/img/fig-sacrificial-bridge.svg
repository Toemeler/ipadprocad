<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 260" width="530" height="260" role="img" aria-label="The sacrificial bridge layer trick">
  <rect x="0" y="0" width="530" height="260" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Sacrificial bridge layer</text>

    <g>
      <rect x="30" y="52" width="120" height="110" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="90" cy="100" r="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
      <path d="M72 80 q18 -10 36 0" stroke="#c62828" stroke-width="3" fill="none"/>
      <text x="90" y="186" text-anchor="middle" font-weight="600" fill="#c62828">plain horizontal hole</text>
      <text x="90" y="202" text-anchor="middle" fill="#c62828">the top is a flat overhang</text>
    </g>

    <g stroke="#1a1a1a" stroke-width="2" fill="#1a1a1a">
      <line x1="170" y1="100" x2="196" y2="100"/><polygon points="196,94 208,100 196,106"/>
    </g>

    <g>
      <rect x="226" y="52" width="120" height="110" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <path d="M258 128 a28 28 0 0 1 56 0 z" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="258" y="72" width="56" height="56" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="258" y="72" width="56" height="5" fill="#2e7d32"/>
      <text x="286" y="186" text-anchor="middle" font-weight="600" fill="#2e7d32">flat floor added</text>
      <text x="286" y="202" text-anchor="middle" fill="#2e7d32">printer bridges a short flat span</text>
    </g>

    <g stroke="#1a1a1a" stroke-width="2" fill="#1a1a1a">
      <line x1="364" y1="100" x2="390" y2="100"/><polygon points="390,94 402,100 390,106"/>
    </g>

    <g>
      <circle cx="440" cy="100" r="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
      <text x="440" y="186" text-anchor="middle" font-weight="600">drilled out</text>
      <text x="440" y="202" text-anchor="middle" fill="#5a5a5a">round hole, no support</text>
    </g>

    <text x="20" y="228" font-size="11" fill="#5a5a5a">The floor is 0.2–0.4 mm — one or two layers. It peels away or is drilled</text><text x="20" y="242" font-size="11" fill="#5a5a5a">through afterwards.</text>
  </g>
</svg>
