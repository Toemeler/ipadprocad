<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="Rib thickness rule differs between injection moulding and FDM">
  <rect x="0" y="0" width="480" height="230" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">The rib rule does not transfer between processes</text>

    <g>
      <rect x="40" y="56" width="170" height="26" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="112" y="82" width="15" height="66" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <path d="M104 56 q16 7 30 0" stroke="#c62828" stroke-width="2.5" fill="none"/>
      <text x="125" y="176" text-anchor="middle" font-weight="600">injection moulding</text>
      <text x="125" y="194" text-anchor="middle" font-size="11" fill="#5a5a5a">rib = 0.6 × wall</text>
      <text x="125" y="210" text-anchor="middle" font-size="11" fill="#c62828">thicker → sink mark on the far face</text>
    </g>

    <g>
      <rect x="270" y="56" width="170" height="26" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="344" y="82" width="26" height="66" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <g stroke="#2e7d32" stroke-width="2.5" fill="none"><path d="M398 118 l7 8 l15 -18"/></g>
      <text x="355" y="176" text-anchor="middle" font-weight="600">FDM</text>
      <text x="355" y="194" text-anchor="middle" font-size="11" fill="#2e7d32">rib = wall</text>
      <text x="355" y="210" text-anchor="middle" font-size="11" fill="#2e7d32">no melt, no mould, no sink marks</text>
    </g>
  </g>
</svg>
