<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="Chamfer at the bottom, fillet at the top">
  <rect x="0" y="0" width="480" height="230" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Bottom outside edge: chamfer, never fillet</text>

    <line x1="30" y1="150" x2="210" y2="150" stroke="#9a9a9a" stroke-width="4"/>
    <path d="M60 150 q0 -26 26 -26 h68 q26 0 26 26 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M60 150 v-30 h120 v30" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="0"/>
    <path d="M60 120 h120 v-64 h-120 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M60 150 q0 -26 26 -26 M180 150 q0 -26 -26 -26" fill="none" stroke="#c62828" stroke-width="3"/>
    <text x="120" y="180" text-anchor="middle" font-weight="600" fill="#c62828">fillet at the bottom</text>
    <text x="120" y="198" text-anchor="middle" font-size="11" fill="#c62828">starts as a 90° overhang —</text>
    <text x="120" y="214" text-anchor="middle" font-size="11" fill="#c62828">prints as a drooping lip</text>

    <line x1="270" y1="150" x2="450" y2="150" stroke="#9a9a9a" stroke-width="4"/>
    <path d="M300 150 l14 -14 h92 l14 14 z" fill="#d9d9d9" stroke="#2e7d32" stroke-width="2"/>
    <path d="M314 136 h92 v-80 h-92 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <text x="360" y="180" text-anchor="middle" font-weight="600" fill="#2e7d32">chamfer at the bottom</text>
    <text x="360" y="198" text-anchor="middle" font-size="11" fill="#2e7d32">45° — self-supporting</text>

    <text x="20" y="226" font-size="11" fill="#5a5a5a">Fillets belong on vertical corners and on internal corners under load. Both print perfectly there.</text>
  </g>
</svg>
