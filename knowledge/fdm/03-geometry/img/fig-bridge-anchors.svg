<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="A bridge with both ends anchored, and one without">
  <rect x="0" y="0" width="480" height="220" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">A bridge needs both ends anchored</text>

    <g stroke="#1a1a1a" stroke-width="2" fill="#d9d9d9">
      <rect x="34" y="70" width="34" height="80"/><rect x="152" y="70" width="34" height="80"/>
      <rect x="34" y="56" width="152" height="14"/>
    </g>
    <g stroke="#2e7d32" stroke-width="2.5" fill="none"><path d="M196 128 l7 8 l15 -18"/></g>
    <text x="110" y="176" text-anchor="middle" font-weight="600" fill="#2e7d32">bridge</text>
    <text x="110" y="194" text-anchor="middle" font-size="11" fill="#2e7d32">both ends on the same layer</text>

    <g stroke="#1a1a1a" stroke-width="2" fill="#d9d9d9">
      <rect x="290" y="70" width="34" height="80"/>
      <path d="M290 56 h130 l0 14 h-130 z"/>
    </g>
    <path d="M324 62 q40 26 90 34" stroke="#c62828" stroke-width="3" fill="none"/>
    <circle cx="400" cy="84" r="16" fill="none" stroke="#c62828" stroke-width="2"/>
    <text x="358" y="176" text-anchor="middle" font-weight="600" fill="#c62828">not a bridge</text>
    <text x="358" y="194" text-anchor="middle" font-size="11" fill="#c62828">one end in mid-air — it droops</text>

    <text x="20" y="214" font-size="11" fill="#5a5a5a">PLA ≈ 50 mm max, PETG and ABS ≈ 30 mm, nylon ≈ 25 mm, TPU none at all.</text>
  </g>
</svg>
