<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="Overhang angles from 30 to 70 degrees">
  <rect x="0" y="0" width="480" height="230" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Overhang angle, measured from vertical</text>

    <g stroke="#1a1a1a" stroke-width="2">
      <polygon points="34,160 34,52 96,160" fill="#d9d9d9"/>
      <polygon points="126,160 126,52 214,160" fill="#d9d9d9"/>
      <polygon points="244,160 244,52 352,160" fill="#d9d9d9"/>
      <polygon points="372,160 372,52 464,84 464,160" fill="#d9d9d9"/>
    </g>
    <g stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3">
      <line x1="34" y1="52" x2="34" y2="170"/><line x1="126" y1="52" x2="126" y2="170"/>
      <line x1="244" y1="52" x2="244" y2="170"/><line x1="372" y1="52" x2="372" y2="170"/>
    </g>

    <text x="62" y="186" text-anchor="middle" font-weight="600" fill="#2e7d32">30°</text>
    <text x="62" y="202" text-anchor="middle" fill="#2e7d32">clean</text>

    <text x="168" y="186" text-anchor="middle" font-weight="600" fill="#2e7d32">45°</text>
    <text x="168" y="202" text-anchor="middle" fill="#2e7d32">the working limit</text>

    <text x="296" y="186" text-anchor="middle" font-weight="600">60°</text>
    <text x="296" y="202" text-anchor="middle" fill="#5a5a5a">rough underside</text>

    <path d="M394 82 q22 16 44 6" stroke="#c62828" stroke-width="2.5" fill="none"/>
    <text x="418" y="186" text-anchor="middle" font-weight="600" fill="#c62828">72°</text>
    <text x="418" y="202" text-anchor="middle" fill="#c62828">droops — support it</text>

    <text x="20" y="224" font-size="11" fill="#5a5a5a">At 45° each layer still has half its width sitting on the layer below. Past 60° it has almost nothing.</text>
  </g>
</svg>
