<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 245" width="480" height="245" role="img" aria-label="Four walls at 15 percent infill against two walls at 60 percent">
  <rect x="0" y="0" width="480" height="245" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Walls carry load. Infill mostly does not.</text>

    <g>
      <rect x="40" y="50" width="160" height="100" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="40" y="50" width="160" height="100" fill="none" stroke="#1a1a1a" stroke-width="10"/>
      <g stroke="#bbbbbb" stroke-width="1.5">
        <line x1="60" y1="140" x2="180" y2="62"/><line x1="100" y1="140" x2="180" y2="102"/>
        <line x1="60" y1="102" x2="120" y2="62"/>
      </g>
      <text x="120" y="176" text-anchor="middle" font-weight="600" fill="#2e7d32">4 walls · 15 % infill</text>
      <text x="120" y="194" text-anchor="middle" font-size="11" fill="#2e7d32">stronger, lighter, faster</text>
    </g>

    <g>
      <rect x="280" y="50" width="160" height="100" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
      <rect x="280" y="50" width="160" height="100" fill="none" stroke="#1a1a1a" stroke-width="5"/>
      <g stroke="#bbbbbb" stroke-width="1.5">
        <line x1="290" y1="145" x2="435" y2="55"/><line x1="290" y1="120" x2="420" y2="55"/><line x1="290" y1="95" x2="390" y2="55"/>
        <line x1="290" y1="70" x2="350" y2="55"/><line x1="315" y1="145" x2="435" y2="80"/><line x1="350" y1="145" x2="435" y2="105"/>
        <line x1="385" y1="145" x2="435" y2="128"/>
      </g>
      <text x="360" y="176" text-anchor="middle" font-weight="600" fill="#c62828">2 walls · 60 % infill</text>
      <text x="360" y="194" text-anchor="middle" font-size="11" fill="#c62828">weaker, heavier, slower</text>
    </g>

    <text x="20" y="214" font-size="11" fill="#5a5a5a">Solve strength with walls. Leave infill at 15 % — its job is supporting</text><text x="20" y="228" font-size="11" fill="#5a5a5a">the top surface.</text>
  </g>
</svg>
