<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-label="Gussets against a thicker plate">
  <rect x="0" y="0" width="480" height="230" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">Two ways to stiffen the same bracket</text>

    <g>
      <path d="M34 150 h130 v-26 h-104 v-70 h-26 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <text x="100" y="180" text-anchor="middle" font-weight="600">8 mm plate</text>
      <text x="100" y="198" text-anchor="middle" fill="#5a5a5a">×2 material · ×2 print time</text>
      <text x="100" y="214" text-anchor="middle" fill="#5a5a5a">stiffness ×1.0 (reference)</text>
    </g>

    <g>
      <path d="M286 150 h130 v-14 h-116 v-82 h-14 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <polygon points="300,136 300,86 350,136" fill="#d9d9d9" stroke="#2e7d32" stroke-width="2"/>
      <polygon points="300,136 300,110 326,136" fill="none" stroke="#2e7d32" stroke-width="0"/>
      <path d="M300 136 q0 -8 8 -8" fill="none" stroke="#2e7d32" stroke-width="2"/>
      <text x="352" y="180" text-anchor="middle" font-weight="600" fill="#2e7d32">4.2 mm plate + 2 gussets</text>
      <text x="352" y="198" text-anchor="middle" fill="#2e7d32">×1.2 material · ×1.3 print time</text>
      <text x="352" y="214" text-anchor="middle" fill="#2e7d32">stiffness ×2.5</text>
    </g>

    <text x="20" y="80" font-size="12" font-weight="600" fill="#0b6bcb">Stiffness ∝ depth³</text>
    <text x="20" y="98" font-size="11" fill="#5a5a5a">6 mm inside fillet at the corner:</text>
    <text x="20" y="114" font-size="11" fill="#5a5a5a">the highest-stressed point in the part</text>
  </g>
</svg>
