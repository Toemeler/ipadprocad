<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-label="The worked bracket in three orientations with the load path">
  <rect x="0" y="0" width="480" height="250" rx="10" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#1a1a1a">
    <text x="20" y="26" font-size="14" font-weight="600">5 kg at 60 mm — the same bracket three ways</text>

    <g>
      <path d="M30 150 h110 v-18 h-92 v-64 h-18 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="0.8">
        <line x1="30" y1="140" x2="140" y2="140"/><line x1="30" y1="132" x2="140" y2="132"/>
        <line x1="30" y1="112" x2="48" y2="112"/><line x1="30" y1="92" x2="48" y2="92"/>
      </g>
      <g stroke="#0b6bcb" stroke-width="2" fill="#0b6bcb">
        <line x1="130" y1="160" x2="130" y2="180"/><polygon points="125,180 130,192 135,180"/>
      </g>
      <text x="84" y="212" text-anchor="middle" font-weight="600" fill="#2e7d32">flat</text>
      <text x="84" y="228" text-anchor="middle" fill="#2e7d32">tension along the threads</text>
      <text x="84" y="242" text-anchor="middle" fill="#2e7d32">strongest · no supports</text>
    </g>

    <g>
      <path d="M186 150 h110 v-18 h-92 v-64 h-18 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="0.8">
        <line x1="186" y1="140" x2="296" y2="140"/><line x1="186" y1="124" x2="296" y2="124"/>
        <line x1="186" y1="108" x2="204" y2="108"/><line x1="186" y1="92" x2="204" y2="92"/><line x1="186" y1="76" x2="204" y2="76"/>
      </g>
      <path d="M198 132 l-8 -8 M212 132 l8 -8" stroke="#c62828" stroke-width="2.5"/>
      <circle cx="205" cy="132" r="15" fill="none" stroke="#c62828" stroke-width="2"/>
      <text x="240" y="212" text-anchor="middle" font-weight="600" fill="#c62828">upright</text>
      <text x="240" y="228" text-anchor="middle" fill="#c62828">tension pulls the welds apart</text>
      <text x="240" y="242" text-anchor="middle" fill="#c62828">≈ 25 % of the strength</text>
    </g>

    <g transform="rotate(-45 396 110)">
      <path d="M342 150 h110 v-18 h-92 v-64 h-18 z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    </g>
    <text x="396" y="212" text-anchor="middle" font-weight="600">45°</text>
    <text x="396" y="228" text-anchor="middle" fill="#5a5a5a">good, smooth faces</text>
    <text x="396" y="242" text-anchor="middle" fill="#5a5a5a">needs supports</text>

    <text x="20" y="190" font-size="11" fill="#5a5a5a">Three identical models. Record the orientation in the part — an engraved arrow on the face that goes down.</text>
  </g>
</svg>
