name: Core + C-API Build (iOS)  # M1 core (green) + M2 C-ABI wrapper & iOS bundle

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

permissions:
  contents: write

# Bei schnellen aufeinanderfolgenden Pushes den veralteten Run abbrechen
# (spart Minuten & Artefakt-Storage).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # FAST FEEDBACK — läuft parallel zu allem anderen und wird in ~3 min rot.
  #
  # Warum: `flutter analyze` + die Host-Tests laufen ausserdem in
  # `m5-flutter-ipa`, dort aber erst NACH Qt-Install, OCCT-Cache und
  # Core-Build. Ein Dart-Tippfehler kostete dadurch ~20 Minuten statt ~3.
  # Dieser Job dupliziert die beiden Schritte bewusst auf einem billigen
  # ubuntu-Runner; die Prüfungen in m5 bleiben als Absicherung stehen (sie
  # laufen dort gegen das per `flutter create` erzeugte Projekt).
  #
  # Kein iOS-Scaffolding hier: `flutter analyze`/`test` brauchen nur
  # `pub get`. Die In-Repo-Plugin-Pods sind Path-Dependencies mit reinem
  # Dart-Interface, das auf Linux auflösbar ist.
  dart-checks:
    name: Dart analyze + host tests (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: frontend
        run: flutter pub get

      # M222a — the perf tooling verifies ITSELF.
      #
      # ci/perf_report.py and ci/perf_profile.py decide what every number in
      # PERFORMANCE_PROFILE.md means: they fit the exponents, compute the
      # confidence intervals, and decide which values sit below the
      # instrument's 1 us resolution and must not be printed as digits. Until
      # M222a neither had a test and neither ran in CI — the whole
      # quantitative case rested on two unverified scripts, which is the exact
      # defect the profile keeps finding in the app, applied to the apparatus.
      #
      # The tests check the statistics against ANALYTIC ground truth (an exact
      # power law must recover its exponent; a CI must contain the true value;
      # two points must yield no interval), so they cannot drift with the
      # recorded output.
      - name: Perf tooling tests
        run: python3 -m unittest discover -s ci -p 'test_*.py' -v

      - name: Analyze Dart
        working-directory: frontend
        run: |
          set -o pipefail
          # infos/warnings duerfen nicht failen — nur echte Fehler (gleiche
          # Flags wie in m5, sonst weichen die beiden Jobs auseinander).
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 \
            | tee ../ci-dart-analyze.log

      - name: Host tests
        working-directory: frontend
        run: |
          set -o pipefail
          # pipefail macht den Exitcode massgeblich. NICHT nach einer
          # Erfolgsmeldung greppen — die Formulierung wechselt zwischen
          # Flutter-Versionen.
          flutter test 2>&1 | tee ../ci-dart-tests.log

      - name: Commit dart-check logs
        if: always()
        run: |
          mkdir -p ci-logs-dart
          cp ci-dart-analyze.log ci-logs-dart/ 2>/dev/null || true
          # The whole log, gzipped. Two attempts at extracting "just the
          # failure" both missed it — the tail caught 400 lines of passing
          # tests and the marker grep matched nothing — and each miss cost a
          # CI round trip. A megabyte on a debug branch is cheaper than a
          # third guess about how the reporter formats a failure.
          gzip -9 -c ci-dart-tests.log > ci-logs-dart/ci-dart-tests.log.gz \
            2>/dev/null || true
          git config user.email "ci@prototype.local"
          git config user.name "Prototype CI"
          git add -f ci-logs-dart
          git commit -m "CI(dart): analyze+test logs from run ${{ github.run_id }}" \
            || exit 0
          git push origin HEAD:ci-debug-logs-dart --force

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-checks-logs
          path: |
            ci-dart-analyze.log
            ci-dart-tests.log
          if-no-files-found: ignore

  build-core-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4


      - name: Install Qt6 (host, for tools)
        id: qt_host_install
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          target: 'desktop'
          dir: '${{ github.workspace }}/qt-host'
          cache: true

      - name: Capture host Qt path
        id: qt_host
        run: |
          echo "path=${QT_ROOT_DIR}" >> "$GITHUB_OUTPUT"
          echo "QT_ROOT_DIR after host install: ${QT_ROOT_DIR}" > env-dump.log

      - name: Install Qt6 (iOS)
        id: qt_ios_install
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          target: 'ios'
          dir: '${{ github.workspace }}/qt-ios'
          cache: true

      - name: Capture iOS Qt path
        id: qt_ios
        run: |
          echo "path=${QT_ROOT_DIR}" >> "$GITHUB_OUTPUT"
          echo "QT_ROOT_DIR after iOS install: ${QT_ROOT_DIR}" >> env-dump.log

      - name: Install Ninja
        run: brew install ninja

      - name: Configure (iOS target)
        working-directory: backend/qcad-core
        run: |
          {
          set -o pipefail
          echo "qt_host path: ${{ steps.qt_host.outputs.path }}"
          echo "qt_ios path: ${{ steps.qt_ios.outputs.path }}"
          ls "${{ steps.qt_host.outputs.path }}/lib/cmake/Qt6CoreTools" 2>&1 || echo "no Qt6CoreTools dir at host path"
          # QCAD_CAPI_SMOKE stays OFF on iOS: there is no link step for .a there,
          # so the executable smoke test only runs on the Linux host build.
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.qt_ios.outputs.path }}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="${{ steps.qt_host.outputs.path }}" \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_QT6=ON
          } 2>&1 | tee ../../ci-configure.log

      - name: Build (core + C-API wrapper)
        working-directory: backend/qcad-core
        run: |
          set -o pipefail
          # -k 0 (keep-going): surface ALL compile errors in a single run rather
          # than stopping at the first — needed for fast iOS-portability iteration.
          # The static qcadcapi target is part of the tree (root CMakeLists), so
          # this builds the M2 wrapper for arm64/iphoneos alongside the core.
          cmake --build build -j -- -k 0 2>&1 | tee ../../ci-build.log

      - name: Verify static libraries (incl. C-API)
        working-directory: backend/qcad-core
        run: |
          set -e
          set -o pipefail
          {
            expected=(
              release/libqcadcore.a
              release/libqcadentity.a
              release/libqcadoperations.a
              release/libdxflib.a
              plugins/libqcaddxf.a
              release/libqcadcapi.a
            )
            missing=0
            for f in "${expected[@]}"; do
              if [ -f "$f" ]; then
                echo "OK   $f"
                lipo -info "$f" 2>/dev/null || true
              else
                echo "MISSING $f"
                missing=1
              fi
            done
            [ "$missing" -eq 0 ] || { echo "One or more expected libraries are missing."; exit 1; }
          } 2>&1 | tee ../../ci-verify.log

      - name: Bundle combined static library (iOS arm64)
        working-directory: backend/qcad-core
        run: |
          set -e
          set -o pipefail
          {
            # Merge the C-API wrapper + all core libs into a single archive the
            # app can link directly. libtool resolves duplicate members.
            libtool -static -o release/libprototype.a \
              release/libqcadcapi.a \
              release/libqcadcore.a \
              release/libqcadentity.a \
              release/libqcadoperations.a \
              plugins/libqcaddxf.a \
              release/libdxflib.a
            echo "Combined library:"
            ls -la release/libprototype.a
            lipo -info release/libprototype.a
          } 2>&1 | tee ../../ci-bundle.log

      - name: Package XCFramework (best-effort)
        id: xcframework
        continue-on-error: true
        working-directory: backend/qcad-core
        run: |
          set -e
          set -o pipefail
          {
            rm -rf release/prototype.xcframework include-public
            mkdir -p include-public
            cp src/capi/qcad_capi.h include-public/
            xcodebuild -create-xcframework \
              -library release/libprototype.a -headers include-public \
              -output release/prototype.xcframework
            echo "XCFramework created:"
            find release/prototype.xcframework -maxdepth 2 -print
          } 2>&1 | tee ../../ci-xcframework.log

      - name: Upload iOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: prototype-ios-capi
          path: |
            backend/qcad-core/release/libprototype.a
            backend/qcad-core/src/capi/qcad_capi.h
            backend/qcad-core/release/prototype.xcframework
          if-no-files-found: warn

      - name: Commit debug logs
        if: always()
        run: |
          mkdir -p ci-logs
          for l in env-dump ci-configure ci-build ci-verify ci-bundle ci-xcframework; do
            cp "$l.log" ci-logs/ 2>/dev/null || true
          done
          cp backend/qcad-core/build/CMakeFiles/CMakeError.log ci-logs/ 2>/dev/null || true
          cp backend/qcad-core/build/CMakeFiles/CMakeOutput.log ci-logs/ 2>/dev/null || true
          git config user.email "ci@prototype.local"
          git config user.name "Prototype CI"
          git add -f ci-logs
          git commit -m "CI: debug logs from run ${{ github.run_id }}" || exit 0
          git push origin HEAD:ci-debug-logs --force

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: core-capi-build-log
          path: backend/qcad-core/build/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # M3 — headless logic test on iOS. Builds the C-API + core + smoke for the
  # iphonesimulator (arm64) using the same CMake/Qt path proven for the device
  # in build-core-ios, then runs the smoke INSIDE a booted iOS Simulator via
  # `simctl spawn` and asserts "SMOKE: PASS". This exercises the real QCAD core
  # logic (entity create/count/bbox + DXF round-trip) on the iOS runtime.
  # NOTE: exercising the Dart FFI on-device needs the Flutter/Dart runtime and
  # is deferred to M4 (see HANDOFF.md).
  # ---------------------------------------------------------------------------
  m3-ios-sim-logic:
    name: M3 headless logic test (iOS Simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 (host, for tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          target: 'desktop'
          dir: '${{ github.workspace }}/qt-host'
          cache: true

      - name: Capture host Qt path
        id: qt_host
        run: echo "path=${QT_ROOT_DIR}" >> "$GITHUB_OUTPUT"

      - name: Install Qt6 (iOS)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          target: 'ios'
          dir: '${{ github.workspace }}/qt-ios'
          cache: true

      - name: Capture iOS Qt path
        id: qt_ios
        run: echo "path=${QT_ROOT_DIR}" >> "$GITHUB_OUTPUT"

      - name: Install Ninja
        run: brew install ninja

      - name: Probe Qt iOS architectures (diagnostic)
        run: |
          {
            QTIOS="${{ steps.qt_ios.outputs.path }}"
            echo "iOS Qt path: $QTIOS"
            echo "== arch of the static libs =="
            for l in libQt6Core.a libQt6Gui.a libQt6Xml.a; do
              printf '%s: ' "$l"; lipo -info "$QTIOS/lib/$l" 2>&1 || true
            done
            echo "== arch/platform of a prebuilt Qt resource object =="
            OBJ="$QTIOS/lib/objects-Release/Gui_resources_1/.qt/rcc/qrc_qpdf_init.cpp.o"
            file "$OBJ" 2>&1 || true
            otool -l "$OBJ" 2>/dev/null | grep -A4 -i 'LC_BUILD_VERSION' | head -20 || true
            echo "== any simulator-specific tree? =="
            find "$QTIOS" -iname '*simulator*' 2>/dev/null | head -20 || true
          } 2>&1 | tee ci-qt-ios-layout.log

      - name: Configure (iOS Simulator, x86_64)
        working-directory: backend/qcad-core
        run: |
          # pipefail MUSS ausserhalb des { }|tee stehen: innerhalb wirkt es nur
          # in der Subshell und der Step-Status waere der von tee (immer 0).
          set -o pipefail
          {
          # The Qt-for-iOS package ships UNIVERSAL archives/objects:
          #   arm64  slice -> platform 2 (iOS device)
          #   x86_64 slice -> platform 7 (iOS Simulator)
          # There is no arm64-simulator slice, so the simulator logic test must
          # be built for x86_64 (runs via Rosetta on the arm64 runner).
          # Qt's prebuilt resource objects have minos 14.0 -> deployment 14.0.
          cmake -B build-sim \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.qt_ios.outputs.path }}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="${{ steps.qt_host.outputs.path }}" \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_QT6=ON \
            -DQCAD_CAPI_SMOKE=ON
          } 2>&1 | tee ../../ci-sim-configure.log

      - name: Build (core + C-API + smoke, simulator)
        working-directory: backend/qcad-core
        run: |
          set -o pipefail
          cmake --build build-sim -j -- -k 0 2>&1 | tee ../../ci-sim-build.log

      - name: Locate & inspect smoke binary
        working-directory: backend/qcad-core
        run: |
          set -o pipefail
          {
            SMOKE="$(find . -name qcad_capi_smoke -type f | head -1)"
            echo "smoke binary (relative): $SMOKE"
            [ -n "$SMOKE" ] || { echo "smoke binary not found"; exit 1; }
            SMOKE_ABS="$(cd "$(dirname "$SMOKE")" && pwd)/$(basename "$SMOKE")"
            echo "$SMOKE_ABS" > ../../smoke_path.txt
            echo "smoke binary (abs): $SMOKE_ABS"
            file "$SMOKE_ABS" || true
            lipo -info "$SMOKE_ABS" || true
            echo "== build-version load command (expect platform 7 = iOS Simulator) =="
            otool -l "$SMOKE_ABS" | grep -A5 -i 'LC_BUILD_VERSION' | head -40 || true
          } 2>&1 | tee ../../ci-sim-inspect.log

      - name: Boot simulator & run headless logic test
        timeout-minutes: 20
        working-directory: backend/qcad-core
        run: |
          # pipefail MUSS ausserhalb des { }|tee stehen (sonst falsches Gruen:
          # Run 29043802347 meldete gruen trotz "M3 LOGIC TEST: FAIL" im Log).
          set -o pipefail
          {
            SMOKE_ABS="$(cat ../../smoke_path.txt)"
            APP_DIR="$(dirname "$SMOKE_ABS")"
            echo "smoke: $SMOKE_ABS"
            echo "app bundle: $APP_DIR"
            # x86_64-Sim-Prozess auf arm64-Runner braucht Rosetta.
            sudo softwareupdate --install-rosetta --agree-to-license || true
            # WICHTIG (Erkenntnis aus Run 29043802347): `simctl spawn` haengt mit
            # 0 Byte Output. Ursache: das statisch gelinkte Qt-iOS-Platform-Plugin
            # interponiert main() und startet UIApplicationMain; ohne UI-Kontext
            # (spawn) laeuft unser main nie an. Daher: als echte App installieren
            # und mit `launch --console-pty` starten — dann ruft Qt unser main
            # nach dem UIApplication-Start auf und stdout wird durchgereicht.
            # Die von CMake generierte Default-Info.plist hat LEERE Pflichtfelder
            # (CFBundleIdentifier/-Version leer -> "does not contain
            # CFBundleVersion" beim simctl install, Run 29045268701). Daher
            # IMMER mit einer minimalen gueltigen Plist ueberschreiben.
            echo "writing minimal Info.plist (overwriting CMake default)"
              printf '%s\n' \
                '<?xml version="1.0" encoding="UTF-8"?>' \
                '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
                '<plist version="1.0"><dict>' \
                '  <key>CFBundleIdentifier</key><string>com.prototype.smoke</string>' \
                '  <key>CFBundleExecutable</key><string>qcad_capi_smoke</string>' \
                '  <key>CFBundleName</key><string>qcad_capi_smoke</string>' \
                '  <key>CFBundlePackageType</key><string>APPL</string>' \
                '  <key>CFBundleVersion</key><string>1</string>' \
                '  <key>CFBundleShortVersionString</key><string>1.0</string>' \
                '  <key>MinimumOSVersion</key><string>14.0</string>' \
                '</dict></plist>' > "$APP_DIR/Info.plist"
            BID="com.prototype.smoke"
            echo "bundle id: $BID"
            cat "$APP_DIR/Info.plist"
            UDID=""
            for name in "iPhone 15" "iPhone 14" "iPhone SE (3rd generation)" "iPhone 15 Pro"; do
              if UDID="$(xcrun simctl create m3-iphone "$name" 2>/dev/null)"; then
                echo "created sim '$name' -> $UDID"; break
              fi
              UDID=""
            done
            [ -n "$UDID" ] || { echo "could not create a simulator"; xcrun simctl list devicetypes; exit 1; }
            xcrun simctl boot "$UDID"
            for i in $(seq 1 24); do
              STATE="$(xcrun simctl list devices | grep "$UDID" | grep -o 'Booted' || true)"
              [ "$STATE" = "Booted" ] && { echo "sim booted (after ~$((i*5))s)"; break; }
              sleep 5
            done
            xcrun simctl install "$UDID" "$APP_DIR"
            echo "== launch (console-pty) =="
            set +e
            # perl-alarm = Hard-Timeout (5 min); macOS hat kein timeout(1).
            OUT="$(perl -e 'alarm 300; exec @ARGV or die "exec: $!"' -- xcrun simctl launch --console-pty --terminate-running-process "$UDID" "$BID" 2>&1)"; RC=$?
            set -e
            echo "$OUT"
            echo "== launch exit: $RC =="
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl delete "$UDID" || true
            # Urteil ueber den Marker, nicht den launch-RC (der RC von
            # `simctl launch` ist nicht der Exit-Code der App). rc=142 (SIGALRM)
            # heisst Haenger -> in dem Fall fehlt der Marker ohnehin.
            echo "$OUT" | grep -q "SMOKE: FAIL" && { echo "M3 LOGIC TEST: FAIL (smoke reported failures)"; exit 1; }
            echo "$OUT" | grep -q "SMOKE: PASS" || { echo "M3 LOGIC TEST: FAIL (PASS marker missing, launch rc=$RC)"; exit 1; }
            echo "M3 LOGIC TEST: PASS"
          } 2>&1 | tee ../../ci-sim-run.log

      - name: Commit M3 debug logs
        if: always()
        run: |
          mkdir -p ci-logs-m3
          for l in ci-qt-ios-layout ci-sim-configure ci-sim-build ci-sim-inspect ci-sim-run; do
            cp "$l.log" ci-logs-m3/ 2>/dev/null || true
          done
          cp backend/qcad-core/build-sim/CMakeFiles/CMakeError.log ci-logs-m3/ 2>/dev/null || true
          git config user.email "ci@prototype.local"
          git config user.name "Prototype CI"
          git add -f ci-logs-m3
          git commit -m "CI(M3): iOS-sim logic-test logs from run ${{ github.run_id }}" || exit 0
          git push origin HEAD:ci-debug-logs-m3 --force

      - name: Upload M3 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: prototype-m3-sim-logic
          path: |
            ci-sim-run.log
            ci-sim-build.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # M5 — Flutter app (1:1 UI port) linked against the QCAD core, packaged as an
  # UNSIGNED IPA for sideloading (AltStore/Sideloadly re-sign on install).
  #
  # Link strategy: the combined static lib (libprototype.a) is force-loaded
  # into the Runner binary and the qcad_* symbols are kept in the export trie
  # (exported_symbols_list) so Dart's DynamicLibrary.process() can dlsym them.
  # All Qt-for-iOS static archives from <qt-ios>/lib are appended; ld64 only
  # extracts referenced members. The qios platform plugin is deliberately NOT
  # linked (it interposes main() -> would hijack Flutter's main, see M3 notes).
  #
  # Honest-verdict notes:
  #  - "M5 LINK CHECK" greps the built Runner binary for the C-API version
  #    string literal, which survives stripping — proof the core is linked in.
  #  - The Dart-FFI runtime smoke ("DART SMOKE: PASS (backend=qcad-ffi...)")
  #    prints at app start ON DEVICE; it is NOT exercised by this job.
  #  - "THUMB CHANNEL CHECK" (M82) proves the off-screen still renderer got
  #    compiled into the Runner. It cannot prove the SNAPSHOT succeeds — that
  #    needs a window and a render loop, i.e. the device. A green check here
  #    means "the RealityKit preview path exists", not "the preview is right".
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # M307 — Cycles for iOS, built beside everything else rather than in the way.
  # ---------------------------------------------------------------------------
  #
  # This is the job that puts a path tracer in the IPA. It runs IN PARALLEL
  # with the Qt/OCCT/Flutter work in m5-flutter-ipa, so on a cache miss it
  # costs ten minutes of a second runner and nearly nothing of wall time, and
  # on a cache hit it costs seconds.
  #
  # WHY IT BUILDS INSIDE BLENDER'S TREE: intern/cycles is Apache-2.0 and is
  # meant to be embedded, but its CMake still expects Blender's top level to
  # have found Embree, TBB, OpenImageIO and OpenColorIO first. Blender's `ios`
  # branch already configures and builds for iOS device; borrowing it is a
  # dozen lines, and configuring Cycles standalone for iOS is a project.
  # M294..M305 are the record of getting this to work; the probe workflow is
  # where it was worked out.
  #
  # WHAT IT PRODUCES, in cycles-dist/:
  #   lib/     the nine Cycles archives plus libcycles_shim.a
  #   deps/    ONLY the dependency archives the link actually pulled from,
  #            discovered with `-Wl,-t` rather than guessed — lib/ios_arm64
  #            holds 275 archives and most of them are for a Blender this app
  #            is not building
  #   source/  intern/cycles itself. NOT optional and not a debugging
  #            convenience: the Metal backend compiles its kernels from source
  #            at runtime (device_impl.mm, path_source_replace_includes), so
  #            these files are as much a runtime dependency as the archives.
  cycles-ios:
    name: Cycles for iOS (arm64)
    runs-on: macos-15
    timeout-minutes: 90
    # NON-BLOCKING, and it stays that way until a device has actually
    # rendered. The IPA was shipping long before there was a path tracer and
    # must keep shipping if this job breaks: every consumer downstream —
    # cycles_boot's launch check, CyclesSession.available, cyclesWanted — is
    # already written to treat an absent renderer as the normal case, because
    # that is what every host test and every build before now has been. A red
    # Cycles job costing the whole build its IPA would be the tail wagging the
    # dog.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Keyed on the shim and on this job's own definition. Blender's ref is
      # pinned below, so nothing else can change the output.
      - name: Cache the built Cycles distribution
        id: dist
        uses: actions/cache@v4
        with:
          path: cycles-dist
          # The render assets are NOT in this key and NOT in this cache. They
          # are read from the checkout by the packaging job, so dropping a 24 MB
          # HDRI into the repository costs a file copy rather than a full
          # Blender + Cycles rebuild. Nothing in cycles-dist depends on them.
          # M367 — the PATCHES and the HARVEST SCRIPT are in the key too, and
          # for the same reason as the shim: both decide what ends up in this
          # artifact.
          #
          # The patches edit Cycles' own sources before the build, so a change
          # to one produces a different libcycles_session.a from identical shim
          # sources. And harvest_cycles_dylibs.sh runs INSIDE this cached step
          # — it is what chooses which dynamic libraries the app carries — so a
          # fix to it (M367 added OpenImageDenoise's dlopen'd device module,
          # which no load command names) would be restored away by the first
          # cache hit and the app would ship the old, incomplete set. Neither
          # miss would show up as a build failure; both would show up on a
          # device.
          key: cycles-dist-v4-${{ hashFiles('backend/cycles/shim/**') }}-${{ hashFiles('backend/cycles/patches/**') }}-${{ hashFiles('ci/harvest_cycles_dylibs.sh') }}-${{ hashFiles('.github/workflows/m1-core-build.yml') }}

      - name: Clone Blender's ios branch (shallow, no LFS)
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          REF=d9b6fe34ddce527d93b97c0bf42ad92cebac4e4e
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 2 --branch ios \
            https://projects.blender.org/blender/blender.git blender 2>&1 | tail -3
          cd blender
          git checkout "$REF" 2>/dev/null || { git fetch --depth 1 origin "$REF"; git checkout "$REF"; }
          git log --oneline -1

      - name: Cache the precompiled iOS dependency libraries
        if: steps.dist.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            blender/lib/ios_arm64
            blender/lib/macos_arm64
          key: blender-ios-libs-m294-v1

      - name: Fetch the iOS dependency libraries
        if: steps.dist.outputs.cache-hit != 'true'
        working-directory: blender
        run: |
          python3 ./build_files/utils/make_update.py --no-blender --use-ios-libraries 2>&1 | tail -5
          ls lib/ios_arm64 >/dev/null || { echo "no iOS libraries were fetched"; exit 1; }

      # The shim is a Cycles TARGET rather than something compiled beside
      # Cycles with flags copied out of the Xcode project. add_definitions()
      # and include_directories() are directory-scoped, so it gets exactly
      # what cycles_scene gets, by construction. M298 is why that matters:
      # around two dozen WITH_* defines change STRUCT LAYOUTS, and a set that
      # is merely close enough to compile links and then misreads memory.
      - name: Graft the shim into Cycles' tree
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          mkdir -p blender/intern/cycles/shim
          cp backend/cycles/shim/cycles_shim.cpp backend/cycles/shim/cycles_shim.h \
             backend/cycles/shim/cycles_denoise.cpp backend/cycles/shim/cycles_denoise.h \
             blender/intern/cycles/shim/
          cat backend/cycles/shim/append.cmake >> blender/intern/cycles/CMakeLists.txt

      # M320 — the iOS Metal kernel-loading fixes, from Toemeler/blender-iOS-ipa.
      # Without them the first render compiles for minutes and NOTHING PERSISTS,
      # so every launch pays it again; with them it is paid once per install.
      # See backend/cycles/patches/ios_metal.py for what each edit is and which
      # on-device failure found it. Self-verifying: any anchor that does not
      # match exactly once fails the build rather than silently doing nothing.
      - name: Patch Cycles for iOS kernel loading
        if: steps.dist.outputs.cache-hit != 'true'
        run: python3 backend/cycles/patches/ios_metal.py

      # M367 — and the progressive-sampling edits, which is what makes the
      # viewport refine one sample at a time instead of in the jumps Cycles'
      # own display cadence produces. Three lines in RenderScheduler; see
      # backend/cycles/patches/progressive.py for the two knobs and why
      # neither is reachable without a patch. Self-verifying in the same way.
      - name: Patch Cycles for progressive sampling
        if: steps.dist.outputs.cache-hit != 'true'
        run: python3 backend/cycles/patches/progressive.py

      # M367 — WHICH DENOISER THIS BUILD WILL HAVE, asked rather than assumed.
      #
      # Cycles' own denoiser is OpenImageDenoise, it is the one Blender uses,
      # and the shim turns it on through Integrator::set_use_denoise. Whether
      # it is THERE is not ours to decide: `lib/ios_arm64` is Blender's own
      # package, fetched by make_update.py above, and it has not shipped OIDN
      # so far — run 6 of the probe found that out as an `_oidnSetFilterImage`
      # link failure after a full build.
      #
      # So the build asks. Absent, the app denoises the finished frame with
      # the a-trous filter in cycles_denoise.cpp and cy_denoiser_name says so;
      # present, Cycles does it and the app picks that up with no further
      # change. A grep is cheaper than a link failure and it prints the answer
      # into the log either way.
      - name: Does lib/ios_arm64 ship OpenImageDenoise?
        id: oidn
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          if find blender/lib/ios_arm64 -iname 'libOpenImageDenoise*' | grep -q . ; then
            echo "found:"
            find blender/lib/ios_arm64 -iname 'libOpenImageDenoise*'
            echo "with=ON" >> "$GITHUB_OUTPUT"
          else
            echo "lib/ios_arm64 does not ship OpenImageDenoise — the app will"
            echo "denoise the finished frame with cycles_denoise.cpp."
            echo "with=OFF" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure and build
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          # The four features that are OFF are off because this renders
          # triangles out of a CAD kernel: no volumes, no cached point clouds,
          # and no shader scripts. Each one left ON is a dependency chain
          # carried into an iPad app to compile code nothing will ever call.
          #
          # M367 — THE DENOISER IS NO LONGER ONE OF THEM, and the old reason
          # given for switching it off ("denoising smears exactly the crisp
          # machined edges the render exists to show") was about a denoiser
          # running continuously over a viewport. It runs once, on the frame
          # sampling has finished with, and albedo demodulation means a
          # material edge is not in the buffer being filtered at all — see
          # cycles_denoise.h. The switch above is now the honest one: OIDN if
          # the dependency set has it, the in-repo filter if not.
          cmake -S blender -B build_ios -G Xcode \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_CYCLES=ON \
            -DWITH_OPENIMAGEDENOISE=${{ steps.oidn.outputs.with }} \
            -DWITH_OPENVDB=OFF -DWITH_NANOVDB=OFF \
            -DWITH_ALEMBIC=OFF -DWITH_USD=OFF \
            -DWITH_CYCLES_OSL=OFF \
            -DWITH_CYCLES_PATH_GUIDING=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="" > configure.log 2>&1 \
            || { tail -30 configure.log; exit 1; }
          # bf_intern_guardedalloc and bf_intern_sky are Blender's, not
          # Cycles': built inside Blender's tree, Cycles allocates through
          # MEM_mallocN and calls the Nishita sky model. Leaving them out is
          # what run 610's cycles-ios job failed on, with four undefined
          # symbols that name them exactly.
          for t in cycles_util cycles_graph cycles_bvh cycles_subd \
                   cycles_scene cycles_integrator cycles_session \
                   cycles_device cycles_kernel \
                   bf_intern_guardedalloc bf_intern_sky cycles_shim; do
            cmake --build build_ios --config Release --target "$t" -- -quiet -jobs 3 \
              > "build_$t.log" 2>&1 \
              || { echo "FAILED: $t"; grep -E "error:|fatal error:" "build_$t.log" | head -30; exit 1; }
            echo "built $t"
          done

      # WHICH dependency archives, decided by the linker instead of by me.
      # `-Wl,-t` traces every file the link actually loaded, archive members
      # included; the archives named there are exactly the ones the app will
      # need and nothing else. If the trace comes back empty the link did not
      # happen and the job fails here rather than shipping an IPA that cannot
      # resolve a symbol.
      - name: Harvest the distribution
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p cycles-dist/lib cycles-dist/deps cycles-dist/dylib
          find build_ios \( -name "libcycles*.a" -o -name "libbf_intern_guardedalloc.a" \
                          -o -name "libbf_intern_sky.a" \) -exec cp {} cycles-dist/lib/ \;
          test -f cycles-dist/lib/libcycles_shim.a
          # .dylib as well as .a. Four of Cycles' dependencies — OpenImageIO,
          # OpenColorIO, Imath and TBB — ship only as dynamic libraries in
          # this package, which is what runs 6 through 9 kept reading as
          # "missing" (M309, M310).
          # Archives three times, dylibs once: Apple's linker walks each
          # archive once in the order given and never revisits one that came
          # before its user, while a dylib exposes its whole symbol table at
          # once. openpgl is excluded because it vendors a copy of Embree's
          # allocator and defines embree::alignedMalloc a second time —
          # WITH_CYCLES_PATH_GUIDING=OFF above means nothing references it
          # anyway, and path guiding does nothing for a clay render of a
          # machined part.
          ARCH=$(find blender/lib/ios_arm64 -name '*.a' \
                   -not -path '*/python/*' -not -path '*/openpgl/*' | tr '\n' ' ')
          DYLIB=$(find blender/lib/ios_arm64 -name '*.dylib' -not -path '*/python/*' -not -name 'libtbbmalloc_proxy.dylib' | tr '\n' ' ')
          DEPS="$ARCH $ARCH $ARCH $DYLIB"
          # Three times: Apple's linker walks archives once, in the order
          # given, and `find` emits them in directory order, so a library
          # listed before its user is never revisited. There is no
          # --start-group here.
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -I backend/cycles/shim backend/cycles/shim/shim_probe.c \
            -Wl,-force_load,cycles-dist/lib/libcycles_shim.a \
            cycles-dist/lib/*.a $DEPS -lc++ -lz \
            -framework Metal -framework Foundation -framework CoreGraphics -framework IOKit \
            -framework AudioToolbox -framework AVFoundation -framework CoreAudio \
            -framework CoreMedia -framework VideoToolbox \
            -Wl,-dead_strip_dylibs -Wl,-t -o shim_probe.bin > trace.log 2>&1 \
            || { echo "the shim does not link:"; \
                 grep -oE '"[^"]+", referenced from' trace.log | sed -E 's/^"//; s/", referenced from$//' | cut -c1-70 | sort -u | head -30; \
                 tail -5 trace.log; exit 1; }
          echo "== linked; trace is $(wc -l < trace.log) lines"
          # `|| true` on both: grep exits 1 when it matches nothing, and this
          # step runs under `bash -e`. Run 612 died exactly there, silently,
          # after a link that had succeeded — seven seconds and not one line
          # of output. A pipeline that can fail without saying so is worse
          # than one that fails.
          # NOT anchored on $PWD. ld's trace echoes the paths it was GIVEN,
          # and they are given relative — run 614 matched nothing and said so,
          # printing a trace full of `blender/lib/ios_arm64/...`.
          grep -oE "blender/lib/ios_arm64/[^ (]*\.a" trace.log | sort -u > used.txt || true
          echo "== the link pulled from $(wc -l < used.txt) archives"
          if [ ! -s used.txt ]; then
            echo "no archive paths in the trace; here is what it looks like:"
            { grep -n "ios_arm64" trace.log || true; } | head -5 || true
            head -5 trace.log || true
            exit 1
          fi
          xargs -I{} cp {} cycles-dist/deps/ < used.txt
          echo "== copied $(ls cycles-dist/deps | wc -l) archives"
          # The dylibs are read back out of the LINKED BINARY rather than out
          # of the trace: -dead_strip_dylibs above has already discarded the
          # ones nothing referenced, and what survives in the load commands is
          # exactly what the app must carry. Their own dependencies are
          # followed to a fixed point.
          bash ci/harvest_cycles_dylibs.sh shim_probe.bin blender/lib/ios_arm64 cycles-dist/dylib
          echo "== dylibs harvested"
          # M344 — AND OpenImageIO HAS TO BE AMONG THEM.
          #
          # It was always linked, and until M344 nothing called it: the shim
          # built its scenes out of numbers. It loads the HDRI and every PBR
          # texture now, and it is a DYLIB rather than an archive — one of the
          # four in this package that are — so `-dead_strip_dylibs` is entitled
          # to drop it if the link decides nothing reached it. If that ever
          # happens the app still builds, still launches and still renders, and
          # every textured surface silently comes out flat. That is a failure
          # nobody could attribute from a device, so it is named here.
          ls cycles-dist/dylib | grep -qi 'OpenImageIO' \
            || { echo "CYCLES OIIO CHECK: FAIL — no OpenImageIO dylib was harvested."; \
                 echo "  Cycles loads the HDRI and every texture through it (scene/image_oiio.cpp)."; \
                 echo "  Without it every textured surface renders flat, silently."; \
                 echo "  Harvested:"; ls cycles-dist/dylib; exit 1; }
          echo "== OpenImageIO is in the distribution"
          # The kernel tree. Everything, because the Metal include walker
          # follows #include "..." across kernel/, util/ and further, and a
          # header it cannot find is left in the source verbatim and then
          # fails inside the shader compiler with an error naming nothing.
          mkdir -p cycles-dist/source
          rsync -a --exclude '.git' --exclude 'shim' blender/intern/cycles/ cycles-dist/source/
          echo "== kernel source copied"
          test -f cycles-dist/source/kernel/device/metal/kernel.metal
          # M344 — the render assets are deliberately NOT harvested here.
          #
          # They are not built, they are not expensive, and they do not belong
          # in a cache keyed on the shim: an artifact that carried them would
          # make every asset change a cache miss and so a full Blender + Cycles
          # rebuild. The packaging job has the repository checked out and copies
          # them straight from backend/cycles/assets — one hop instead of three,
          # and always the working tree's version rather than whatever a cache
          # entry happened to be built with.
          echo "--- distribution ---"
          du -sh cycles-dist/lib cycles-dist/deps cycles-dist/dylib cycles-dist/source
          lipo -info cycles-dist/lib/libcycles_shim.a
          nm -gU cycles-dist/lib/libcycles_shim.a | grep -cE "_cy_" || true

      - name: Report what is being shipped
        run: |
          echo "cache hit: ${{ steps.dist.outputs.cache-hit }}"
          ls cycles-dist/lib cycles-dist/deps | head -40
          du -sh cycles-dist

      - name: Upload the Cycles distribution
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: cycles-ios-dist
          path: cycles-dist
          if-no-files-found: error

  m5-flutter-ipa:
    name: M5 Flutter iOS build + unsigned IPA
    # Gated on the fast Dart job. Without this the iOS build kept grinding for
    # the better part of an hour after dart-checks had already gone red three
    # minutes in, producing an IPA that could not possibly be worth installing
    # and burning a macOS runner for nothing. build-core-ios and the simulator
    # smoke test stay independent — they are native and a Dart error says
    # nothing about them.
    needs: [dart-checks, cycles-ios]
    # macos-26 (Tahoe, Xcode 26.x) — NOT cosmetic and NOT optional:
    #
    #  1. The native context menu is a real UIMenu, so its APPEARANCE comes
    #     from the SDK the app is linked against, not from our code. Built
    #     against the iOS 17 SDK on macos-14 it renders in pre-26 compatibility
    #     styling; rebuilt against the iOS 26 SDK the system components adopt
    #     Liquid Glass automatically, with no code change.
    #  2. macos-14 images entered deprecation on 2026-07-06 and are fully
    #     unsupported from 2026-11-02. This migration is forced regardless.
    #
    # Both labels are arm64, so no host architecture changes. Deployment target
    # stays 14.0 (Xcode 26 accepts >= 12.0 despite documenting 15; Qt-iOS needs
    # >= 14.0). Xcode 27 will raise that floor to 15.0 — bump it then.
    #
    # RISK / REVERT: the unknown is Qt 6.7 + the Xcode 26 toolchain building
    # qcad-core. If this job fails at "Configure/Build (iOS target)" while the
    # Flutter steps are fine, revert THIS LINE to macos-14 — the feature commit
    # is independent and needs no runner change. If Qt is the only casualty,
    # the clean fix is to split: build core+slvs on macos-15, upload them as
    # artifacts, and link the IPA here (old .a files link fine with a newer ld).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # M307 — the path tracer, built in parallel by the cycles-ios job.
      # Downloaded before anything else so a missing artifact fails in ten
      # seconds rather than fifty minutes into an Xcode build.
      - name: Download the Cycles distribution
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cycles-ios-dist
          path: cycles-dist
      # Both halves or neither. An IPA with the archives linked but no kernel
      # tree in the bundle is the exact build M306 exists to keep from
      # shipping: it launches, it looks fine, and it fails inside a shader
      # compiler. Half a renderer is worse than none, so the answer here is
      # one flag that the link and the bundle steps both read.
      - name: Is there a renderer to ship?
        id: cycles
        run: |
          if [ -f cycles-dist/lib/libcycles_shim.a ] \
             && [ -f cycles-dist/source/kernel/device/metal/kernel.metal ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
            echo "CYCLES: $(ls cycles-dist/lib | wc -l) archives, $(ls cycles-dist/deps 2>/dev/null | wc -l) deps, $(du -sh cycles-dist | cut -f1)"
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "CYCLES: not in this build — rendered mode stays RealityKit"
          fi

      # M119 fix — ccache must exist in THIS job. The install step went into
      # build-core-ios, but the C++ builds carrying the launcher flags live
      # here, so the compiler line became literally `ccache <clang>` with no
      # ccache on PATH: "make[2]: ccache: No such file or directory".
      - name: Install ccache
        run: brew list ccache >/dev/null 2>&1 || brew install ccache

      - name: Cache ccache tree
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ipa-${{ hashFiles('backend/**/*.cpp', 'backend/**/*.h', 'backend/**/CMakeLists.txt') }}
          restore-keys: |
            ccache-ipa-


      # Print the toolchain FIRST: this is the single line that tells us
      # whether the IPA can carry the iOS 26 appearance at all, and it makes a
      # runner-image change obvious at the top of the log instead of halfway
      # down a linker error.
      - name: Toolchain / SDK report
        run: |
          set -o pipefail
          sw_vers
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          MAJOR="$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)"
          if [ "${MAJOR:-0}" -ge 26 ]; then
            echo "LIQUID GLASS CHECK: PASS (building against iOS SDK $MAJOR)"
          else
            echo "LIQUID GLASS CHECK: WARN (iOS SDK $MAJOR < 26 — the context"
            echo "menu will still be a real UIMenu, but in legacy styling)"
          fi

      - name: Install Qt6 (host, for tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          target: 'desktop'
          dir: '${{ github.workspace }}/qt-host'
          cache: true

      - name: Capture host Qt path
        id: qt_host
        run: echo "path=${QT_ROOT_DIR}" >> "$GITHUB_OUTPUT"

      - name: Install Qt6 (iOS)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          target: 'ios'
          dir: '${{ github.workspace }}/qt-ios'
          cache: true

      - name: Capture iOS Qt path
        id: qt_ios
        run: echo "path=${QT_ROOT_DIR}" >> "$GITHUB_OUTPUT"

      - name: Install Ninja
        run: brew install ninja

      - name: Configure + build core & C-API (iOS device, arm64)
        working-directory: backend/qcad-core
        run: |
          set -o pipefail
          {
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.qt_ios.outputs.path }}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="${{ steps.qt_host.outputs.path }}" \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_QT6=ON \
            -DQCAD_CAPI_SMOKE=ON
          # The smoke exe is built for the DEVICE here purely to make CMake
          # emit the authoritative link line (link.txt) incl. the finalizer-
          # GENERATED Qml type-registration objects. Those exist nowhere in
          # the Qt package (undefined QQml*Foreign, runs 29143874907/...136545/
          # ...547027); only the consumer build generates them.
          cmake --build build -j -- -k 0
          libtool -static -o release/libprototype.a \
            release/libqcadcapi.a \
            release/libqcadcore.a \
            release/libqcadentity.a \
            release/libqcadoperations.a \
            plugins/libqcaddxf.a \
            release/libdxflib.a
          lipo -info release/libprototype.a
          } 2>&1 | tee ../../ci-m5-core.log

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold iOS project (flutter create) + pub get
        working-directory: frontend
        run: |
          set -o pipefail
          {
          flutter --version
          flutter create --platforms=ios --org com.prototype --project-name prototype .
          # M189 — the app icon. `flutter create` has just written Flutter's
          # default blue icon into the scaffolded Runner; replace the whole
          # appiconset with ours (branding/, outside the generated tree because
          # the generated tree does not survive a build). Fail loudly: a silent
          # miss here ships the placeholder icon, which is exactly the kind of
          # thing a green checkmark hides.
          test -f branding/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          rm -rf ios/Runner/Assets.xcassets/AppIcon.appiconset
          cp -R branding/AppIcon.appiconset ios/Runner/Assets.xcassets/
          ls ios/Runner/Assets.xcassets/AppIcon.appiconset | wc -l
          # Expose the app's Documents dir (incl. logs/prototype_log.txt)
          # in the iPad Files app for on-device crash debugging.
          /usr/libexec/PlistBuddy -c 'Add :UIFileSharingEnabled bool true' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :LSSupportsOpeningDocumentsInPlace bool true' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' ios/Runner/Info.plist
          # M348 — the live icon preview talks plain HTTP to a PC on the same
          # Wi-Fi. Two keys, and BOTH are needed: ATS blocks cleartext without
          # NSAllowsLocalNetworking, and iOS 14+ refuses to route to a local
          # address at all until the user has answered the Local Network
          # prompt, which needs a usage string or the prompt never appears.
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity dict' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :NSLocalNetworkUsageDescription string Shows icon renders from a computer on this network, for previewing artwork.' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' ios/Runner/Info.plist
          # M147 — fullscreen: no status bar, from the launch image onward.
          # UIViewControllerBasedStatusBarAppearance must be false, or UIKit
          # asks FlutterViewController instead and UIStatusBarHidden is ignored
          # for the frames before Dart has run.
          /usr/libexec/PlistBuddy -c 'Add :UIStatusBarHidden bool true' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :UIViewControllerBasedStatusBarAppearance bool false' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :UIStatusBarHidden' ios/Runner/Info.plist
          # M177 — a part is one file (.ptp) and a sketch is one file (.pts).
          # Declaring the types is what makes iOS show them in Open, give them
          # our icon in Files, and let one be AirDropped to the app. Without
          # the declaration UTType(filenameExtension:) only yields a dynamic
          # identifier, which the open-in-place picker will not match on.
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :UTExportedTypeDeclarations array' $P
          i=0
          for spec in "part:ptp:Prototype Part" "sketch:pts:Prototype Sketch"; do
            kind=${spec%%:*}; rest=${spec#*:}; ext=${rest%%:*}; desc=${rest#*:}
            /usr/libexec/PlistBuddy -c "Add :UTExportedTypeDeclarations:$i dict" $P
            /usr/libexec/PlistBuddy -c "Add :UTExportedTypeDeclarations:$i:UTTypeIdentifier string com.prototype.$kind" $P
            /usr/libexec/PlistBuddy -c "Add :UTExportedTypeDeclarations:$i:UTTypeDescription string $desc" $P
            /usr/libexec/PlistBuddy -c "Add :UTExportedTypeDeclarations:$i:UTTypeConformsTo array" $P
            /usr/libexec/PlistBuddy -c "Add :UTExportedTypeDeclarations:$i:UTTypeConformsTo:0 string public.data" $P
            /usr/libexec/PlistBuddy -c "Add :UTExportedTypeDeclarations:$i:UTTypeTagSpecification dict" $P
            /usr/libexec/PlistBuddy -c "Add :UTExportedTypeDeclarations:$i:UTTypeTagSpecification:public.filename-extension array" $P
            /usr/libexec/PlistBuddy -c "Add :UTExportedTypeDeclarations:$i:UTTypeTagSpecification:public.filename-extension:0 string $ext" $P
            i=$((i+1))
          done
          # M232 — the mesh formats Open accepts. IMPORTED, not exported:
          # STL, OBJ and 3MF are not ours, we only read them. The declaration
          # matters for the same reason the two above do, and the failure mode
          # is worse than "not matched": an undeclared extension resolves to a
          # DYNAMIC identifier (dyn.ah62d4...), and handing those to
          # UIDocumentPickerViewController took the app down on the tap, before
          # any Dart ran. DocumentOpen.swift now refuses dynamic types as a
          # safety net; this is what stops them being produced at all, and it
          # also gets the files a proper name and icon in Files.
          #
          # STL and OBJ have well-known public identifiers, so these
          # declarations defer to the system's if it has them. 3MF has none, so
          # the identifier here is the one the 3MF Consortium uses.
          /usr/libexec/PlistBuddy -c 'Add :UTImportedTypeDeclarations array' $P
          j=0
          for spec in \
            "public.standard-tesselated-geometry-format:stl:STL Mesh:public.data" \
            "public.geometry-definition-format:obj:Wavefront OBJ:public.data" \
            "org.3mf.3dmanufacturing:3mf:3D Manufacturing Format:public.zip-archive"; do
            uti=${spec%%:*}; r1=${spec#*:}; ext=${r1%%:*}
            r2=${r1#*:}; desc=${r2%%:*}; conf=${r2#*:}
            /usr/libexec/PlistBuddy -c "Add :UTImportedTypeDeclarations:$j dict" $P
            /usr/libexec/PlistBuddy -c "Add :UTImportedTypeDeclarations:$j:UTTypeIdentifier string $uti" $P
            /usr/libexec/PlistBuddy -c "Add :UTImportedTypeDeclarations:$j:UTTypeDescription string $desc" $P
            /usr/libexec/PlistBuddy -c "Add :UTImportedTypeDeclarations:$j:UTTypeConformsTo array" $P
            /usr/libexec/PlistBuddy -c "Add :UTImportedTypeDeclarations:$j:UTTypeConformsTo:0 string $conf" $P
            /usr/libexec/PlistBuddy -c "Add :UTImportedTypeDeclarations:$j:UTTypeTagSpecification dict" $P
            /usr/libexec/PlistBuddy -c "Add :UTImportedTypeDeclarations:$j:UTTypeTagSpecification:public.filename-extension array" $P
            /usr/libexec/PlistBuddy -c "Add :UTImportedTypeDeclarations:$j:UTTypeTagSpecification:public.filename-extension:0 string $ext" $P
            j=$((j+1))
          done
          /usr/libexec/PlistBuddy -c 'Print :UTImportedTypeDeclarations' $P
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes array' $P
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0 dict' $P
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0:CFBundleTypeName string Prototype Document' $P
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0:CFBundleTypeRole string Editor' $P
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0:LSHandlerRank string Owner' $P
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0:LSItemContentTypes array' $P
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0:LSItemContentTypes:0 string com.prototype.part' $P
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0:LSItemContentTypes:1 string com.prototype.sketch' $P
          # A second entry rather than more content types on the first: these
          # are Viewer-rank imports, not documents this app owns.
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:1 dict' $P
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:1:CFBundleTypeName string Mesh' $P
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:1:CFBundleTypeRole string Viewer' $P
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:1:LSHandlerRank string Alternate' $P
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:1:LSItemContentTypes array' $P
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:1:LSItemContentTypes:0 string public.standard-tesselated-geometry-format' $P
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:1:LSItemContentTypes:1 string public.geometry-definition-format' $P
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:1:LSItemContentTypes:2 string org.3mf.3dmanufacturing' $P
          /usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations' $P
          # flutter create generates a template test referencing MyApp,
          # which doesn't exist in our app -> would fail flutter analyze
          rm -f test/widget_test.dart
          flutter pub get
          # Qt-iOS prebuilt objects require minos 14.0 -> raise everywhere.
          # (Target-level pbxproj settings override xcconfig, so patch pbxproj.)
          #
          # M307 raised the floor from 14.0 to 16.0, and it is a real change:
          # the Cycles objects are built by Blender's iOS branch at 16.0, and
          # linking a 16.0 object into a 14.0 app is not a warning to live
          # with — it is code that may call an API the deployment target says
          # is absent. Forcing Cycles down to 14 instead was the alternative,
          # and it means fighting the Metal backend, which is written against
          # iOS 16 features on purpose. iOS 16 shipped in 2022; every iPad
          # that could usefully path-trace a model runs it, and the ones that
          # do not could not have run this anyway.
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 16.0/g' ios/Runner.xcodeproj/project.pbxproj
          # Generate the CocoaPods setup without compiling, then pin platform.
          # --build-name/--build-number: siehe den Release-Schritt unten. Die
          # beiden `flutter build ios`-Aufrufe MUESSEN die gleiche Version
          # tragen, sonst schreibt der zweite die Generated.xcconfig neu und
          # der Pod-Schritt war umsonst.
          flutter build ios --config-only --release --no-codesign \
            --build-name=0.1.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=GIT_SHA=${GITHUB_SHA::7} \
            --dart-define=BUG_RELAY_URL=${{ vars.BUG_RELAY_URL }} \
            --dart-define=BUG_RELAY_SECRET=${{ secrets.BUG_RELAY_SECRET }}
          if [ -f ios/Podfile ]; then
            # 16.0 to match the app target (M307). A Podfile platform below
            # the app's is the one place the two can disagree without an
            # error, and the pods then build objects the Runner refuses.
            sed -i '' "s/^# platform :ios.*/platform :ios, '16.0'/" ios/Podfile
            sed -i '' "s/^platform :ios.*/platform :ios, '16.0'/" ios/Podfile
          fi
          } 2>&1 | tee ../ci-m5-scaffold.log

      - name: Dart unit tests (solver + dimension system)
        working-directory: frontend
        run: |
          set -o pipefail
          # pipefail makes flutter test's exit code authoritative. Do NOT grep
          # for a success phrase: the wording changes between Flutter versions
          # ("All tests passed!" vs "🎉 18 tests passed.").
          flutter test 2>&1 | tee ../ci-m5-dart-tests.log

      - name: Build libslvs static (iOS device, arm64)
        working-directory: backend/slvs
        run: |
          set -o pipefail
          cmake -S . -B build-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ios -j
          test -f build-ios/libslvs.a || { echo "MISSING build-ios/libslvs.a"; exit 1; }
          lipo -info build-ios/libslvs.a

      # --- OCCT (3D B-Rep + STEP kernel, backend/occt) ---------------------
      # The heavy OCCT build is CACHED and shared with occt-build.yml via an
      # identical key: normally that isolated workflow (or a previous run of
      # this job) has already populated it and this restores in seconds. On a
      # cold cache this job self-heals by building OCCT itself (~40-60 min,
      # once). Keep key + flags in sync with .github/workflows/occt-build.yml
      # and backend/occt/VENDOR.md; bump -r1 when the flags change.
      - name: Cache OpenCASCADE iOS install tree
        id: occt-cache
        uses: actions/cache@v4
        with:
          path: backend/occt/install-ios
          key: occt-ios-arm64-V7_9_3-r1

      - name: Build OpenCASCADE static (iOS device, arm64, cache miss only)
        if: steps.occt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 150
        working-directory: backend/occt
        run: |
          set -o pipefail
          git -C "$GITHUB_WORKSPACE" submodule update --init --depth 1 \
            -- backend/occt/upstream \
            || git -C "$GITHUB_WORKSPACE" submodule update --init \
                 -- backend/occt/upstream
          git -C upstream log --oneline -1
          cmake -S upstream -B build-occt-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DINSTALL_DIR="$GITHUB_WORKSPACE/backend/occt/install-ios" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_LIBRARY_TYPE=Static \
            -DBUILD_MODULE_FoundationClasses=ON \
            -DBUILD_MODULE_ModelingData=ON \
            -DBUILD_MODULE_ModelingAlgorithms=ON \
            -DBUILD_MODULE_DataExchange=ON \
            -DBUILD_MODULE_ApplicationFramework=OFF \
            -DBUILD_MODULE_Visualization=OFF \
            -DBUILD_MODULE_Draw=OFF \
            -DBUILD_MODULE_DETools=OFF \
            -DBUILD_DOC_Overview=OFF \
            -DUSE_FREETYPE=OFF -DUSE_TK=OFF -DUSE_XLIB=OFF \
            -DUSE_FREEIMAGE=OFF -DUSE_OPENVR=OFF -DUSE_FFMPEG=OFF \
            -DUSE_RAPIDJSON=OFF -DUSE_DRACO=OFF -DUSE_TBB=OFF -DUSE_VTK=OFF \
            2>&1 | tail -25
          cmake --build build-occt-ios -j 2>&1 | tail -25
          cmake --install build-occt-ios > /dev/null

      - name: Build OCCT C shim static (iOS device, arm64)
        working-directory: backend/occt
        run: |
          set -o pipefail
          ls "$GITHUB_WORKSPACE/backend/occt/install-ios/lib/cmake/opencascade/"
          # MODE_PACKAGE=BOTH: iOS cross-compiles re-root find_package into
          # the SDK sysroot by default (Darwin.cmake ONLY) — without this the
          # prefix path is invisible. Lesson from run 29807468644/...679.
          cmake -S . -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/backend/occt/install-ios"
          cmake --build build-ios -j
          test -f build-ios/libocct_capi.a || { echo "MISSING build-ios/libocct_capi.a"; exit 1; }
          lipo -info build-ios/libocct_capi.a

      - name: Inject FFI link flags (xcconfig)
        working-directory: frontend
        run: |
          set -o pipefail
          {
          QTIOS="${{ steps.qt_ios.outputs.path }}"
          CORE="$GITHUB_WORKSPACE/backend/qcad-core/release"
          BUILD="$GITHUB_WORKSPACE/backend/qcad-core/build"
          SLVS="$GITHUB_WORKSPACE/backend/slvs/build-ios"
          OCCT="$GITHUB_WORKSPACE/backend/occt"
          # Every OCCT toolkit archive as an explicit path: ld64 extracts
          # only referenced members, so unused toolkits cost nothing, and
          # Apple's linker needs no ordering/groups for static archives.
          OCCTLIBS="$(ls "$OCCT/install-ios/lib"/libTK*.a | tr '\n' ' ')"
          echo "OCCT archives on the link line: $(echo "$OCCTLIBS" | wc -w)"
          # Ninja has no link.txt; ask ninja for the smoke's exact link
          # command instead (executed with cwd = build root).
          LINKCMD="$(mktemp)"
          ninja -C "$BUILD" -t commands | grep -E -- "-o [^ ]*qcad_capi_smoke( |$)" | tail -1 > "$LINKCMD"
          [ -s "$LINKCMD" ] || { echo "smoke link command not found via ninja -t commands"; exit 1; }
          cat "$LINKCMD"
          # Translate the authoritative link line into linker inputs for
          # Xcode (keeps .o/.a incl. the GENERATED Qml registration objects,
          # -l*, -framework pairs, -Wl,*; drops driver flags, -o, smoke.c.o).
          QTLIBS="$(python3 "$GITHUB_WORKSPACE/ci/parse_link_txt.py" "$LINKCMD" "$BUILD")"
          echo "parsed link inputs ($(echo "$QTLIBS" | wc -w) tokens):"
          echo "$QTLIBS" | tr ' ' '\n' | sed '/^$/d'
          # M307 — Cycles. force_load the SHIM (nothing in the app references
          # it at link time — Dart finds it with dlsym, so ld would drop the
          # whole archive as unreachable), then the nine Cycles archives and
          # the dependency set the cycles-ios job proved is sufficient. The
          # deps are repeated: Apple's linker walks static archives once, in
          # the order given, and never revisits one that came before its user.
          CYCLES=""
          CYCEXP=""
          if [ "${{ steps.cycles.outputs.have }}" = "1" ]; then
            CYC="$GITHUB_WORKSPACE/cycles-dist"
            CYCLIBS="$(ls "$CYC/lib"/*.a | grep -v libcycles_shim | tr '\n' ' ')"
            CYCDEPS="$(ls "$CYC/deps"/*.a 2>/dev/null | tr '\n' ' ')"
            # The dylibs are linked from where they sit now; ci/embed_cycles_dylibs.sh
            # copies them into the bundle and rewrites the load commands to
            # @rpath afterwards, because their install names are the build
            # machine's absolute paths and an iPad has no such directory.
            CYCDYL="$(ls "$CYC/dylib"/*.dylib 2>/dev/null | tr '\n' ' ')"
            echo "Cycles on the link line: $(echo "$CYCLIBS" | wc -w) archives, $(echo "$CYCDEPS" | wc -w) deps"
            CYCLES="-force_load $CYC/lib/libcycles_shim.a $CYCLIBS $CYCDEPS $CYCDEPS $CYCDYL -framework AudioToolbox -framework AVFoundation -framework CoreAudio -framework CoreMedia -framework VideoToolbox"
            CYCEXP='_cy_*\n'
          fi
          # _cy_* joins the export list for the same reason the other three
          # families are on it: DynamicLibrary.process() resolves through the
          # binary's export trie, and a symbol not listed here is stripped out
          # of it even though the code is linked in. That failure looks exactly
          # like "Cycles was never built".
          printf "_qcad_*\n_slvs_*\n_occt_*\n${CYCEXP}" > ios/Flutter/qcad_symbols.exp
          cat > ios/Flutter/ffi.xcconfig <<XC
          OTHER_LDFLAGS = \$(inherited) -force_load $CORE/libprototype.a -force_load $SLVS/libslvs.a -force_load $OCCT/build-ios/libocct_capi.a $OCCTLIBS $CYCLES $QTLIBS -framework UIKit -framework Foundation -framework CoreFoundation -framework CoreGraphics -framework CoreText -framework CoreServices -framework Security -framework SystemConfiguration -framework CFNetwork -framework Metal -framework MetalKit -framework QuartzCore -framework ImageIO -framework UniformTypeIdentifiers -framework IOSurface -framework OpenGLES -framework IOKit -framework RealityKit -framework ARKit -lz -lc++ -Wl,-exported_symbols_list,\$(SRCROOT)/Flutter/qcad_symbols.exp
          IPHONEOS_DEPLOYMENT_TARGET = 16.0
          XC
          # strip the heredoc's leading indentation xcconfig can't handle
          sed -i '' 's/^          //' ios/Flutter/ffi.xcconfig
          for f in ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig ios/Flutter/Profile.xcconfig; do
            [ -f "$f" ] && printf '\n#include "ffi.xcconfig"\n' >> "$f" && echo "patched $f"
          done
          cat ios/Flutter/ffi.xcconfig
          } 2>&1 | tee ../ci-m5-xcconfig.log

      - name: Analyze Dart (surface compile errors clearly)
        working-directory: frontend
        run: |
          set -o pipefail
          # infos/warnings must not fail the build — only real errors
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../ci-m5-analyze.log

      - name: Build iOS app (release, unsigned)
        timeout-minutes: 45
        working-directory: frontend
        run: |
          # pipefail MUSS ausserhalb des { }|tee stehen (M3-Lektion).
          set -o pipefail
          # Die Build-Nummer IST die Run-Nummer (Build 361 heisst am Geraet
          # 0.1.361). Ohne das traegt jede IPA `0.1.0 (1)` aus der pubspec und
          # man sieht am iPad nicht, welcher Build laeuft — und SideStore haelt
          # zwei verschiedene Builds fuer dieselbe Version.
          flutter build ios --release --no-codesign \
            --build-name=0.1.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=GIT_SHA=${GITHUB_SHA::7} \
            --dart-define=BUG_RELAY_URL=${{ vars.BUG_RELAY_URL }} \
            --dart-define=BUG_RELAY_SECRET=${{ secrets.BUG_RELAY_SECRET }} \
            2>&1 | tee ../ci-m5-build.log

      - name: Verify core is linked (M5 LINK CHECK) & package IPA
        working-directory: frontend
        run: |
          set -o pipefail
          {
          APP="build/ios/iphoneos/Runner.app"
          [ -d "$APP" ] || { echo "M5 LINK CHECK: FAIL (Runner.app missing)"; exit 1; }
          # grep -c statt -q: -q beendet grep beim ersten Treffer -> SIGPIPE an
          # strings -> mit pipefail schlaegt die Pipeline trotz Treffer fehl
          # (Run 29145123176: "strings: failed to flush output").
          # qt_main_wrapper in the binary = qios plugin linked = the
          # double-UIApplicationMain launch crash (Runner-…-141719.ips).
          QTMAIN="$(nm -gU "$APP/Runner" 2>/dev/null | grep -c qt_main_wrapper || true)"
          QTMAIN2="$(strings "$APP/Runner" | grep -c qt_main_wrapper || true)"
          if [ "${QTMAIN:-0}" -gt 0 ] || [ "${QTMAIN2:-0}" -gt 0 ]; then
            echo "M6 QIOS CHECK: FAIL (qt_main_wrapper present — qios plugin linked, app will crash at launch)"; exit 1
          fi
          echo "M6 QIOS CHECK: PASS (no qt_main_wrapper in Runner)"
          HITS="$(strings "$APP/Runner" | grep -c "Prototype C-API" || true)"
          if [ "${HITS:-0}" -gt 0 ]; then
            echo "M5 LINK CHECK: PASS (C-API version string present in Runner binary)"
          else
            echo "M5 LINK CHECK: FAIL (C-API not linked into Runner)"; exit 1
          fi
          SHITS="$(strings "$APP/Runner" | grep -c "Prototype SLVS shim" || true)"
          if [ "${SHITS:-0}" -gt 0 ]; then
            echo "SLVS LINK CHECK: PASS (libslvs shim marker present in Runner binary)"
          else
            echo "SLVS LINK CHECK: FAIL (libslvs/shim not linked into Runner)"; exit 1
          fi
          OHITS="$(strings "$APP/Runner" | grep -c "Prototype OCCT shim" || true)"
          if [ "${OHITS:-0}" -gt 0 ]; then
            echo "OCCT MARKER CHECK: PASS (OCCT shim version string present in Runner binary)"
          else
            echo "OCCT LINK CHECK: FAIL (OCCT shim not linked into Runner)"; exit 1
          fi
          # Authoritative export check: all 44 _occt_* C symbols (shim v13 +
          # M110 occt_split_solids:
          # v5 surface +occt_revolve_profile +occt_shape_edge_count
          # +occt_shape_edge_info +occt_mesh_edge_ids +occt_fillet_edges
          # +occt_chamfer_edges +occt_ray_hits) must sit in the export trie
          # so DynamicLibrary.process() can dlsym them — the
          # exported_symbols_list keeps them through strip/dead_strip
          # (same mechanism as the 14 _qcad_* symbols).
          NOCCT="$(nm -gU "$APP/Runner" 2>/dev/null | grep -c ' _occt_' || true)"
          if [ "${NOCCT:-0}" -ge 44 ]; then
            echo "OCCT LINK CHECK: PASS ($NOCCT _occt_* symbols exported in Runner)"
          else
            echo "OCCT LINK CHECK: FAIL (only ${NOCCT:-0} _occt_* symbols exported, want >= 44)"; exit 1
          fi
          # M60: the RealityKit viewport plugin must be linked (the GPU 3D
          # renderer that replaces the CPU painter on device). The framework
          # shows in the Runner's load commands whether linked normal or weak.
          RKIT="$(otool -L "$APP/Runner" 2>/dev/null | grep -c RealityKit || true)"
          if [ "${RKIT:-0}" -gt 0 ]; then
            echo "REALITYKIT LINK CHECK: PASS (RealityKit framework linked into Runner)"
          else
            echo "REALITYKIT LINK CHECK: FAIL (RealityKit not linked — 3D viewport cannot render)"; exit 1
          fi
          # M82: the OFF-SCREEN still renderer must be compiled in, otherwise the
          # gallery/context-menu preview silently falls back to the CPU painter
          # forever and the two engines drift apart again — with a GREEN build,
          # which is precisely the failure this repo refuses to accept.
          # The channel name is a Swift string LITERAL; on the Dart side it is
          # built by interpolation ('$_channelName/thumb') and never appears
          # whole, so a hit proves the Swift half is really in the bundle.
          #
          # WHERE TO LOOK — verified empirically on the IPA of run 30309544477,
          # do not "simplify" this to Runner alone: the in-repo plugin pods
          # declare no `static_framework`, so CocoaPods delivers them as DYNAMIC
          # frameworks and NONE of their Swift literals are in the Runner binary
          # ("prototype/reality_view": 0 hits in Runner, 2 in
          # Frameworks/reality_view.framework/reality_view). The first version of
          # this gate grepped Runner and failed a build whose feature was
          # perfectly fine. Both binaries are scanned so the check keeps working
          # if the pod is ever made static.
          RVFW="$APP/Frameworks/reality_view.framework/reality_view"
          THUMB="$( { strings -a "$APP/Runner"; [ -f "$RVFW" ] && strings -a "$RVFW"; } \
            | grep -c "prototype/reality_view/thumb" || true)"
          if [ "${THUMB:-0}" -gt 0 ]; then
            echo "THUMB CHANNEL CHECK: PASS (off-screen still renderer present in bundle)"
          else
            echo "THUMB CHANNEL CHECK: FAIL (thumb channel missing — previews would silently stay on the CPU painter)"; exit 1
          fi
          # M178: iPadOS floats its keyboard shortcuts bar across the bottom of
          # the screen whenever a field takes focus, ON TOP of the app's own tab
          # bar. KeyboardBar.swift empties the assistant item of the engine's
          # text input view — the only way to hide it — and finds that view by
          # NAME. The name is a Swift string literal and nothing else in this pod
          # mentions it, so a hit proves the suppressor really shipped. Dart
          # cannot test any of this; without the gate the bar comes back
          # silently, on the device only, with a green build.
          # Same two-binary scan as the thumb check, for the same reason.
          NMFW="$APP/Frameworks/native_menu.framework/native_menu"
          KBDBAR="$( { strings -a "$APP/Runner"; [ -f "$NMFW" ] && strings -a "$NMFW"; } \
            | grep -c "FlutterTextInputView" || true)"
          if [ "${KBDBAR:-0}" -gt 0 ]; then
            echo "KEYBOARD BAR CHECK: PASS (shortcuts-bar suppressor present in bundle)"
          else
            echo "KEYBOARD BAR CHECK: FAIL (suppressor missing — iPadOS would cover the tab bar)"; exit 1
          fi
          nm -gU "$APP/Runner" | grep _qcad_ | head -20 || echo "(symbol table stripped — export check via strings only)"
          # M307 — the kernel tree goes INTO the bundle, next to the binary.
          # Cycles' Metal backend compiles its kernels from source at runtime
          # (device_impl.mm: path_source_replace_includes(source,
          # path_get("source"))), so these files are a runtime dependency
          # exactly as much as the archives are. `cycles/source` because
          # path_get("source") joins "source" onto the resource root, and
          # cycles_boot.dart hands it Runner.app/cycles.
          if [ "${{ steps.cycles.outputs.have }}" = "1" ]; then
            mkdir -p "$APP/cycles"
            rsync -a "$GITHUB_WORKSPACE/cycles-dist/source/" "$APP/cycles/source/"
            test -f "$APP/cycles/source/kernel/device/metal/kernel.metal" \
              || { echo "CYCLES KERNEL CHECK: FAIL (kernel source not in the bundle)"; exit 1; }
            echo "CYCLES KERNEL CHECK: PASS ($(du -sh "$APP/cycles" | cut -f1) bundled)"
            # M344 — the render assets, beside the kernel tree under the same
            # resource root. Optional: this repository ships none of them and a
            # build without them renders the M332 rig and M337 flat surfaces,
            # which is the app that shipped. So no `test` and no failure — only
            # a line saying what went in, because "the HDRI is not in the
            # bundle" and "the HDRI is not in the repository" look identical
            # from the device and this is the only place that can tell them
            # apart.
            #
            # STRAIGHT FROM THE CHECKOUT, not from cycles-dist.
            #
            # Run 648 died on this line when the assets came through the
            # artifact, and the failure is worth keeping written down: the
            # empty case broke the check that exists to prove the empty case is
            # harmless. actions/upload-artifact DOES NOT UPLOAD EMPTY
            # DIRECTORIES, so an empty `cycles-dist/assets` was absent after the
            # download, `find` on a missing path exits 1, and under `set -o
            # pipefail` with `bash -e` that 1 killed the step after every check
            # above it had passed.
            #
            # Reading the checkout removes the whole class: this job runs
            # actions/checkout, so the directory always exists, and an asset
            # added to the repository reaches the bundle without invalidating
            # the Cycles cache. `mkdir -p` first and `|| true` on the count stay
            # anyway — they are the idiom this step already uses on QTMAIN,
            # HITS and KBDBAR, and the empty case must never be what fails.
            mkdir -p "$APP/cycles/assets"
            rsync -a --exclude 'README.md' --exclude 'SOURCES.md' \
                  --exclude '.gitattributes' \
                  "$GITHUB_WORKSPACE/backend/cycles/assets/" \
                  "$APP/cycles/assets/" || true
            NAST="$(find "$APP/cycles/assets" -type f | wc -l | tr -d ' ' || true)"
            echo "CYCLES ASSETS: ${NAST:-0} file(s) bundled$([ "${NAST:-0}" = 0 ] && echo ' (renders with the analytic rig — see backend/cycles/assets/README.md)')"
            find "$APP/cycles/assets" -type f -exec ls -lh {} \; 2>/dev/null | awk '{print "  " $5 "  " $NF}' || true
            # M344 — and is the environment map actually an ENVIRONMENT map?
            #
            # Every property the README asks for is checkable from the file
            # listing except the only one that decides how the render looks:
            # whether the light sources are brighter than the walls. A .hdr
            # that has been through an 8-bit conversion somewhere in its
            # history loads without complaint, renders without error, and
            # lights the model exactly as flatly as the uniform world M332
            # replaced — no highlight streak on a metal edge, because nothing
            # in the sphere is bright enough to draw one.
            #
            # That is invisible here and expensive to find on a device, so it
            # is measured. It PRINTS and never fails: an asset that lights
            # badly is a judgement call, and it belongs to whoever chose it.
            HDRI=""
            for c in studio.hdr studio.exr; do
              if [ -f "$APP/cycles/assets/hdri/$c" ]; then
                HDRI="$APP/cycles/assets/hdri/$c"; break
              fi
            done
            if command -v python3 >/dev/null 2>&1; then
              python3 "$GITHUB_WORKSPACE/ci/check_hdri.py" "${HDRI:-/none}" || true
            fi
            bash "$GITHUB_WORKSPACE/ci/embed_cycles_dylibs.sh" \
              "$GITHUB_WORKSPACE/cycles-dist/dylib" "$APP"
            # And the shim must be reachable BY NAME: Dart resolves it with
            # dlsym through the export trie, so a link that succeeded but left
            # the symbols unexported is indistinguishable from no Cycles.
            NCY="$(nm -gU "$APP/Runner" 2>/dev/null | grep -c ' _cy_' || true)"
            if [ "${NCY:-0}" -ge 5 ]; then
              echo "CYCLES LINK CHECK: PASS ($NCY _cy_* symbols exported in Runner)"
            else
              echo "CYCLES LINK CHECK: FAIL (only ${NCY:-0} _cy_* symbols exported, want >= 5)"; exit 1
            fi
          else
            echo "CYCLES: skipped (no distribution in this build)"
          fi
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry ../prototype-unsigned.ipa Payload
          ls -la ../prototype-unsigned.ipa
          } 2>&1 | tee ../ci-m5-verify.log

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: prototype-unsigned-ipa
          path: prototype-unsigned.ipa
          if-no-files-found: error

      # M190 — der Artefakt-Download braucht einen Login, SideStore hat keinen.
      # Erst ein Release macht die IPA unter einer festen, anonym erreichbaren
      # URL installierbar. Laeuft nach JEDEM gruenen M5 (auch workflow_dispatch
      # auf einem Feature-Branch — genau da entstehen die Builds, die aufs
      # Geraet sollen); uebersprungen nur bei Fork-PRs, wo der Token nur lesen
      # darf und `gh release create` zwangslaeufig 403 gaebe.
      - name: Publish release (iPad install target)
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/publish_release.sh prototype-unsigned.ipa

      # Der Anstoss fuers iPad. Ohne gesetzte Secrets ein No-op — der Build
      # bleibt gruen, das Release liegt trotzdem da und der Home-Screen-Shortcut
      # holt es. Siehe AUTOINSTALL.md.
      - name: Notify iPad
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          bash ci/notify_build.sh \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/build-${GITHUB_RUN_NUMBER}/ipadprocad-${GITHUB_RUN_NUMBER}.ipa" \
            "${GITHUB_RUN_NUMBER}" \
            "$(git log -1 --pretty=%s)"

      - name: Commit M5 debug logs
        if: always()
        run: |
          mkdir -p ci-logs-m5
          for l in ci-m5-core ci-m5-scaffold ci-m5-xcconfig ci-m5-analyze ci-m5-build ci-m5-verify; do
            cp "$l.log" ci-logs-m5/ 2>/dev/null || true
          done
          # The test log was the one omission that mattered: M5 runs the suite
          # on macOS where dart-checks runs it on ubuntu, so it is the only
          # place a platform-specific test failure is visible — and when one
          # happened there was nothing to read. Gzipped, because a green run
          # is megabytes of per-test chatter.
          gzip -9 -c ci-m5-dart-tests.log \
            > ci-logs-m5/ci-m5-dart-tests.log.gz 2>/dev/null || true
          git config user.email "ci@prototype.local"
          git config user.name "Prototype CI"
          git add -f ci-logs-m5
          git commit -m "CI(M5): Flutter-IPA build logs from run ${{ github.run_id }}" || exit 0
          git push origin HEAD:ci-debug-logs-m5 --force
