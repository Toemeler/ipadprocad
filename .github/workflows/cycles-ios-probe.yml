# M294 — CAN CYCLES BE BUILT FOR iOS FROM THIS REPO'S CI?
#
# The one question everything else waits on. Rendered mode cannot use Cycles
# until there are Cycles static libraries for iOS arm64 to link against, and
# nothing about the app, the C API or the material bridge can be written
# against a library that may not exist.
#
# This job answers it and nothing else. It does not touch the app, it is not in
# the IPA's dependency chain, and it cannot make the main build red — it is a
# separate workflow on manual dispatch and on its own file only.
#
# WHY BUILD INSIDE BLENDER'S TREE rather than standalone Cycles. `intern/cycles`
# is Apache-2.0 and is meant to be embeddable, but its CMake still expects
# Blender's top-level infrastructure to have found Embree, TBB, OpenImageIO and
# OpenColorIO first. Configuring it standalone for iOS is a project of its own.
# Blender's own tree, on the `ios` branch, is ALREADY PROVEN to configure and
# build for iOS device — Toemeler/blender-iOS-ipa does it on every run, with
# `WITH_CYCLES ON`, `WITH_CYCLES_EMBREE ON`. So: configure exactly the way that
# pipeline does, and build only the cycles targets out of it. Same compiler,
# same SDK, same dependency set, none of the standalone work.
#
# THIS RUN IS RECONNAISSANCE. The target names are a reasonable guess at the
# tree's layout and the first run may well not match them, so the job DUMPS THE
# TARGET LIST before building and uploads it either way. A red run that says
# "here are the 400 targets this tree actually has" is the useful outcome; the
# names get fixed in one edit and the second run builds.
#
# What it deliberately does NOT do:
#   * clone Git LFS. The datafiles (startup.blend and friends) are needed to RUN
#     Blender, not to compile a library, and they are the slowest part of that
#     pipeline's checkout.
#   * build all of Blender. That takes the better part of an hour and produces
#     an application nobody here wants.
name: Cycles iOS probe (M294)

on:
  workflow_dispatch:
    inputs:
      blender_ref:
        description: "Blender ios-branch commit to build (default: the ref the IPA pipeline pins)"
        required: false
        default: "d9b6fe34ddce527d93b97c0bf42ad92cebac4e4e"
      extra_cmake_args:
        description: "Extra CMake args"
        required: false
        default: ""
  push:
    # main only. Without the branch filter the designated development branch
    # ran the whole probe a second time on every push — two macOS runners for
    # one answer.
    branches: [main]
    paths:
      - ".github/workflows/cycles-ios-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Build the Cycles targets for iOS arm64
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain report
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
          python3 --version

      # No LFS: a library build never opens a .blend.
      # --depth 2, as the IPA pipeline does. Run 1 omitted it and spent 3.5
      # minutes pulling Blender's entire history to compile nine libraries.
      # The fallback covers the pinned ref having fallen out of the shallow
      # window, which it will the first time the branch head moves past it.
      - name: Clone Blender's ios branch (shallow, no LFS)
        run: |
          set -o pipefail
          REF="${{ github.event.inputs.blender_ref }}"
          REF="${REF:-d9b6fe34ddce527d93b97c0bf42ad92cebac4e4e}"
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 2 --branch ios \
            https://projects.blender.org/blender/blender.git blender 2>&1 | tail -5
          cd blender
          if ! git checkout "$REF" 2>/dev/null; then
            echo "pinned ref not in the shallow window; fetching it"
            git fetch --depth 1 origin "$REF"
            git checkout "$REF"
          fi
          git log --oneline -1

      - name: Cache the precompiled iOS dependency libraries
        uses: actions/cache@v4
        with:
          path: |
            blender/lib/ios_arm64
            blender/lib/macos_arm64
          key: blender-ios-libs-m294-v1

      # The same call Toemeler/blender-iOS-ipa makes. --no-blender skips the
      # source update (we pinned it above); --use-ios-libraries is what fetches
      # the prebuilt Embree / TBB / OpenImageIO / OpenColorIO for iOS arm64.
      - name: Fetch the iOS dependency libraries
        working-directory: blender
        run: |
          set -o pipefail
          python3 ./build_files/utils/make_update.py --no-blender --use-ios-libraries 2>&1 \
            | tail -40
          echo "--- lib/ios_arm64 ---"
          ls lib/ios_arm64 2>/dev/null || echo "MISSING: no iOS libraries were fetched"
          # Which static libraries are actually in there, by name. Run 7's link
          # wanted Imath, OpenColorIO, OpenVDB and TBB and could not find them;
          # whether that is because they are absent or because the `find` the
          # link steps use does not reach them is a question one listing
          # answers, and it costs a second.
          echo "--- archives available to link against ---"
          find lib/ios_arm64 -name '*.a' -not -path '*/python/*' -not -path '*/openpgl/*' 2>/dev/null \
            | xargs -n1 basename | sort -u | tr '\n' ' '
          echo

      # M298 — the shim becomes a Cycles target rather than a thing compiled
      # beside Cycles with flags guessed from the outside. See append.cmake for
      # what run 4 proved about guessing them.
      - name: Graft the shim into Cycles' tree
        run: |
          mkdir -p blender/intern/cycles/shim
          cp backend/cycles/shim/cycles_shim.cpp backend/cycles/shim/cycles_shim.h \
             blender/intern/cycles/shim/
          cat backend/cycles/shim/append.cmake >> blender/intern/cycles/CMakeLists.txt
          tail -5 blender/intern/cycles/CMakeLists.txt

      # M320 — the iOS Metal kernel-loading fixes, from Toemeler/blender-iOS-ipa.
      # Without them the first render compiles for minutes and NOTHING PERSISTS,
      # so every launch pays it again; with them it is paid once per install.
      # See backend/cycles/patches/ios_metal.py for what each edit is and which
      # on-device failure found it. Self-verifying: any anchor that does not
      # match exactly once fails the build rather than silently doing nothing.
      - name: Patch Cycles for iOS kernel loading
        run: python3 backend/cycles/patches/ios_metal.py

      - name: Configure (iOS device, arm64)
        run: |
          set -o pipefail
          cmake -S blender -B build_ios -G Xcode \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_CYCLES=ON \
            -DWITH_OPENIMAGEDENOISE=OFF \
            -DWITH_OPENVDB=OFF \
            -DWITH_NANOVDB=OFF \
            -DWITH_ALEMBIC=OFF \
            -DWITH_USD=OFF \
            -DWITH_CYCLES_OSL=OFF \
            -DWITH_CYCLES_PATH_GUIDING=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="" \
            ${{ github.event.inputs.extra_cmake_args }} 2>&1 | tee configure.log | tail -40
          echo "=== Cycles feature report ==="
          grep -iE "WITH_CYCLES|Rendering \(Cycles\)" configure.log || true

      # THE POINT OF THE FIRST RUN. Whatever happens below, this list is what
      # tells us the real target names.
      - name: List every target the tree offers
        run: |
          xcodebuild -list -project build_ios/Blender.xcodeproj 2>/dev/null > targets.txt || true
          if [ ! -s targets.txt ]; then
            cmake --build build_ios --target help 2>/dev/null > targets.txt || true
          fi
          echo "=== targets containing 'cycles' ==="
          grep -i cycles targets.txt || echo "(none matched — read the artifact)"
          wc -l targets.txt

      - name: Build the Cycles libraries
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          # Ordered roughly by dependency depth. Each is attempted; a name that
          # does not exist is reported and skipped rather than ending the run,
          # because the list above is worth more than a clean early exit.
          for t in cycles_util cycles_graph cycles_bvh cycles_subd \
                   cycles_scene cycles_integrator cycles_session \
                   cycles_device cycles_kernel \
                   bf_intern_guardedalloc bf_intern_sky; do
            echo "=== $t ==="
            cmake --build build_ios --config Release --target "$t" -- -quiet -jobs 3 \
              2>&1 | tail -8 || echo "FAILED: $t"
          done

      # THE SHIM GETS ITS OWN STEP, AND ITS OWN LOG.
      #
      # Runs 6 and 7 both failed here, and both times the error was buried in
      # the middle of a twelve-hundred-line job log — behind the nine
      # libraries' output and in front of the link probe's thousand lines of
      # undefined symbols. Reading it cost more than the build did. The
      # compile errors are the only thing this job produces that cannot be
      # guessed, so they are captured on their own and printed filtered to the
      # lines that actually say `error:`.
      - name: Build the shim
        id: shim
        continue-on-error: true
        run: |
          cmake --build build_ios --config Release --target cycles_shim \
            -- -quiet -jobs 3 > shim_build.log 2>&1 || true
          if [ -f build_ios/lib/Release/libcycles_shim.a ]; then
            echo "shim: COMPILED"
          else
            echo "shim: FAILED — errors below"
            grep -E "error:|fatal error:" shim_build.log | head -40 || true
          fi

      - name: Harvest whatever archives exist
        if: always()
        run: |
          mkdir -p out
          find build_ios \( -name "libcycles*.a" -o -name "libbf_intern_guardedalloc.a" \
                            -o -name "libbf_intern_sky.a" \) -print -exec cp {} out/ \; || true
          echo "=== harvested ==="
          ls -la out || true
          for f in out/*.a; do [ -e "$f" ] || continue; echo "--- $f"; lipo -info "$f" || true; done

      # ---------------------------------------------------------------------
      # RUN 2's QUESTION: does the dependency set CLOSE?
      # ---------------------------------------------------------------------
      #
      # Nine archives that compiled prove the sources are iOS-clean. They do
      # not prove the app can LINK them: Cycles pulls in Embree, TBB,
      # OpenImageIO and OpenColorIO, and an unresolved symbol only shows up
      # when something actually tries to produce a binary.
      #
      # No Cycles headers and no Cycles API call here, deliberately. `-all_load`
      # forces every object out of every archive into the link, so every
      # undefined symbol in all nine libraries has to resolve against the
      # dependency set — which is exactly the question — and it asks it without
      # a compile line that would need include paths and feature defines
      # guessed correctly first. A failure prints the missing symbols, and the
      # missing symbols name the library that is not being fetched.
      # WHY THE DEPENDENCY LIST IS REPEATED THREE TIMES, in both link steps.
      #
      # Apple's linker walks static archives once, in the order given, pulling
      # only the members that resolve something already undefined. `find`
      # produces them in directory order, so a library that comes before its
      # user is walked before anything needs it and is never revisited. Run 7's
      # missing Imath, OpenColorIO and TBB symbols look exactly like absent
      # libraries and may simply be libraries that arrived too early. There is
      # no --start-group on this platform; repeating the list is how it is
      # done, and it costs nothing but argv.
      #
      # RUN 6 ANSWERED THIS ONE, AND IT DID NOT CLOSE. Everything resolved
      # except OpenImageDenoise:
      #
      #   "_oidnSetFilterImage", referenced from:
      #       ccl::OIDNDenoiseContext::denoise_pass(ccl::PassType)
      #           in libcycles_integrator.a[5](denoiser_oidn.o)
      #
      # `lib/ios_arm64` does not ship OIDN — Blender's own iOS branch does not
      # denoise — so `cycles_integrator` was compiling a denoiser against a
      # library that is not there. `-DWITH_OPENIMAGEDENOISE=OFF` above drops
      # those two translation units instead of hunting for an iOS build of a
      # denoiser this app has no use for. OpenVDB, NanoVDB, Alembic, USD and
      # OSL go off beside it for the same reason and a stronger one: this
      # renders triangles out of a CAD kernel. There are no volumes, no
      # cached point clouds and no shader scripts to be had, so every one of
      # those is a dependency chain carried into an iPad app to compile code
      # nothing will ever call: at CAD sample counts on a static
      # viewport, converging is cheaper than denoising, and a denoiser would
      # smear exactly the crisp machined edges the render is for.
      #
      # The 15.0-vs-16.0 warnings in the same log were the other finding: the
      # Blender tree builds its objects at iOS 16, so the probes link at 16
      # too. Warnings only, but they would have become the app's problem.
      - name: Link probe — do the archives resolve against the iOS deps?
        id: link
        continue-on-error: true
        run: |
          set -o pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo 'int main(void){return 0;}' > probe.c
          # Run 3 failed here, and usefully:
          #
          #   ld: building for 'iOS', but linking in object file
          #       (lib/ios_arm64/python/lib/python3.11/site-packages/numpy/
          #        core/lib/libnpymath.a) built for 'macOS'
          #
          # The blanket `find ... -name '*.a'` swept up Python's site-packages,
          # which carry HOST numpy — the very macOS-vs-iOS mismatch the
          # blender-iOS-ipa pipeline has to fix for its own build. Cycles needs
          # none of Python; excluding that tree is both the fix and the truth.
          # ARCHIVES AND DYLIBS BOTH. Run 9 settled what runs 7 and 8 could
          # only guess at: lib/ios_arm64 contains no libOpenImageIO.a, no
          # libOpenColorIO.a, no libtbb.a and no libImath.a — the four
          # libraries whose symbols were missing are not static archives in
          # this package at all. Everything else Cycles wanted (embree, pugixml,
          # openpgl, the image codecs) is right there as a .a. So either they
          # ship as dylibs or they are absent, and a `find` for both answers it.
          # Archives are repeated three times because Apple's linker walks
          # each once, in order, and never revisits one that came before its
          # user. Dylibs need no such thing — their whole symbol table is
          # visible at once — and repeating them only earns duplicate-library
          # warnings.
          ARCH=$(find blender/lib/ios_arm64 -name '*.a' -not -path '*/python/*' -not -path '*/openpgl/*' 2>/dev/null | tr '\n' ' ')
          DYLIB=$(find blender/lib/ios_arm64 -name '*.dylib' -not -path '*/python/*' -not -name 'libtbbmalloc_proxy.dylib' 2>/dev/null | tr '\n' ' ')
          DEPS="$ARCH $ARCH $ARCH $DYLIB"
          echo "deps: $(echo $ARCH | wc -w) archives, $(echo $DYLIB | wc -w) dylibs"
          # force_load per Cycles archive rather than a global -all_load: the
          # question is whether the CYCLES objects resolve, and dragging every
          # object of every dependency in as well only invents work and more
          # ways to fail.
          FORCE=""
          for a in out/*.a; do FORCE="$FORCE -Wl,-force_load,$a"; done
          set +e
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -isysroot "$SDK" \
            probe.c $FORCE $DEPS \
            -lc++ -lz -framework Metal -framework Foundation \
            -framework CoreGraphics -framework IOKit \
            -framework AudioToolbox -framework AVFoundation -framework CoreAudio \
            -framework CoreMedia -framework VideoToolbox \
            -o probe.bin 2> link.log
          RC=$?
          set -e
          echo "link exit: $RC"
          if [ $RC -eq 0 ]; then
            echo "all-archive link: CLOSED"
          else
            # Only WHICH symbols are missing, deduplicated — not every
            # instantiation that references each. A thousand OpenVDB template
            # names in the job log say nothing the first three did not, and
            # -force_load asks a harsher question than the app does anyway.
            echo "all-archive link: open (informational — the shim link below"
            echo "                  is the one that decides anything)"
            echo "--- unresolved, deduplicated ---"
            grep -oE '"[^"]+", referenced from' link.log \
              | sed -E 's/^"//; s/", referenced from$//' \
              | cut -c1-70 | sort -u | head -25 || true
          fi
          echo "=== Metal device present in libcycles_device.a? ==="
          nm -gU out/libcycles_device.a 2>/dev/null | grep -ci metal || echo 0

      - name: Did the shim compile?
        run: |
          if [ -f build_ios/lib/Release/libcycles_shim.a ]; then
            echo "COMPILED as a Cycles target."
            ls -la build_ios/lib/Release/libcycles_shim.a
            lipo -info build_ios/lib/Release/libcycles_shim.a
            nm -gU build_ios/lib/Release/libcycles_shim.a | grep -E "_cy_(render|available|device_name|set_resource_path|last_error)" || true
          else
            echo "NOT BUILT — see the build log above for the compile errors."
          fi

      # The last question the app cannot answer without being rebuilt: does a
      # program that CALLS the shim link against the whole set?
      - name: Link a program that uses the shim
        continue-on-error: true
        run: |
          set -o pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          test -f build_ios/lib/Release/libcycles_shim.a || exit 0
          ARCH=$(find blender/lib/ios_arm64 -name '*.a' -not -path '*/python/*' -not -path '*/openpgl/*' 2>/dev/null | tr '\n' ' ')
          DYLIB=$(find blender/lib/ios_arm64 -name '*.dylib' -not -path '*/python/*' -not -name 'libtbbmalloc_proxy.dylib' 2>/dev/null | tr '\n' ' ')
          DEPS="$ARCH $ARCH $ARCH $DYLIB"
          set +e
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -I backend/cycles/shim backend/cycles/shim/shim_probe.c \
            -Wl,-force_load,build_ios/lib/Release/libcycles_shim.a \
            out/*.a $DEPS -lc++ -lz \
            -framework Metal -framework Foundation -framework CoreGraphics -framework IOKit \
            -framework AudioToolbox -framework AVFoundation -framework CoreAudio \
            -framework CoreMedia -framework VideoToolbox \
            -Wl,-dead_strip_dylibs -o shim_probe.bin 2> shim_link.log
          RC=$?
          set -e
          echo "link exit: $RC"
          if [ $RC -eq 0 ]; then
            echo "LINKED. A program that calls Cycles builds for iOS arm64."
            lipo -info shim_probe.bin
            ls -la shim_probe.bin
          else
            echo "=== unresolved, deduplicated ==="
            grep -oE '"[^"]+", referenced from' shim_link.log \
              | sed -E 's/^"//; s/", referenced from$//' \
              | cut -c1-70 | sort -u | head -30 || true
            echo "=== tail ==="
            tail -4 shim_link.log
          fi

      - name: Upload the probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycles-ios-probe
          path: |
            out
            targets.txt
            configure.log
            link.log
            shim_link.log
            shim_build.log
          if-no-files-found: warn
          retention-days: 14

      # LAST, ON PURPOSE. Every reading of this job so far has been a fight to
      # find three facts inside a thousand lines that scrolled past them. They
      # are reprinted here, at the end, where a tail finds them.
      - name: Summary
        if: always()
        run: |
          echo "=================== SUMMARY ==================="
          # Answered and no longer printed: the shim compiles (run 8); the
          # four libraries that would not resolve are dylibs, not absent
          # (run 9); they carry @rpath install names and are built for iOS
          # with minos 15.0, so the app can embed them with a plain copy
          # (run 11). What is left is one question.
          if [ -f build_ios/lib/Release/libcycles_shim.a ]; then
            echo "shim compiled: YES"
          else
            echo "shim compiled: NO"
            grep -E "error:|fatal error:" shim_build.log | head -20 || true
          fi
          if [ -f shim_probe.bin ]; then
            echo "shim links:    YES"
            lipo -info shim_probe.bin
            echo "--- what it loads at runtime ---"
            otool -L shim_probe.bin | tail -n +2 | awk '{print $1}' | head -30
          else
            echo "shim links:    NO"
            echo "--- undefined, if any ---"
            grep -oE '"[^"]+", referenced from' shim_link.log \
              | sed -E 's/^"//; s/", referenced from$//' | cut -c1-60 | sort -u | head -12 || true
            echo "--- what ld actually said ---"
            grep -vE "^ld: warning: (ignoring duplicate|object file)" shim_link.log | tail -15 || true
          fi
          echo "=============================================="
