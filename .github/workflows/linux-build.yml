name: Linux app build  # the desktop port of the same app the iOS job builds

# The iOS job (m1-core-build.yml) is the reference. This one builds the SAME
# Dart tree for the GTK embedder, the SAME three kernels for x86-64, and
# packages the result. It deliberately does NOT re-run `flutter analyze` or the
# host test suite: m1-core-build's `dart-checks` job already does both on an
# ubuntu runner, and a second copy would be a second thing to keep in step.
#
# The three jobs exist because their costs differ by two orders of magnitude:
#
#   occt      ~40 min, changes when the submodule pin changes    -> cached
#   kernels   ~4 min,  changes when backend/ changes
#   app       ~6 min,  changes on every commit
#
# with the OCCT install tree carried between them as an artifact rather than
# rebuilt. A cache miss costs one long run; a hit costs a download.

on:
  push:
    branches: [ main, 'claude/**' ]
    # Path filters do not apply to tag pushes, so a `v*` tag always builds.
    tags: [ 'v*' ]
    paths-ignore: [ '**.md' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Publish a GitHub Release at this tag from the ref being built
          (e.g. v0.1.0-linux.1). Leave empty to build without releasing.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump when the OCCT pin or the flag set below changes — the key is what
  # decides whether a 40-minute build runs.
  OCCT_CACHE_KEY: occt-linux-V7_9_3-r1

jobs:
  occt:
    name: OpenCASCADE (static, x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      cache-key: ${{ env.OCCT_CACHE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore the OCCT install tree
        id: occt-cache
        uses: actions/cache@v4
        with:
          path: backend/occt/install-linux
          key: ${{ env.OCCT_CACHE_KEY }}

      - name: Fetch the pinned submodule (cache miss only)
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 -- backend/occt/upstream

      - name: Install build tools (cache miss only)
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++

      - name: Build (cache miss only)
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: tools/desktop/build_native.sh --occt-only

      # An artifact as well as a cache. The cache is keyed and shared across
      # runs; the artifact is what the next JOB in THIS run downloads, and it
      # exists because a cache written by a job is not visible to a job that
      # started at the same time.
      - name: Upload the install tree
        uses: actions/upload-artifact@v4
        with:
          name: occt-install-linux
          path: backend/occt/install-linux
          retention-days: 5

  kernels:
    name: CAD kernels (libprototype_native.so)
    needs: occt
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev

      - uses: actions/download-artifact@v4
        with:
          name: occt-install-linux
          path: backend/occt/install-linux

      - name: Build the kernel library
        run: tools/desktop/build_native.sh

      # The verdict is the MARKER, not the exit code — the same discipline the
      # OCCT and QCAD smokes use in the iOS job, and for the same reason: a
      # process that dies inside a kernel exits non-zero for reasons that say
      # nothing about how far it got. build_native.sh already greps for it;
      # this repeats the check so the failure names itself in the job summary.
      - name: Kernel smoke verdict
        run: |
          log=frontend/build/native/native-smoke.log
          cat "$log"
          grep -q "NATIVE SMOKE: PASS" "$log" \
            || { echo "LINUX KERNELS: FAIL"; exit 1; }
          echo "LINUX KERNELS: PASS"

      # Nothing but the three C APIs may leave this library. A regression here
      # is silent — the app still works — and expensive: several hundred
      # thousand exported symbols to relocate at every launch, and a real
      # chance of colliding with a different Qt or OCCT already in the process.
      - name: Exported surface is only the C API
        run: |
          set -o pipefail
          lib=frontend/build/native/libprototype_native.so
          nm -D --defined-only "$lib" | awk '{print $3}' | grep -v '^$' \
            > /tmp/exported.txt
          echo "exported symbols: $(wc -l < /tmp/exported.txt)"
          if grep -vE '^(qcad_|slvs_|occt_)' /tmp/exported.txt \
               | grep -vE '^(_init|_fini|_edata|_end|__bss_start)$' \
               | head -20 | grep .; then
            echo "LINUX KERNELS: FAIL (symbols leaked past the version script)"
            exit 1
          fi
          echo "EXPORT CHECK: PASS"

      # The LIBRARY and what it needs at run time, not the build tree that made
      # them. `frontend/build/native` also holds ~21 MB of CMake scratch and
      # static archives that the app job has no use for, and an artifact is
      # uploaded and downloaded once each.
      - uses: actions/upload-artifact@v4
        with:
          name: prototype-kernels-linux
          path: |
            frontend/build/native/libprototype_native.so
            frontend/build/native/deps
            frontend/build/native/native-smoke.log
          retention-days: 5

  app:
    name: Flutter Linux bundle + package
    needs: kernels
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The GTK embedder's own dependencies, plus the ones the app reaches for
      # at RUN time: zenity backs file_picker's Linux implementation (the
      # import path in the ribbon and in Settings), and xvfb is what lets the
      # launch check below run at all on a headless runner.
      - name: Install the GTK toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev zenity xvfb

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: prototype-kernels-linux
          path: frontend/build/native

      - name: flutter pub get
        working-directory: frontend
        run: flutter pub get

      - name: Build the release bundle
        working-directory: frontend
        run: flutter build linux --release

      # The gate that matters: the app has to LAUNCH, find the kernels and
      # reach its first frame. Every failure this catches — a missing plugin
      # registration, a kernel the search order does not reach, an exception in
      # AppState.init — produces a bundle that builds perfectly and then does
      # nothing on a user's machine.
      #
      # The verdict comes out of the app's OWN log file, which is the same file
      # a bug bundle carries, so a red run here is diagnosed with exactly the
      # material a user's report would carry.
      - name: Launch check (Xvfb)
        run: |
          set -o pipefail
          Xvfb :99 -screen 0 1600x1200x24 &
          sleep 3
          export DISPLAY=:99
          frontend/build/linux/x64/release/bundle/prototype \
            > /tmp/launch.log 2>&1 &
          app=$!
          # Wait for the app to SAY it is up rather than for a fixed sleep: it
          # reaches its first frame in about 120 ms on this hardware, and a
          # blanket timeout would spend ninety seconds proving it every run —
          # while still being too short on a runner having a bad day.
          for _ in $(seq 1 60); do
            grep -q "time to first frame" /tmp/launch.log && break
            sleep 1
          done
          kill "$app" 2>/dev/null || true
          wait "$app" 2>/dev/null || true
          echo "--- last 60 lines ---"
          tail -60 /tmp/launch.log
          grep -q "time to first frame" /tmp/launch.log \
            || { echo "LINUX LAUNCH: FAIL (no first frame)"; exit 1; }
          # The kernels have to be the REAL ones. Without this the job stays
          # green on a bundle that silently fell back to the Dart engine, which
          # is precisely the regression the packaging step can introduce.
          grep -q "REAL backend active (qcad-ffi)" /tmp/launch.log \
            || { echo "LINUX LAUNCH: FAIL (QCAD core not loaded)"; exit 1; }
          grep -q "DART SMOKE: PASS" /tmp/launch.log \
            || { echo "LINUX LAUNCH: FAIL (backend smoke did not pass)"; exit 1; }
          echo "LINUX LAUNCH: PASS"

      - name: Package
        run: tools/desktop/package_linux.sh --skip-flutter --appimage

      - uses: actions/upload-artifact@v4
        with:
          name: prototype-linux-x64
          path: |
            dist/prototype-linux-x64.tar.gz
            dist/Prototype-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  # -------------------------------------------------------------------------
  # The release
  # -------------------------------------------------------------------------
  #
  # Two ways in, and the difference between them is the OCCT cache.
  #
  #   workflow_dispatch with `release_tag`  runs on the BRANCH ref, so the
  #                                         40-minute OCCT cache is visible and
  #                                         the run costs a download. The tag
  #                                         is created by `gh release create`
  #                                         at the commit that was built.
  #   pushing a `v*` tag                    runs on the TAG ref, which can only
  #                                         see its own caches and the default
  #                                         branch's — so on a feature branch
  #                                         it rebuilds OCCT from source.
  #
  # Prefer the first until this branch is merged. Both publish exactly the same
  # artifacts, because both take them from the `app` job above rather than
  # building anything of their own.
  release:
    name: Publish a GitHub Release
    needs: app
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # The only job in this workflow that writes anything to the repository.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: prototype-linux-x64
          path: dist

      # The tag goes IN THE FILENAME. A shared build called
      # `Prototype-x86_64.AppImage` is indistinguishable from every other one
      # in a downloads folder, and the first question about a bug report is
      # always which build it came from.
      - name: Name the assets after the tag
        id: assets
        run: |
          set -euo pipefail
          tag='${{ inputs.release_tag }}'
          [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          cd dist
          mv prototype-linux-x64.tar.gz "prototype-$tag-linux-x64.tar.gz"
          mv Prototype-x86_64.AppImage "Prototype-$tag-x86_64.AppImage"
          # Anyone who downloads a binary from a link should be able to check
          # it against the run that produced it.
          sha256sum "prototype-$tag-linux-x64.tar.gz"                     "Prototype-$tag-x86_64.AppImage" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
        run: |
          set -euo pipefail
          # A QUOTED heredoc, with the values substituted afterwards: the notes
          # are full of backticks, and an unquoted heredoc would read every one
          # of them as the start of a command substitution.
          cat > /tmp/notes.md <<'NOTES'
          The Linux build of the app — the same Flutter tree, the same three
          CAD kernels (QCAD core, libslvs, OCCT 7.9.3) and the same Liquid
          Glass chrome as the iPad, built for x86-64 GTK.

          Built from `@REF@` at `@SHA@`, by [this run](@RUN@) — which launched
          it on a headless display and checked that all three kernels came up
          before it packaged anything.

          ## Which file

          **`Prototype-@TAG@-x86_64.AppImage`** — one file. `chmod +x` it and
          run it.

          **`prototype-@TAG@-x86_64.tar.gz`** — the same tree, unpacked.
          `./install.sh` puts it in `~/.local` with its icon, its desktop entry
          and the `.ptp` / `.pts` / `.pas` file associations; `./uninstall.sh`
          takes it back out and leaves your documents alone. Or just run
          `./prototype` out of the folder.

          ## What it wants from the system

          The GTK 3 stack, which a desktop already has. Qt and OCCT travel
          inside the bundle — the app needs versions no distribution
          guarantees — so there is nothing else to install. `zenity` is worth
          having: it is what backs the file chooser.

          The chrome is a real shader rather than a picture of one, and it
          costs two backdrop passes per surface. On a machine with no GPU worth
          the name — a VM, a remote desktop, an old integrated chip — start it
          with `PROTOTYPE_GLASS=0` and it draws the painted panels instead.

          Checksums are in `SHA256SUMS.txt`.

          Not here yet: the path-traced Cycles render, which is Metal-only so
          far. See `LINUX.md` in the tree for what is shared with the iPad and
          what had to be written twice.
          NOTES
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          sed -i -e "s|@TAG@|${TAG}|g" \
                 -e "s|@REF@|${GITHUB_REF_NAME}|g" \
                 -e "s|@SHA@|${GITHUB_SHA:0:12}|g" \
                 -e "s|@RUN@|${run_url}|g" /tmp/notes.md
          cat /tmp/notes.md
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Prototype for Linux — $TAG" \
            --notes-file /tmp/notes.md \
            --prerelease \
            dist/*.AppImage dist/*.tar.gz dist/SHA256SUMS.txt
          echo "released: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG"
